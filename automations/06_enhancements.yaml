  actions:
  - action: button.press
    target:
      entity_id: button.vf9_rllv2cja5rh000847_tim_tram_sac
  - delay: "00:00:15"
  - variables:
      soc: "{{ states('sensor.vf9_rllv2cja5rh000847_phan_tram_pin') | default(0,true) | float(0) }}"
      nearby: "{{ states('sensor.vf9_rllv2cja5rh000847_tram_sac_lan_can') | default('searching...', true) }}"
