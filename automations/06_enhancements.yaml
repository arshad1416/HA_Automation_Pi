# =============================================================================
# VF9-SPECIFIC AUTOMATIONS (VinFast VF9, VIN RLLV2CJA5RH000847)
# Added 2026-07-30. These use VF9-native entities (tire pressure, doors,
# climate buttons, security, trip efficiency, software versions, etc.) and
# complement the cross-vehicle EV automations above.
#
# State-value notes (VinFast integration reports string states on sensors):
#   - Charging status (trang_thai_sac): "Charging" when active.
#   - Door/window/trunk/hood sensors: open-ish states treated as open when
#     lowercased state is in ['open','on','mo'].
#   - Tire pressure threshold 32 is PSI-equivalent (units TBD per integration).
#   - "unknown"/"unavailable"/"none" states are filtered before numeric compare.
# =============================================================================

# V1: Tire pressure low alert. Checks all four tires and reports which are low.
- id: vf9_tire_pressure_alert
  alias: "VF9: Tire pressure low alert"
  description: >-
    When any VF9 tire pressure sensor changes, check all four tires and alert
    if any reads below 32 PSI. Reports which tire(s) are low.
  mode: single
  triggers:
  - entity_id: sensor.vf9_rllv2cja5rh000847_ap_suat_lop_truoc_trai
    trigger: state
    id: front_left
  - entity_id: sensor.vf9_rllv2cja5rh000847_ap_suat_lop_truoc_phai
    trigger: state
    id: front_right
  - entity_id: sensor.vf9_rllv2cja5rh000847_ap_suat_lop_sau_trai
    trigger: state
    id: rear_left
  - entity_id: sensor.vf9_rllv2cja5rh000847_ap_suat_lop_sau_phai
    trigger: state
    id: rear_right
  conditions:
  - condition: template
    value_template: "{{ trigger.to_state.state not in ['unknown','unavailable','none',''] }}"
  actions:
  - variables:
      fl: "{{ states('sensor.vf9_rllv2cja5rh000847_ap_suat_lop_truoc_trai') | default(0,true) | float(0) }}"
      fr: "{{ states('sensor.vf9_rllv2cja5rh000847_ap_suat_lop_truoc_phai') | default(0,true) | float(0) }}"
      rl: "{{ states('sensor.vf9_rllv2cja5rh000847_ap_suat_lop_sau_trai') | default(0,true) | float(0) }}"
      rr: "{{ states('sensor.vf9_rllv2cja5rh000847_ap_suat_lop_sau_phai') | default(0,true) | float(0) }}"
      # UNIT-AGNOSTIC ON PURPOSE. The vinfast integration publishes these in BAR
      # (const_vf8.py tyre block) with original_device_class=pressure. An entity-registry
      # unit override to psi is possible, but HA has been observed to drop that override
      # when the integration re-registers the entities — and the two units are not
      # interchangeable here: comparing a bar reading (~2.4) against 32 marks every tire
      # low on every MQTT push, which was the original bug (audit A7).
      #
      # So instead of depending on the registry, normalise: real tire pressures are
      # 1.7-3.1 bar / 25-45 psi, so anything under 6 is unambiguously bar.
      min_psi: 32
      fl_psi: "{{ (fl * 14.5038) if 0 < fl < 6 else fl }}"
      fr_psi: "{{ (fr * 14.5038) if 0 < fr < 6 else fr }}"
      rl_psi: "{{ (rl * 14.5038) if 0 < rl < 6 else rl }}"
      rr_psi: "{{ (rr * 14.5038) if 0 < rr < 6 else rr }}"
      low_list: >
        {{ (['Front-Left'] if 0 < fl_psi < min_psi else []) +
           (['Front-Right'] if 0 < fr_psi < min_psi else []) +
           (['Rear-Left'] if 0 < rl_psi < min_psi else []) +
           (['Rear-Right'] if 0 < rr_psi < min_psi else []) }}
  - condition: template
    value_template: "{{ low_list | length > 0 }}"
  - action: notify.grizzl_ev_phones
    data:
      title: "VF9 Tire Pressure Low"
      message: >-
        {{ low_list | join(', ') }} {{ 'tires are' if (low_list | length) > 1 else 'tire is' }}
        below {{ min_psi }} PSI. Values: FL={{ fl_psi | round(1) }}, FR={{ fr_psi | round(1) }},
        RL={{ rl_psi | round(1) }}, RR={{ rr_psi | round(1) }} PSI.

# V2: Security alerts. Two paths with deliberately different urgency.
- id: vf9_security_alarm_alert
  alias: "VF9: Security alarm alert"
  description: >-
    Two paths.
    (1) SECURITY STATUS — anything the integration reports other than Armed/Disarmed
        is a genuine alarm condition and announces immediately.
    (2) SECURITY WARNING — this sensor reports "Not locked" and "Open: <doors>"
        (vinfast api_mqtt.py builds it, "Safe" when nothing is wrong). Normal comings
        and goings put it into a warning state constantly, so it only notifies once
        the car has been continuously insecure for a full hour. A template trigger is
        used rather than a state trigger with `for:` because the warning STRING mutates
        as doors open and close ("Open: Driver Door" -> "Open: Driver Door, Trunk"),
        which would restart a state-trigger timer each time; the template stays true
        across those changes so the hour is continuous insecure time.
  mode: single
  triggers:
  - entity_id: sensor.vf9_rllv2cja5rh000847_trang_thai_an_ninh
    trigger: state
    id: alarm_status
  - trigger: template
    id: alarm_warning
    # Parked check is INSIDE the template on purpose, so the hour only accumulates
    # while the car is stationary. api_mqtt.py gates "Not locked" on gear == parked
    # but does NOT gate "Open: <doors/windows>" — without this, driving for an hour
    # with a window down would announce a security alert across the house.
    value_template: >
      {{ states('sensor.vf9_rllv2cja5rh000847_canh_bao_an_ninh')
           not in ['Safe','safe','unknown','unavailable','none','','None']
         and (states('sensor.vf9_rllv2cja5rh000847_toc_do_hien_tai') | float(-1)) == 0 }}
    for: "01:00:00"
  conditions: []
  actions:
  - choose:
    # --- (1) Genuine alarm status change: immediate ---
    - conditions:
      - condition: trigger
        id: alarm_status
      - condition: template
        value_template: >
          {# Armed/Disarmed are the NORMAL states (vinfast sensor.py: 34234_00001_00003). #}
          {{ trigger.to_state.state not in ['unknown','unavailable','none','','Normal','normal','Disarmed','disarmed','Armed','armed','Safe','safe','Off','off','None'] }}
      sequence:
      - action: notify.grizzl_ev_phones
        data:
          title: "VF9 Security Alert"
          message: "VF9 security status changed to: {{ trigger.to_state.state }}. Check your vehicle immediately."
      - action: notify.alexa_media
        data:
          data: {type: announce}
          message: "Security alert. The VinFast VF9 security status has changed to {{ trigger.to_state.state }}. Please check the vehicle immediately."
          target:
          - media_player.everywhere

    # --- (2) Left unlocked / something open, sustained 1 hour ---
    - conditions:
      - condition: trigger
        id: alarm_warning
      sequence:
      - variables:
          warning: "{{ states('sensor.vf9_rllv2cja5rh000847_canh_bao_an_ninh') }}"
      - action: notify.grizzl_ev_phones
        data:
          title: "VF9 Left Open / Unlocked"
          message: "VF9 has been {{ warning }} for the past hour while parked."
      - action: notify.alexa_media
        data:
          data: {type: announce}
          message: "The VinFast VF9 has been left {{ warning | replace('Open:', 'open at the') | replace('|', 'and') | lower }} for the past hour."
          target:
          - media_player.everywhere

# V3: RETIRED 2026-07-31 — superseded by the 1-hour warning branch of
# vf9_security_alarm_alert above.
#
# `vf9_door_open_when_parked` watched 10 entities individually (4 doors, trunk, hood,
# 4 windows). The integration's own api_security_warning sensor already aggregates
# exactly those 10 — see custom_components/vinfast/api_mqtt.py door_map (incl. Trunk
# and Hood) and window_map — plus "Not locked", so keeping both meant two phone pushes
# for the same event.
#
# It was also broken: after `delay: "01:00:00"` it re-checked `trigger.to_state.state`,
# which is a snapshot frozen at trigger time and therefore always still "open". The
# alert fired an hour later even if the door had been shut 59 minutes earlier
# (audit A6). The replacement re-evaluates live state continuously via a template
# trigger, so closing the door genuinely cancels the alert.
#
# Recover with: git show HEAD:automations/06_enhancements.yaml

# V4: Auto-lock doors when Arshad or Larissa departs.
- id: vf9_auto_lock_on_departure
  alias: "VF9: Auto-lock on departure"
  description: >-
    When Arshad or Larissa leaves home, press the VF9 lock doors button and notify.
  mode: single
  triggers:
  - entity_id: person.arshad14
    to: not_home
    trigger: state
    id: arshad
  - entity_id: binary_sensor.larissa_s_s22_presence
    to: 'off'
    trigger: state
    id: larissa
  conditions: []
  actions:
  - variables:
      who_left: "{{ 'Arshad' if trigger.id == 'arshad' else 'Larissa' }}"
  - action: button.press
    target:
      entity_id: button.vf9_rllv2cja5rh000847_khoa_cua
  - action: notify.mobile_app_cph2655
    data:
      title: "VF9 Locked"
      message: "{{ who_left }} left home. VF9 doors lock command sent."
  - action: notify.sm_s926w
    data:
      title: "VF9 Locked"
      message: "{{ who_left }} left home. VF9 doors lock command sent."

# V5: Battery health monitor. Alerts when SOH < 80 or degradation > 20.
- id: vf9_battery_health_monitor
  alias: "VF9: Battery health monitor"
  description: >-
    Alert when VF9 SOH drops below 80% or degradation rises above 20%. Reports
    SOH and degradation percentage.
  mode: single
  triggers:
  - entity_id: sensor.vf9_rllv2cja5rh000847_suc_khoe_pin_soh
    below: 80
    trigger: numeric_state
    id: soh_low
  - entity_id: sensor.vf9_rllv2cja5rh000847_do_chai_pin_theo_soh
    above: 20
    trigger: numeric_state
    id: degradation_high
  conditions: []
  actions:
  - variables:
      soh: "{{ states('sensor.vf9_rllv2cja5rh000847_suc_khoe_pin_soh') | default(0,true) | float(0) }}"
      deg: "{{ states('sensor.vf9_rllv2cja5rh000847_do_chai_pin_theo_soh') | default(0,true) | float(0) }}"
  - action: notify.mobile_app_cph2655
    data:
      title: "VF9 Battery Health"
      message: "{{ 'SOH low' if trigger.id == 'soh_low' else 'Degradation high' }}. SOH: {{ soh }}%, degradation: {{ deg }}%. Consider battery service."

# V6: Charging session summary (enhanced reconciliation).
- id: vf9_charging_session_summary
  alias: "VF9: Charging session summary"
  description: >-
    Enhanced VF9 charging reconciliation. When charging stops, report SoC at
    plug-in and unplug, energy delivered, average power, charging efficiency,
    and cost.
  mode: single
  triggers:
  - entity_id: sensor.vf9_rllv2cja5rh000847_trang_thai_sac
    from: 'Charging'
    for: "00:02:00"
    trigger: state
  conditions: []
  actions:
  - variables:
      soc_plug_in: "{{ states('sensor.vf9_rllv2cja5rh000847_pin_luc_cam_sac_lan_cuoi') | default('unknown', true) }}"
      soc_unplug: "{{ states('sensor.vf9_rllv2cja5rh000847_pin_luc_rut_sac_lan_cuoi') | default('unknown', true) }}"
      # Per-SESSION grid energy — see note in ev_vf9_soc_energy_reconciliation.
      energy_kwh: "{{ states('sensor.vf9_rllv2cja5rh000847_dien_nang_lay_tu_luoi_lan_cuoi') | default(0,true) | float(0) }}"
      lifetime_kwh: "{{ states('sensor.vf9_rllv2cja5rh000847_dien_nang_sac_tai_nha') | default(0,true) | float(0) }}"
      avg_power: "{{ states('sensor.vf9_rllv2cja5rh000847_cong_suat_sac_trung_binh_lan_cuoi') | default(0,true) | float(0) }}"
      efficiency: "{{ states('sensor.vf9_rllv2cja5rh000847_hieu_suat_sac_thuc_te_lan_cuoi') | default('unknown', true) }}"
      # VNĐ-denominated cost sensors deliberately dropped from this message — the
      # Grizzl-E meter is the CAD source of truth for home charging (audit T3).
      soc_now: "{{ states('sensor.vf9_rllv2cja5rh000847_phan_tram_pin') | default(0,true) | float(0) }}"
  - action: notify.grizzl_ev_phones
    data:
      title: "VF9 Charging Summary"
      message: >
        Session ended. SoC: {{ soc_plug_in }}% -> {{ soc_unplug }}% (now {{ soc_now }}%).
        Energy: {{ energy_kwh | round(2) }} kWh (lifetime home: {{ lifetime_kwh | round(0) }} kWh).
        Avg power: {{ avg_power | round(1) }} kW. Efficiency: {{ efficiency }}.
        Cost is tracked in CAD by the Grizzl-E meter — the VF9's own VNĐ figures are not shown.

# V7: Low battery charger finder. Presses find-station button, then reports.
- id: vf9_low_battery_charger_finder
  alias: "VF9: Low battery charger finder"
  description: >-
    When VF9 SoC drops below 20%, press the Find Charging Station button and
