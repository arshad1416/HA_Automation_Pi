    id: interior_temp
  conditions:
  - condition: template
    value_template: "{{ states('sensor.vf9_rllv2cja5rh000847_che_do_thu_cung_pet') | default('',true) | lower in ['on','active','enabled','bat'] }}"
  - condition: template
    value_template: "{{ trigger.to_state.state not in ['unknown','unavailable','none',''] }}"
  - condition: template
    value_template: "{{ trigger.to_state.state | float(999) > 35 or trigger.to_state.state | float(999) < 0 }}"
  actions:
  - variables:
      temp: "{{ trigger.to_state.state | float(0) }}"
  - action: notify.mobile_app_cph2655
    data:
      title: "VF9 Pet Safety Alert"
      message: "Pet Mode active but interior temp is {{ temp }}C. Check on your pet immediately."
  - action: notify.alexa_media
    data:
      data: {type: announce}
      message: "Pet safety alert. The VF9 interior temperature is {{ temp }} degrees. Check your pet immediately."
      target:
      - media_player.everywhere

# V10: Trip efficiency report. Fires when trip energy updates (new trip).
- id: vf9_trip_efficiency_report
  alias: "VF9: Trip efficiency report"
  description: >-
    When trip energy consumption changes (new trip completed), report trip
    energy, efficiency vs lifetime average, and distance if available.
  mode: single
  triggers:
  - entity_id: sensor.vf9_rllv2cja5rh000847_dien_nang_tieu_thu_trip
    trigger: state
    id: trip_energy
  conditions:
  - condition: template
    value_template: "{{ trigger.to_state.state not in ['unknown','unavailable','none','','0','0.0'] }}"
  actions:
  - variables:
      trip_energy: "{{ trigger.to_state.state | default(0,true) | float(0) }}"
      trip_eff: "{{ states('sensor.vf9_rllv2cja5rh000847_hieu_suat_tieu_thu_trip') | default('unknown', true) }}"
      lifetime_eff: "{{ states('sensor.vf9_rllv2cja5rh000847_hieu_suat_tieu_thu_trung_binh_xe') | default('unknown', true) }}"
      trip_dist: "{{ states('sensor.vf9_rllv2cja5rh000847_quang_duong_chuyen_di_trip') | default('unknown', true) }}"
  - action: notify.mobile_app_cph2655
    data:
      title: "VF9 Trip Report"
      message: >
        Trip complete. Energy: {{ trip_energy | round(2) }} kWh.
        Efficiency: {{ trip_eff }} Wh/km (lifetime avg {{ lifetime_eff }}).
        {{ 'Distance: ' ~ trip_dist ~ ' km.' if trip_dist not in ['unknown','none'] else '' }}

# V11: Weekly charging cost summary (Sunday 20:00).
- id: vf9_charging_cost_weekly_summary
  alias: "VF9: Weekly charging cost summary"
  description: >-
    Every Sunday at 20:00, report total VF9 charging cost, home vs station
    sessions, kWh charged, and equivalent gas savings.
  mode: single
  triggers:
  - at: "20:00:00"
    trigger: time
  conditions:
  - condition: template
    value_template: "{{ now().isoweekday() == 7 }}"
  actions:
  - variables:
      total_cost: "{{ states('sensor.vf9_rllv2cja5rh000847_tong_chi_phi_sac_quy_doi') | default(0,true) | float(0) }}"
      trip_cost: "{{ states('sensor.vf9_rllv2cja5rh000847_chi_phi_sac_chuyen_di') | default(0,true) | float(0) }}"
      total_kwh: "{{ states('sensor.vf9_rllv2cja5rh000847_tong_dien_nang_da_sac') | default(0,true) | float(0) }}"
      home_kwh: "{{ states('sensor.vf9_rllv2cja5rh000847_dien_nang_sac_tai_nha') | default(0,true) | float(0) }}"
      gas_equiv: "{{ states('sensor.vf9_rllv2cja5rh000847_tong_chi_phi_xang_tuong_duong') | default(0,true) | float(0) }}"
  - action: notify.grizzl_ev_phones
    data:
      title: "VF9 Weekly Charging Summary"
      message: >
        This week: {{ total_kwh | round(1) }} kWh charged ({{ home_kwh | round(1) }} at home).
        Total charging cost: {{ total_cost }}. Trip cost: {{ trip_cost }}.
        Equivalent gas cost: {{ gas_equiv }}. Savings: {{ (gas_equiv - total_cost) | round(2) }}.

# V12: Software update alert. Fires when FRP or T-Box version changes.
- id: vf9_software_update_alert
  alias: "VF9: Software update alert"
  description: >-
    When the VF9 firmware (FRP) or T-Box version changes, notify about the new
    software update.
  mode: single
  triggers:
  - entity_id: sensor.vf9_rllv2cja5rh000847_phien_ban_phan_mem_frp
    trigger: state
    id: frp
  - entity_id: sensor.vf9_rllv2cja5rh000847_phien_ban_t_box
    trigger: state
    id: tbox
  conditions:
  - condition: template
    value_template: "{{ trigger.to_state.state not in ['unknown','unavailable','none',''] and trigger.from_state.state not in ['unknown','unavailable','none',''] }}"
  actions:
  - variables:
      component: "{{ 'Firmware (FRP)' if trigger.id == 'frp' else 'T-Box' }}"
  - action: notify.mobile_app_cph2655
    data:
      title: "VF9 Software Update"
      message: "VF9 {{ component }} updated: {{ trigger.from_state.state }} -> {{ trigger.to_state.state }}."

# V13: Odometer maintenance reminder. Daily check at 09:00 for 10,000 km intervals.
- id: vf9_odometer_maintenance_reminder
  alias: "VF9: Odometer maintenance reminder"
  description: >-
    Daily check at 09:00. When the VF9 odometer crosses a 10,000 km service
    interval (within the first 100 km of a new band), alert about service.
  mode: single
  triggers:
  - at: "09:00:00"
    trigger: time
  conditions:
  - condition: template
    value_template: "{{ states('sensor.vf9_rllv2cja5rh000847_tong_odo') | default(0,true) | float(0) > 0 }}"
  - condition: template
    value_template: "{{ (states('sensor.vf9_rllv2cja5rh000847_tong_odo') | default(0,true) | float(0) % 10000) < 100 }}"
  actions:
  - variables:
      odo: "{{ states('sensor.vf9_rllv2cja5rh000847_tong_odo') | default(0,true) | float(0) }}"
      interval: "{{ (odo // 10000) | int }}"
  - action: notify.mobile_app_cph2655
    data:
      title: "VF9 Service Reminder"
      message: "VF9 odometer: {{ odo | round(0) }} km. Crossed into service interval {{ (interval + 1) * 10000 }} km. Schedule a service."
