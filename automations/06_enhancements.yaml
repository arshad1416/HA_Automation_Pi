# =============================================================================
# 06_enhancements.yaml
# New automations from the "Home Assistant Automation Enhancements" spec.
# Deployed alongside 01_main.yaml via `automation: !include_dir_merge_list`.
#
# Entity mappings applied (spec placeholders -> real deployed entities):
#   person.home            -> person.arshad14
#   person.larissa         -> binary_sensor.larissa_s_s22_presence (on=home/off=away)
#   sensor.VEHICLE_*       -> sensor.ioniq_6_*  (Hyundai Ioniq 6, 77.4 kWh pack)
#   sensor.VF9_*           -> sensor.vf9_rllv2cja5rh000847_* (VinFast VF9, ~123 kWh pack)
#   switch.patio_door_light-> switch.patio_door_light_switch_1
#   switch.foyer_light     -> switch.foyer_light_switch_1
#   cover.family_room_blinds -> cover.family_room_blinds_curtain (LocalTuya)
# =============================================================================

# -----------------------------------------------------------------------------
# Enhancement C: Pause HVAC when an exterior door stays open during active run.
# Sets input_boolean.hvac_paused_door_open so climate_ai_advisor won't fight it.
# -----------------------------------------------------------------------------
- id: hvac_pause_door_open
  alias: "HVAC Pause: Door open too long"
  description: >-
    Pause HVAC when front door or garage entry door stays open >2 min while the
    ecobee is actively heating/cooling. Captures the active mode into
    input_text.climate_ai_last_mode before pausing and restores it when the door
    closes (Enhancement C).
  mode: single
  triggers:
  - entity_id: binary_sensor.front_door_door
    to: 'on'
    for: "00:02:00"
    trigger: state
  - entity_id: binary_sensor.garages_entry_door_door
    to: 'on'
    for: "00:02:00"
    trigger: state
  conditions:
  - condition: template
    value_template: "{{ state_attr('climate.ecobee', 'hvac_action') in ['heating', 'cooling'] }}"
  - condition: state
    entity_id: input_boolean.hvac_paused_door_open
    state: 'off'
  actions:
  - action: input_boolean.turn_on
    target:
      entity_id: input_boolean.hvac_paused_door_open
  - action: input_text.set_value
    target:
      entity_id: input_text.climate_ai_last_mode
    data:
      value: '{{ states(''climate.ecobee'') }}'
  - action: climate.set_hvac_mode
    data:
      hvac_mode: 'off'
    target:
      entity_id: climate.ecobee
  - action: notify.mobile_app_cph2655
    data:
      title: "HVAC Paused"
      message: "{{ trigger.to_state.attributes.friendly_name }} open >2 min while HVAC active. Paused to save energy. Will resume when closed."
  - wait_template: "{{ is_state('binary_sensor.front_door_door', 'off') and is_state('binary_sensor.garages_entry_door_door', 'off') }}"
    timeout: "01:00:00"
  - action: climate.set_hvac_mode
    data:
      hvac_mode: >
        {% set m = states('input_text.climate_ai_last_mode') | default('', true) | trim | lower %}
        {{ m if m in ['off', 'heat', 'cool', 'heat_cool'] else 'heat_cool' }}
    target:
      entity_id: climate.ecobee
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.hvac_paused_door_open

# -----------------------------------------------------------------------------
# Enhancement E: Run pool pump overnight when tomorrow looks fully overcast
# (solar trigger will never hit 500 W, so guarantee circulation on ULO).
# -----------------------------------------------------------------------------
- id: pool_pump_cloudy_forecast_fallback
  alias: "Pool Pump: Cloudy day fallback"
  description: >-
    If cloud cover is heavy at 21:00, turn the pump + chlorinator on so the
    overnight ULO window (3.9c/kWh) guarantees circulation on a sunless day.
  mode: single
  triggers:
  - at: "21:00:00"
    trigger: time
  conditions:
  - condition: template
    value_template: "{{ state_attr('weather.forecast_home', 'cloud_coverage') | default(0, true) | int(0) > 80 }}"
  actions:
  - action: switch.turn_on
    target:
      entity_id:
      - switch.pool_pump_heater_socket_1
      - switch.salt_chlorinator
  - action: notify.mobile_app_cph2655
    data:
      title: "Pool Pump: Cloudy Forecast"
      message: "Heavy cloud cover expected. Running pump overnight ULO (3.9c/kWh) to ensure circulation."

# -----------------------------------------------------------------------------
# Enhancement F: Unified tiered leak escalation for all 7 sensors.
#   Tier 1 (immediate): push + announce on 2 Echos.
#   Tier 2 (30 s sustained): flash strips red + broadcast everywhere + persistent.
#   Tier 3 (5 min sustained): repeat broadcast, COUNT-LIMITED to 10 (max ~10 min).
# Replaces the 9 individual per-sensor leak automations (removed from 01_main).
# -----------------------------------------------------------------------------
- id: leak_detection_escalation
  alias: "Leak Detection: Tiered Escalation"
  description: >-
    Multi-tier leak response across all 7 moisture sensors. Immediate alert,
    30 s escalation with red light flash + whole-home broadcast, and a 5 min
    critical loop limited to 10 repeats so a stuck-wet sensor cannot spam forever.
  mode: parallel
  max: 7
  triggers:
  - entity_id: binary_sensor.basement_bathroom_leak_sensor_moisture
    to: 'on'
    trigger: state
    id: basement_bathroom
  - entity_id: binary_sensor.ensuite_leak_sensor_moisture
    to: 'on'
    trigger: state
    id: ensuite
  - entity_id: binary_sensor.kitchen_leak_sensor_moisture
    to: 'on'
    trigger: state
    id: kitchen
  - entity_id: binary_sensor.laundry_room_leak_sensor_moisture
    to: 'on'
    trigger: state
    id: laundry
  - entity_id: binary_sensor.sump_pump_leak_sensor_moisture
    to: 'on'
    trigger: state
    id: sump_pump
  - entity_id: binary_sensor.powder_room_leak_sensor_moisture
    to: 'on'
    trigger: state
    id: powder_room
  - entity_id: binary_sensor.guest_bathroom_leak_sensor_moisture
    to: 'on'
    trigger: state
    id: guest_bathroom
  conditions: []
  actions:
  # ---- TIER 1: immediate ----
  - variables:
      location: "{{ trigger.id | replace('_', ' ') | title }}"
  - action: notify.grizzl_ev_phones
    data:
      title: "💧 Leak Detected"
      message: "Water leak in {{ location }}! Check immediately."
  - action: notify.alexa_media
    data:
      data: {type: announce}
      message: "Warning. Water leak detected in the {{ location }}. Please check immediately."
      target:
      - media_player.downstairs_echo_dot
      - media_player.upstairs_echo_dot
  # ---- TIER 2: 30-second sustained ----
  - delay: "00:00:30"
  - condition: template
    value_template: "{{ is_state(trigger.entity_id, 'on') }}"
  - action: light.turn_on
    data:
      color_name: red
      brightness_pct: 100
      flash: long
    target:
      entity_id:
      - light.nanoleaf_multicolor_ls
      - light.nanoleaf_multicolor_ls_2
      - light.cabinet_light_strip_left_nanoleaf_light_strip
      - light.cabinet_light_strip_center_nanoleaf_light_strip
      - light.cabinet_light_strip_right_nanoleaf_light_strip
  - action: notify.alexa_media
    data:
      data: {type: announce}
      message: "URGENT. Sustained water leak in the {{ location }}. This is not a false alarm. Please investigate now."
      target:
      - media_player.everywhere
  - action: notify.persistent_notification
    data:
      title: "🚨 Sustained Leak: {{ location }}"
      message: "Leak persisting >30 seconds in {{ location }}. Tier 2 escalation triggered."
  # ---- TIER 3: 5-minute sustained, repeat capped at 10 ----
  - delay: "00:04:30"
  - condition: template
    value_template: "{{ is_state(trigger.entity_id, 'on') }}"
  - repeat:
      count: 10
      sequence:
      - condition: template
        value_template: "{{ is_state(trigger.entity_id, 'on') }}"
      - action: notify.alexa_media
        data:
          data: {type: announce}
          message: "CRITICAL. Water leak still active in {{ location }}. Immediate action required."
          target:
          - media_player.everywhere
      - delay: "00:01:00"

# -----------------------------------------------------------------------------
# Enhancement G: Departure security check (locks + office heater) when the
# last person leaves. Complements house_away_mode (which runs 10 min later and
# handles ecobee setback / climate AI pause but not locks).
# -----------------------------------------------------------------------------
- id: departure_security_check
  alias: "Departure: Security check when everyone leaves"
  description: >-
    When Arshad leaves and Larissa is already away, lock any unlocked locks
    (excluding Airbnb), turn off the office heater, and report what was secured.
  mode: single
  triggers:
  - entity_id: person.arshad14
    to: not_home
    trigger: state
  conditions:
  - condition: state
    entity_id: binary_sensor.larissa_s_s22_presence
    state: 'off'
  actions:
  - variables:
      unlocked_locks: >
        {{ states.lock
           | rejectattr('entity_id', 'eq', 'lock.airbnb')
           | selectattr('state', 'eq', 'unlocked')
           | map(attribute='attributes.friendly_name')
           | list | join(', ') }}
      heater_on: "{{ is_state('switch.office_heater_child_lock', 'on') }}"
  - if:
    - condition: template
      value_template: "{{ unlocked_locks != '' }}"
    then:
    - action: lock.lock
      target:
        entity_id: >
          {{ states.lock
             | rejectattr('entity_id', 'eq', 'lock.airbnb')
             | selectattr('state', 'eq', 'unlocked')
             | map(attribute='entity_id')
             | list }}
  - if:
    - condition: template
      value_template: "{{ heater_on }}"
    then:
    - action: switch.turn_off
      target:
        entity_id: switch.office_heater_child_lock
  - action: notify.mobile_app_cph2655
    data:
      title: "🏠 Departure Check"
      message: >
        Everyone left. {{ 'Locked: ' ~ unlocked_locks ~ '. ' if unlocked_locks else '' }}{{ 'Office heater turned off. ' if heater_on else '' }}{{ 'All secure.' if not unlocked_locks and not heater_on else '' }}

# -----------------------------------------------------------------------------
# Enhancement H: Movie mode on the family-room LG WebOS TV.
# Supersedes family_room_tv_bias_light (removed) and 1781145049841 (disabled).
# -----------------------------------------------------------------------------
- id: family_room_movie_mode
  alias: "Movie Mode: LG WebOS TV"
  description: >-
    When the family room LG TV turns on, dim the family room light to 15% and
    close the family room blinds if the sun is up. When the TV turns off,
    restore the light to 80% if someone is still present after sunset,
    otherwise turn it off; reopen the blinds if the sun is up.
  mode: restart
  triggers:
  - entity_id: media_player.lg_webos_tv_un8500auj
    to: 'on'
    id: tv_on
    trigger: state
  - entity_id: media_player.lg_webos_tv_un8500auj
    to: 'off'
    id: tv_off
    trigger: state
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: tv_on
      - condition: state
        entity_id: binary_sensor.family_room_mmwave_presence
        state: 'on'
      sequence:
      - action: light.turn_on
        data:
          brightness_pct: 15
        target:
          entity_id: light.family_room_light
      - if:
        - condition: state
          entity_id: sun.sun
          state: above_horizon
        then:
        - action: cover.set_cover_position
          data:
            position: 0
          target:
            entity_id: cover.family_room_blinds_curtain
    - conditions:
      - condition: trigger
        id: tv_off
      sequence:
      # Restore, don't blackout: if someone is still in the room after sunset,
      # bring the light back to 80% (same level as family_room_presence_auto_on).
      # Only turn it off when the room is empty or the sun is up (blinds reopen).
      - if:
        - condition: state
          entity_id: binary_sensor.family_room_mmwave_presence
          state: 'on'
        - condition: state
          entity_id: sun.sun
          state: below_horizon
        then:
        - action: light.turn_on
          data:
            brightness_pct: 80
          target:
            entity_id: light.family_room_light
        else:
        - action: light.turn_off
          target:
            entity_id: light.family_room_light
      - if:
        - condition: state
          entity_id: sun.sun
          state: above_horizon
        then:
        - action: cover.set_cover_position
          data:
            position: 100
          target:
            entity_id: cover.family_room_blinds_curtain

