# =============================================================================
# 12_bus_pickup.yaml
# Afternoon school-bus pickup alerts, keyed on Izaan's Life360 tracker
# (Izaan & Mina ride together). Added 2026-10-06.
#
# Life360 is cloud-polled, so positions can lag by a minute or more. All
# distances are straight-line to the bus stop, and the ETAs are rough
# fallbacks. Drive times come from Google Maps Travel Time when available
# (sensor.google_travel_time = Larissa -> home, _2 = bus -> home).
#
# The stop is Niska & Boulding until 2026-10-12 and Fellowes & Boulding from
# 2026-10-13 (coordinates from OpenStreetMap intersections).
# =============================================================================

- id: bus_pickup_left_school
  alias: "Bus pickup: kids left school"
  description: >-
    Push to Arshad's phone when Izaan's Life360 place stops being the school
    on a weekday afternoon, with a second push if Larissa looks unable to
    reach the bus stop before the bus.
  triggers:
    - trigger: state
      entity_id: device_tracker.life360_izaan_kazi
      attribute: place
      from: "Renaissance Elementary School"
      for: "00:01:00"   # rides out GPS jitter at the school boundary
  conditions: &bus_window
    - condition: time
      after: "14:00:00"
      before: "17:30:00"
      weekday: [mon, tue, wed, thu, fri]
  actions:
    - &refresh_travel
      action: homeassistant.update_entity
      target:
        entity_id: [sensor.google_travel_time, sensor.google_travel_time_2]
      continue_on_error: true
    - variables: &bus_vars
        bus_kmh: 20       # straight-line average incl. stops
        car_kmh: 35       # straight-line average for a parent driving
        car_start_min: 3  # time to get out the door
        stop: >-
          {{ [43.3459213, -79.8868361] if now().date() | string < '2026-10-13'
             else [43.3447799, -79.8852459] }}
        bus_km: "{{ distance('device_tracker.life360_izaan_kazi', stop[0], stop[1]) | float(0) }}"
        # Google Maps drive times with live traffic (polling is off; the actions
        # refresh them on demand). Falls back to the straight-line guess whenever
        # a sensor has no number.
        bus_factor: 2.0   # bus with stops vs Google's car time; 2026-10-06 ride took ~40 min vs Google's ~15
        bus_google: "{{ states('sensor.google_travel_time_2') | float(-1) }}"
        bus_min: "{{ (bus_google * bus_factor if bus_google >= 0 else bus_km / bus_kmh * 60) | round }}"
        larissa_google: "{{ states('sensor.google_travel_time') | float(-1) }}"
        larissa_km: "{{ distance('device_tracker.life360_larissa_kazi', stop[0], stop[1]) | float(-1) }}"
        larissa_min: "{{ ((larissa_google if larissa_google >= 0 else larissa_km / car_kmh * 60) + car_start_min) | round }}"
        larissa_age: >-
          {% set seen = state_attr('device_tracker.life360_larissa_kazi', 'last_seen') %}
          {{ ((now() - as_datetime(seen)).total_seconds() / 60) | round if seen else 999 }}
        arshad_km: "{{ distance('device_tracker.life360_arshad_kazi', stop[0], stop[1]) | float(-1) }}"
        # At the stop already (within 300 m) always counts as on time.
        larissa_late: "{{ larissa_km < 0 or (larissa_km > 0.3 and larissa_min > bus_min) }}"
        larissa_note: >-
          {% if larissa_km < 0 %}Larissa's location is unknown.
          {% else %}Larissa is {{ larissa_km | round(1) }} km from the stop (about {{ larissa_min }} min{{ ' in current traffic' if larissa_google >= 0 else ', straight-line estimate' }}){{
            ', but that fix is ' ~ larissa_age ~ ' min old, so it is uncertain' if larissa_age > 10 else '' }}.
          {% endif %}
          {% if arshad_km >= 0 %}You are {{ arshad_km | round(1) }} km away (about {{
            (arshad_km / car_kmh * 60 + car_start_min) | round }} min).{% endif %}
    - action: notify.mobile_app_cph2655
      data:
        title: "Bus pickup"
        message: "Izaan & Mina have left school. Bus is roughly {{ bus_min }} min from the stop."
    - if: "{{ larissa_late }}"
      then:
        - action: notify.mobile_app_cph2655
          data:
            title: "Larissa won't make the bus stop"
            message: "Bus is about {{ bus_min }} min out. {{ larissa_note }}"
    # Spoken on the Echos too. Cloud call, so it goes last and may fail quietly.
    - action: notify.alexa_media
      continue_on_error: true
      data:
        data: {type: announce}
        message: >-
          Izaan and Mina have left school. The bus is roughly {{ bus_min }} minutes from the stop.
          {{ 'Larissa will not make the bus stop in time.' if larissa_late else '' }}
        target: &bus_echos [media_player.downstairs_echo_dot, media_player.upstairs_echo_dot]
  mode: single

- id: bus_pickup_near_home
  alias: "Bus pickup: kids about 1 km away"
  description: >-
    Push to Arshad's phone when Izaan's Life360 tracker comes within 1 km of
    the bus stop on a weekday afternoon, saying whether Larissa is there.
  trigger_variables:
    stop_until_oct_12: [43.3459213, -79.8868361]   # Niska Dr & Boulding Ave
    stop_from_oct_13: [43.3447799, -79.8852459]    # Fellowes Cres & Boulding Ave
  triggers:
    - trigger: template
      value_template: >-
        {% set stop = stop_until_oct_12 if now().date() | string < '2026-10-13' else stop_from_oct_13 %}
        {{ (distance('device_tracker.life360_izaan_kazi', stop[0], stop[1]) | float(99)) < 1 }}
  conditions: *bus_window
  actions:
    - *refresh_travel
    - variables: *bus_vars
    - action: notify.mobile_app_cph2655
      data:
        title: "Bus pickup"
        message: >-
          Izaan & Mina are within 1 km of the bus stop.
          {{ 'Larissa will NOT be there in time. ' ~ larissa_note ~ ' Head over now.'
             if larissa_late else 'Larissa is ' ~ (larissa_km | round(1)) ~ ' km from the stop and should make it.' }}
    # Spoken on the Echos too. Cloud call, so it goes last and may fail quietly.
    - action: notify.alexa_media
      continue_on_error: true
      data:
        data: {type: announce}
        message: >-
          The school bus is within one kilometre of the stop.
          {{ 'Larissa will not be there in time. Head over now.' if larissa_late else 'Larissa should make it.' }}
        target: *bus_echos
  mode: single

# --- Kids' phone charge reminder ---------------------------------------------
# The bus alerts depend on Izaan & Mina's Pixel 7 Pro having battery the next
# day. One check at 8 pm; quiet if it is at 50% or more, or already charging.
- id: kids_phone_charge_reminder
  alias: "Kids' phone: charge reminder (8 pm)"
  description: >-
    At 8 pm, remind Arshad to charge Izaan & Mina's phone when Life360 reports
    it under 50% and not charging.
  triggers:
    - trigger: time
      at: "20:00:00"
  conditions:
    - condition: numeric_state
      entity_id: device_tracker.life360_izaan_kazi
      attribute: battery_level
      below: 50
    - condition: template
      value_template: "{{ not state_attr('device_tracker.life360_izaan_kazi', 'battery_charging') }}"
  actions:
    - action: notify.mobile_app_cph2655
      data:
        title: "Charge the kids' phone"
        message: >-
          Izaan & Mina's phone is at {{ state_attr('device_tracker.life360_izaan_kazi', 'battery_level') | int }}%
          and not charging. Plug it in for the night.
    - action: notify.alexa_media
      continue_on_error: true
      data:
        data: {type: announce}
        message: >-
          Izaan and Mina's phone is at {{ state_attr('device_tracker.life360_izaan_kazi', 'battery_level') | int }} percent.
          Please plug it in for the night.
        target: *bus_echos
  mode: single
