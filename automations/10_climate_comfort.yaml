# Evening comfort setpoint — humidity-aware (ASHRAE 55 / ISO 7730 PMV basis).
#
# Why this exists: the Ecobee's native "Evening" comfort profile carries a 25.5C cool
# setpoint. When the schedule flips to Evening (~19:00) it cancels the Climate AI's
# hold, the compressor idles, and upstairs bedrooms (consistently 0.5-1C warmer than
# the main-floor thermostat) drift warm through the evening.
#
# Setpoint ladder from thermal-comfort studies: PMV-neutral for summer conditions
# (0.5 clo, sedentary, ~50% RH) is ~24.5C; each 10 RH points above ~45-50% raises
# perceived warmth by roughly +0.3-0.5C, so the dry-bulb target drops accordingly.
# Values stay within the climate_ai_advisor's sanctioned 23.0-25.5C band on 0.5C
# steps — the hourly AI run remains authoritative after this fires.
- id: evening_comfort_setpoint
  alias: evening_comfort_setpoint
  description: 'On the Ecobee Evening comfort-profile transition (~19:00), re-assert a
    humidity-compensated cooling setpoint instead of the profile''s 25.5C: 24.5C at
    <=45% RH, 24.0C at 46-55% RH, 23.5C above 55% RH (ASHRAE 55 PMV summer neutral
    ~24.5C at 50% RH, minus ~0.5C per 10 RH points above 45%). Cooling season only;
    the hourly climate_ai_advisor stays authoritative afterwards.'
  mode: single
  triggers:
  - trigger: state
    entity_id: climate.ecobee_3
    attribute: preset_mode
    to: "Evening"
  conditions:
  - condition: state
    entity_id: input_boolean.climate_ai_enabled
    state: "on"
  - condition: state
    entity_id: climate.ecobee_3
    state: cool
  actions:
  - variables:
      rh: '{{ states(''sensor.climate_ai_ecobee_humidity'') | float(states(''sensor.ecobee_current_humidity'') | float(50)) | round(0) }}'
      setpoint: >-
        {% if rh > 55 %}23.5
        {% elif rh > 45 %}24.0
        {% else %}24.5
        {% endif %}
  - action: climate.set_temperature
    data:
      temperature: "{{ setpoint | float }}"
      hvac_mode: cool
    target:
      entity_id: climate.ecobee_3
  - action: logbook.log
    data:
      name: evening_comfort_setpoint
      message: 'Evening comfort setpoint {{ setpoint }}C applied at {{ rh }}% RH (replaces Evening profile 25.5C).'
