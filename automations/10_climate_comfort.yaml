# Comfort setpoints — PMV -0.5 "slightly cool" basis (ASHRAE 55 / EN 16798-1 Cat II).
#
# Why this exists: the Ecobee's native comfort profiles carry warm cool-setpoints
# (Evening 25.5C, Sleep 23.2C). When the schedule flips profiles it cancels the
# Climate AI's hold, the compressor idles, and upstairs bedrooms (consistently
# 0.5-1C warmer than the main-floor thermostat) drift warm.
#
# Evening ladder targets PMV -0.5 — the cool edge of EN 16798-1 Category II —
# instead of PMV-neutral (~24.5C at 50% RH, 0.5 clo, sedentary): roughly 1.0C
# under neutral, stepping another 0.5C cooler per 10 RH points above 45%.
# Sleep is flat 22.0C (user preference 2026-08-16): half a degree under the
# ladder floor, inside the ULO overnight window (3.9c/kWh) — the cheapest
# cooling of the day. The advisor band extends to 22.0C so hourly runs hold
# (never raise) the sleep target until morning.
# Cold-night exception (2026-09-21): at or below 14C outside, the master-bedroom
# and guest-bath windows stay open overnight for cross-ventilation, so the house
# cools passively for free; mechanical cooling to 22.0-22.5C overcools it and the
# family wakes up cold. Every setpoint this automation writes is floored at 23.0C
# (23.5C when outdoor is at or below 10C). The hourly advisor enforces the same
# floor (cold_night_vent there).
# The hourly AI run remains authoritative after these fire.
- id: evening_comfort_setpoint
  alias: evening_comfort_setpoint
  description: 'On the Ecobee Evening (~19:00) and Sleep (~23:00) comfort-profile
    transitions, re-assert humidity-compensated PMV -0.5 cooling setpoints instead
    of the profiles'' warm defaults. Evening: 23.5C at <=45% RH, 23.0C at 46-55% RH,
    22.5C above 55% RH (slightly-cool bias: PMV-neutral minus ~1.0C, with ~0.5C per
    10 RH points above 45%). Sleep: flat 22.0C, except on cold nights (outdoor
    <=14C) when the windows are open for cross-ventilation: then every setpoint is
    floored at 23.0C (23.5C when outdoor <=10C), because passive cooling is free and
    the AC would otherwise overcool the house by morning. Cooling season only; the hourly
    climate_ai_advisor stays authoritative afterwards. Never writes during live
    On-Peak (weekday 16:00-21:00): the Evening ladder is applied at 21:01 instead.'
  mode: single
  triggers:
  - trigger: state
    entity_id: climate.ecobee_3
    attribute: preset_mode
    to: "Evening"
    id: evening
  - trigger: state
    entity_id: climate.ecobee_3
    attribute: preset_mode
    to: "sleep"
    id: sleep
  # Weekday catch-up: the 19:00 Evening transition falls inside On-Peak (39.1c/kWh)
  # and is skipped by the tariff condition below, so apply the ladder once the
  # peak ends. 21:01, not 21:00: the tariff label flips 3-15 s after the hour
  # (audit 2026-09-05), and 21:00:00 would still read On-Peak.
  - trigger: time
    at: "21:01:00"
    id: evening_late
  conditions:
  - condition: state
    entity_id: input_boolean.climate_ai_enabled
    state: "on"
  - condition: state
    entity_id: climate.ecobee_3
    state: cool
  # Audit 2026-09-05 defect 4.1: this fired at 19:00 (and again ~20:00 whenever the
  # utility hold released and the profile re-asserted) on every weekday, writing
  # 23.0C over the advisor's 25.5C on-peak coast. Fri 2026-09-04 = 117 min of
  # on-peak compressor time. Fail-open on a missing label: comfort wins if the
  # rate daemon is down.
  - condition: template
    value_template: >-
      {{ (state_attr('sensor.grizzl_e_total_cost', 'period_label') | default('', true)) != 'On-Peak' }}
  # The 21:01 catch-up only matters on weekdays and only while the Evening
  # profile is still the active comfort profile (a hold shows preset 'temp', so
  # check climate_mode, not preset_mode).
  - condition: template
    value_template: >-
      {{ trigger.id != 'evening_late'
         or (now().isoweekday() <= 5
             and state_attr('climate.ecobee_3', 'climate_mode') == 'Evening') }}
  actions:
  - variables:
      rh: '{{ states(''sensor.climate_ai_ecobee_humidity'') | float(states(''sensor.ecobee_current_humidity'') | float(50)) | round(0) }}'
      # Cold-night ventilation floor (2026-09-21): see header. 0.0 = not cold
      # enough, so the max() below is a no-op and the normal ladder stands.
      outdoor_c: '{{ state_attr(''weather.forecast_home'', ''temperature'') | float(20) }}'
      cold_floor_c: >-
        {% if outdoor_c | float(20) <= 10 %}23.5
        {% elif outdoor_c | float(20) <= 14 %}23.0
        {% else %}0.0
        {% endif %}
      setpoint: >-
        {% if trigger.id == 'sleep' %}{{ [22.0, cold_floor_c | float] | max }}
        {% elif rh > 55 %}{{ [22.5, cold_floor_c | float] | max }}
        {% elif rh > 45 %}{{ [23.0, cold_floor_c | float] | max }}
        {% else %}{{ [23.5, cold_floor_c | float] | max }}
        {% endif %}
  - action: climate.set_temperature
    data:
      temperature: "{{ setpoint | float }}"
      hvac_mode: cool
    target:
      entity_id: climate.ecobee_3
  - action: logbook.log
    data:
      name: evening_comfort_setpoint
      message: '{{ trigger.id | capitalize }} profile: comfort setpoint {{ setpoint }}C applied at {{ rh }}% RH (replaces profile default).{{ '' Cold-night ventilation floor '' ~ cold_floor_c ~ ''C active (outdoor '' ~ outdoor_c ~ ''C, windows open).'' if cold_floor_c | float > 0 }}'
