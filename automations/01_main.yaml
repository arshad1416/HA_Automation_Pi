- id: climate_season_switch
  alias: climate_season_switch
  description: Daily 3am check 7-day mean outdoor temp. 3-day hysteresis with counter tracking.
  mode: single
  triggers:
  - trigger: time
    at: 03:00:00
  conditions: []
  actions:
  - if:
    - condition: numeric_state
      entity_id: sensor.outdoor_temp_7_day_mean_2
      above: 15
    then:
    - action: counter.increment
      target:
        entity_id: counter.season_switch_summer
    - action: counter.reset
      target:
        entity_id: counter.season_switch_winter
    else:
    - if:
      - condition: numeric_state
        entity_id: sensor.outdoor_temp_7_day_mean_2
        below: 10
      then:
      - action: counter.increment
        target:
          entity_id: counter.season_switch_winter
      - action: counter.reset
        target:
          entity_id: counter.season_switch_summer
      else:
      - action: counter.reset
        target:
          entity_id: counter.season_switch_summer
      - action: counter.reset
        target:
          entity_id: counter.season_switch_winter
  - if:
    - condition: numeric_state
      entity_id: counter.season_switch_summer
      above: 2
    then:
    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.climate_summer_mode
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.climate_winter_mode
    - action: counter.reset
      target:
        entity_id: counter.season_switch_summer
    - action: counter.reset
      target:
        entity_id: counter.season_switch_winter
  - if:
    - condition: numeric_state
      entity_id: counter.season_switch_winter
      above: 2
    then:
    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.climate_winter_mode
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.climate_summer_mode
    - action: counter.reset
      target:
        entity_id: counter.season_switch_summer
    - action: counter.reset
      target:
        entity_id: counter.season_switch_winter
- id: bedtime_routine_auto
  alias: Bed Time Light Routine
  description: |
    Locks doors, shuts garage, turns off inside lights once we are actually asleep. Instead of a blunt 10 PM shutoff it VERIFIES sleep every 30 min from 9 PM. Runs at most once per night (input_boolean.bedtime_shutdown_done latch, reset at 20:00). Fires when, and only when, one of:
      (1) IMMEDIATE — Arshad's phone reports sleep (sensor.cph2655_sleep_confidence >80 for 10 min) or Sleep-as-Android turns on, any time 21:00-11:00 (daytime naps excluded).
      (2) HALF-HOURLY POLL — at every :00/:30 from 21:00-04:00, if phone sleep-confidence is currently >80 (verified asleep).
      (3) FALLBACK for nights the phone isn't sleep-tracking — same poll, 23:00-04:00, only if the house has clearly settled: family-room TV is confirmed off/idle/standby, all kitchen/family/island lights are confirmed off and unchanged for 30 min, AND no indoor motion has fired for 30 min. Unavailable sensors fail closed.
    Fixed 2026-07-10: sleep sensor was the non-existent sensor.oneplus_13_sleep_confidence (phone is CPH2655); TV guard watched an unavailable TV (un8500auj).
    Fixed 2026-07-19: unavailable TV/light entities no longer count as a settled house, and the fallback now also requires no motion for 30 minutes.
  triggers:
  - entity_id: sensor.cph2655_sleep_confidence
    above: 80
    for:
      minutes: 10
    trigger: numeric_state
    id: sleep_detected
  - entity_id: calendar.sleep_as_android
    to: 'on'
    trigger: state
    id: sleep_detected
  - trigger: time_pattern
    minutes: '/30'
    id: sleep_check
  conditions:
  - condition: state
    entity_id: input_boolean.bedtime_shutdown_done
    state: 'off'
  - condition: or
    conditions:
    # (1) Immediate: phone/app reports genuine sleep (21:00-11:00 blocks daytime naps)
    - condition: and
      conditions:
      - condition: trigger
        id: sleep_detected
      - condition: time
        after: '21:00:00'
        before: '11:00:00'
    # (2) Half-hourly poll 21:00-04:00: phone sleep-confidence confirms sleep
    - condition: and
      conditions:
      - condition: trigger
        id: sleep_check
      - condition: time
        after: '21:00:00'
        before: '04:00:00'
      - condition: numeric_state
        entity_id: sensor.cph2655_sleep_confidence
        above: 80
    # (3) Settled-house fallback 23:00-04:00 (phone not sleep-tracking):
    #     TV and key lights must be confirmed inactive, plus no motion for 30 min.
    #     Any unavailable input fails closed instead of being mistaken for an idle house.
    - condition: and
      conditions:
      - condition: trigger
        id: sleep_check
      - condition: time
        after: '23:00:00'
        before: '04:00:00'
      - condition: template
        value_template: "{{ states('media_player.lg_webos_tv_cd70') in ['off', 'idle', 'standby'] }}"
      - condition: template
        value_template: >-
          {% set ch = [states.light.kitchen_light_light_1, states.light.family_room_light, states.light.island_light_light] | map(attribute='last_changed') | list %}
          {{ is_state('light.kitchen_light_light_1', 'off') and
             is_state('light.family_room_light', 'off') and
             is_state('light.island_light_light', 'off') and
             (now() - (ch | max)).total_seconds() > 1800 }}
      - condition: state
        entity_id: binary_sensor.any_home_motion
        state: 'off'
        for:
          minutes: 30
  actions:
  - action: lock.lock
    target:
      entity_id:
      - lock.front_door
      - lock.garages_entry_door
      - lock.front_door_2
      - lock.garage_entry
  - action: cover.close_cover
    target:
      entity_id:
      - cover.larissa_s_garage_door
      - cover.larissa_s_garage_door_door
  - delay:
      seconds: 10
  - action: light.turn_off
    target:
      entity_id:
      - light.kitchen_light_light_1
      - light.island_light_light
      - light.stair_light
      - light.family_room_light
      # Fan wall switches are power isolators, not light controls. Use Bond RF
      # light commands so Climate AI can keep the ceiling fans powered.
      - light.master_bedroom_ceiling_fan
      - light.mina_s_ceiling_fan
      - light.guest_room_ceiling_fan
      - light.izaan_s_ceiling_fan
      - light.basement_tv
      - light.cabinet_light_strip_left_nanoleaf_light_strip
      - light.cabinet_light_strip_center_nanoleaf_light_strip
      - light.cabinet_light_strip_right_nanoleaf_light_strip
      - light.nanoleaf_multicolor_ls
      - light.nanoleaf_multicolor_ls_2
    data: {}
  - action: switch.turn_off
    target:
      entity_id:
      - switch.kitchen_pantry_light
      - switch.laundry_room_light_switch
      - switch.living_room_floor_lamp_switch
      - switch.foyer_light_switch_1
      - switch.sonoff_10001dccdc
      - switch.kitchen_pantry_light_socket_1
      - switch.basement_lights
      - switch.basement_stair_light
      - switch.garage_light_switch_switch_1
      - switch.back_hallway_light_main_switch
    data: {}
  - action: input_boolean.turn_on
    target:
      entity_id: input_boolean.bedtime_shutdown_done
  - action: notify.mobile_app_cph2655
    data:
      message: |
        Bedtime routine ran (trigger: {{ trigger.id }}, sleep_confidence {{ states('sensor.cph2655_sleep_confidence') }}). Locks: {{ states('lock.front_door') }}/{{ states('lock.garages_entry_door') }}, Garage: {{ states('cover.larissa_s_garage_door') }}.
  mode: single
