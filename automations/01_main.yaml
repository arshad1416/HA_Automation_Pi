- id: sunset_outdoor_lights
  alias: 'Sunset: Turn on outdoor lights (seasonal)'
  description: Seasonal brightness 15 min before sunset — summer 70%, spring/fall 85%, winter 100% (Enhancement K). Sole authority for lamppost/porch/garage brightness.
  mode: single
  triggers:
  - event: sunset
    offset: -00:15:00
    trigger: sun
  conditions: []
  actions:
  - action: light.turn_on
    data:
      brightness_pct: >-
        {% set m = now().month %}{{ 70 if m in [6, 7, 8] else (100 if m in [12, 1, 2] else 85) }}
    target:
      entity_id:
      - light.lamppost_bulb_1
      - light.lamppost_bulb_2
      - light.lamppost_bulb_3
      - light.front_porch_downlight
      - light.garage_left_downlight
      - light.garage_right_downlight
  - action: switch.turn_on
    target:
      entity_id:
      - switch.patio_door_light_switch_1
      - switch.foyer_light_switch_1
# Removed 2026-08-18 (council fix plan FX7): '1777271290234' "Turn off Side
# Entrance light when Airbnb is empty" — its trigger watched a `description`
# attribute transition between 'Reserved'/'Not available' that neither a
# calendar nor a switch ever reports, so it had never fired. The reserved-flag
