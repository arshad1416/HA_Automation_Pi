- id: auto_restore_ac_after_cold_day
  alias: Auto-restore AC after cold day
  description: Restore AC/cool mode on ecobee after a cold day passes and temperature rises. Skips weekday on-peak (16-21h); a 21:00 recovery trigger catches thresholds crossed during peak. Thresholds via input_number helpers (Fix E2/B2).
  mode: single
  triggers:
  - trigger: template
    value_template: '{{ states(''sensor.ecobee_current_temperature'') | float(0) > states(''input_number.ac_restore_indoor_threshold'') | float(22) }}'
  - at: '21:00:00'
    trigger: time
  conditions:
  - condition: state
    entity_id: climate.ecobee
    attribute: hvac_mode
    state: heat
  - condition: template
    value_template: '{{ state_attr(''weather.forecast_home'', ''temperature'') | float(0) > states(''input_number.ac_restore_outdoor_threshold'') | float(20) }}'
  - condition: template
    value_template: '{{ not (now().isoweekday() < 6 and 16 <= now().hour < 21) }}'
  - condition: template
    value_template: '{{ states(''sensor.ecobee_current_temperature'') | float(0) > states(''input_number.ac_restore_indoor_threshold'') | float(22) }}'
  actions:
  - action: climate.set_hvac_mode
    data:
      hvac_mode: cool
    target:
      entity_id: climate.ecobee
  - action: notify.mobile_app_cph2655
    data:
      message: AC restored to cool mode after cold day passed.
