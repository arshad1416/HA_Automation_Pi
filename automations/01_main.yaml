- id: climate_ai_advisor
  alias: climate_ai_advisor
  description: 'Hourly Climate AI via Gemini, at Home Assistant startup, and when any upstairs Ecobee room or reference sensor remains at least 26C for 10 minutes. Recommends a 22.0-25.5C setpoint, HVAC mode, fan speed, and blinds around a 24C perceived-comfort target defined by the ASHRAE 55 PMV -0.5 slightly-cool humidity-compensated comfort ladder (23.5C at <=45% RH, 23.0C at 46-55% RH, 22.5C above 55% RH; the same ladder evening_comfort_setpoint applies at the Evening transition, plus flat 22.0C at the Sleep transition). A 23.0C warm-room correction is a Gemini preference only during live Ultra-Low or Off-Peak electricity periods; Gemini''s returned setpoint remains authoritative, including 24.5C. Outdoor temperature, relative humidity, and dew point modestly adapt the normal target without chasing weather changes. Stability guards: two-hour mode/setpoint hold, >=0.5C setpoint hysteresis, and urgent high-temperature/high-humidity correction. A 25.5C cooling target is allowed for energy savings, but occupied-room fans are forced to at least medium speed. Native Ecobee is the primary thermostat actuator and temperature source; writes are verified and retried through SmartThings only when Native Ecobee is unavailable or fails to retain the request. HomeKit remains read-only for room occupancy, motion, battery information, and final temperature fallback. Uses the live Grizzl-E tariff attributes; reason logged to input_text.climate_ai_recommendation; phone push only when HVAC actually changed.'
  triggers:
  - minutes: 0
    trigger: time_pattern
  - trigger: homeassistant
    event: start
  - trigger: numeric_state
    entity_id:
    - sensor.climate_ai_minas_room_temperature
    - sensor.mina_s_echo_dot_temperature
    - sensor.climate_ai_izaans_room_temperature
    - sensor.izaan_s_echo_dot_temperature
    - sensor.climate_ai_guest_room_temperature
    - sensor.climate_ai_master_bedroom_temperature
    - sensor.upstairs_echo_dot_temperature
    above: 25.9
    for: '00:10:00'
  conditions:
  - condition: state
    entity_id: input_boolean.climate_ai_enabled
    state: 'on'
  - condition: template
    value_template: '{{ now().hour >= 6 }}'
  - condition: template
    value_template: '{{ not is_state(''input_boolean.hvac_paused_door_open'', ''on'') }}'
  - condition: template
    value_template: '{{ states(''weather.forecast_home'') not in (''unknown'', ''unavailable'') }}'
  actions:
  - variables:
      native_climate_entity: climate.ecobee_3
      smartthings_climate_entity: climate.ecobee_2
      homekit_climate_entity: climate.ecobee
  - variables:
      climate_read_entity: >-
        {{ native_climate_entity if states(native_climate_entity) not in ['unknown', 'unavailable']
           else smartthings_climate_entity if states(smartthings_climate_entity) not in ['unknown', 'unavailable']
           else homekit_climate_entity }}
      climate_control_entity: >-
        {{ native_climate_entity if states(native_climate_entity) not in ['unknown', 'unavailable']
           else smartthings_climate_entity if states(smartthings_climate_entity) not in ['unknown', 'unavailable']
           else '' }}
  - variables:
      climate_mode_age_minutes: >-
        {% if climate_read_entity == native_climate_entity %}
          {% set changed = states.climate.ecobee_3.last_changed %}
        {% elif climate_read_entity == smartthings_climate_entity %}
          {% set changed = states.climate.ecobee_2.last_changed %}
        {% else %}
          {% set changed = states.climate.ecobee.last_changed %}
        {% endif %}
        {{ ((as_timestamp(now()) - as_timestamp(changed, as_timestamp(now()))) / 60) | round(0) }}
      ecobee_equipment_running: >-
        {{ state_attr(native_climate_entity, 'equipment_running') | default('', true) | string }}
      ecobee_compressor_running: >-
        {% set equipment = state_attr(native_climate_entity, 'equipment_running') | default('', true) | string %}
        {{ 'compCool' in equipment or 'compHeat' in equipment or 'auxHeat' in equipment }}
      ecobee_comfort_profile: >-
        {{ state_attr(native_climate_entity, 'climate_mode') | default('unknown', true) }}
      ecobee_preset_mode: >-
        {{ state_attr(native_climate_entity, 'preset_mode') | default('unknown', true) }}
      ecobee_hvac_fan_running: >-
        {{ state_attr(native_climate_entity, 'fan') | default('unknown', true) }}
      ecobee_fan_min_on_time: >-
        {{ states('number.ecobee_fan_minimum_on_time') | default('unknown', true) }}
      ecobee_humidifier_mode: >-
        {{ state_attr('humidifier.ecobee', 'mode') | default('unknown', true) }}
      ecobee_humidifier_action: >-
        {{ state_attr('humidifier.ecobee', 'action') | default('unknown', true) }}
      ecobee_humidity_target: >-
        {{ state_attr('humidifier.ecobee', 'humidity') | default('unknown', true) }}
      # Gap between the setpoint the cloud API says we requested and the one
      # HomeKit says the equipment is actually running. Normally 0. A positive
      # value means something outside this automation (utility touSetback
      # demand-response holds, in practice) is adding degrees to every cooling
      # setpoint, so the house runs warmer than asked and may never call for
      # cooling at all. Reported to the model so it can reason about the real
      # target instead of the one we merely requested.
      current_setpoint_override_c: >-
        {% set requested = state_attr(native_climate_entity, 'temperature') %}
        {% set effective = state_attr(homekit_climate_entity, 'temperature') %}
        {{ ((effective | float(0)) - (requested | float(0))) | round(2)
           if requested is not none and effective is not none else 0 }}
      indoor_humidity_adjustment_c: >-
        {% set rh = states('sensor.climate_ai_ecobee_humidity') | float(45) %}
        {% if rh >= 65 %} 1.0
        {% elif rh >= 60 %} 0.6
        {% elif rh > 55 %} 0.3
        {% elif rh < 30 %} -0.4
        {% elif rh < 35 %} -0.2
        {% else %} 0.0
        {% endif %}
  - variables:
      prompt: "You are a home climate AI. Analyze the sensor data and recommend HVAC adjustments.\n                Respond ONLY with valid JSON, no markdown, no thinking, no commentary.\n                Top-level keys: setpoint (null or 23.0-25.5C), hvac_mode (heat/cool/off/auto/null),\n                fans (object: each of kitchen/master/mina/guest/izaan = off|1|2|3), blinds (object: dining/family/living/mina = 0-100 or no_change), vent_boosters (object: izaan/mina = 0-100 percentage or null),\n                reason (string). Rooms: kitchen, master, mina, guest, izaan. Speed: 1-3 or off (1=slow, 2=medium, 3=high).\n                Perceived temps (pre-calculated): Dn={{ ((states('sensor.downstairs_echo_dot_temperature') | float(states('sensor.izaans_room_temperature') | float(21)) + (indoor_humidity_adjustment_c | float(0))) | round(1)) }}C Up={{ ((states('sensor.upstairs_echo_dot_temperature') | float(states('sensor.minas_room_temperature') | float(21)) + (indoor_humidity_adjustment_c | float(0))) | round(1)) }}C. Humidity >55% feels warmer, <35% feels cooler.\n                Summer=prefer Cool, fans on. When switching between heat and cool, set the desired mode directly..\n                Winter=prefer Heat, fans off/low.\n                Outdoor: {{ state_attr(\"weather.forecast_home\", \"temperature\") }}C\n                Humidity: E={{ states(\"sensor.ecobee_current_humidity\") }}% S={{ state_attr(\"weather.forecast_home\", \"humidity\") }}%\n                Echo: Dn={{ states(\"sensor.downstairs_echo_dot_temperature\") }}C Up={{ states(\"sensor.upstairs_echo_dot_temperature\") }}C\n                Indoor: Iz={{ states(\"sensor.izaans_room_temperature\") }}C Mi={{ states(\"sensor.minas_room_temperature\") }}C Bsmt={{ states(\"sensor.basement_temperature\") }}C\n                Ecobee: {{ states(\"climate.ecobee\") }}\n                LeakSensorTemperatures: BB={{ states(\"sensor.basement_bathroom_leak_sensor_device_temperature\") }}C Ensuite={{ states(\"sensor.ensuite_leak_sensor_device_temperature\") }}C GuestB={{ states(\"sensor.guest_bathroom_leak_sensor_device_temperature\") }}C Powder={{ states(\"sensor.powder_room_leak_sensor_device_temperature\") }}C Laundry={{ states(\"sensor.laundry_room_leak_sensor_device_temperature\") }}C  hvac={{ state_attr(\"climate.ecobee\", \"hvac_action\") }} target={{ state_attr(\"climate.ecobee\", \"temperature\") }}C\\n                Occ:\\  Arshad={{ states(\"person.arshad14\") }} Larissa={{ \"home\" if is_state(\"binary_sensor.larissa_s_s22_presence\",\"on\") else \"away\" }} WFHWorkday={{ \"yes\" if is_state(\"calendar.workday_sensor_calendar\",\"on\") else \"no\" }} (Arshad works from home on workdays)\n                RoomPresence: Izaan={{ states(\"binary_sensor.izaans_room_presence\") }} Mina={{ states(\"binary_sensor.minas_room_presence\") }} FamilyRoom={{ states(\"binary_sensor.family_room_mmwave_presence\") }} MasterBedroom={{ states(\"binary_sensor.master_bedroom_mmwave_presence\") }}\n                Szn={{ \"Summer\" if is_state(\"input_boolean.climate_summer_mode\", \"on\") else \"Winter\" }}\n                Fans: K={{ states(\"fan.kitchen_ceiling_fan\") }} M={{ states(\"fan.master_bedroom_ceiling_fan\") }} Mi={{ states(\"fan.mina_s_ceiling_fan\") }} G={{ states(\"fan.guest_room_ceiling_fan\") }} Iz={{ states(\"fan.izaan_s_ceiling_fan\") }}\n                Ceiling fans (kitchen/master/mina/guest/izaan): set each off|1|2|3 (1=33%,2=66%,3=100%). The automation powers each fan switch on before setting speed; switch state (not fan state) is truth. Turn fans on when cooling helps; off when not needed.
                ENERGY/COMFORT FAN RULE: You MAY select a 25.5C cooling setpoint to save energy. Whenever the target is 25.5C, every occupied room must use its ceiling fan at speed 2 or 3; prefer fans over additional AC when indoor humidity is <=55%. Fans improve perceived comfort but do not remove moisture. When indoor humidity is >60%, do not raise the target to 25.5C; prioritize cooling/dehumidification.
                AUTHORITATIVE ROOM PRESENCE: MasterBedroom={{ states(\"binary_sensor.master_bedroom_occupancy_combined\") }} combines the LD2420 mmWave and Ecobee 332D occupancy sensors. Use this value for all master-bedroom occupancy decisions and ignore the earlier raw MasterBedroom field.
                VentBoosters: Iz={{ states(\"fan.izaan_s_room_20a970\") }}@{{ state_attr(\"fan.izaan_s_room_20a970\", \"percentage\") }}% Mi={{ states(\"fan.mina_s_room_f851f4\") }}@{{ state_attr(\"fan.mina_s_room_f851f4\", \"percentage\") }}%
                Sw: KFn={{ states(\"switch.kitchen_fan_switch_1\") }} MFn={{ states(\"switch.master_bedroom_fan_light_switch_1\") }}
                Doors: Front={{ \"open\" if is_state(\"binary_sensor.front_door_door\", \"on\") else \"closed\" }}{{ \"/unlocked\" if is_state(\"lock.front_door\", \"unlocked\") else \"\" }} GE={{ \"open\" if is_state(\"binary_sensor.garages_entry_door_door\", \"on\") else \"closed\" }}{{ \"/unlocked\" if is_state(\"lock.garages_entry_door\", \"unlocked\") else \"\" }}
                Blinds: DR={{ state_attr(\"cover.dining_room_blinds_curtain\",\"current_position\") }}%open FR={{ state_attr(\"cover.family_room_blinds_curtain\",\"current_position\") }}%open MR={{ state_attr(\"cover.mina_s_blinds_curtain\",\"current_position\") }}%open
                TV: FR_LG={{ states(\"media_player.lg_webos_tv_un8500auj\") }}
                LiveTariff: Period={{ state_attr(\"sensor.grizzl_e_total_cost\", \"period_label\") }} Rate={{ state_attr(\"sensor.grizzl_e_total_cost\", \"rate_cents_kwh\") }}c/kWh. This HA value is authoritative for the current decision; use the schedule below only to plan future pre-cooling.
                LastSetpointChange={{ ((as_timestamp(now()) - as_timestamp(states(\"input_datetime.climate_ai_last_setpoint_change\"), 0)) / 60) | round(0) if states(\"input_datetime.climate_ai_last_setpoint_change\") not in [\"unknown\",\"unavailable\",\"none\",\"\"] else \"unknown\" }}min ago.
                Weather: {{ states(\"weather.forecast_home\") }} UV={{ state_attr(\"weather.forecast_home\", \"uv_index\") }} Clouds={{ state_attr(\"\
        weather.forecast_home\", \"cloud_coverage\") }}%\n                Sun={{ states(\"sun.sun\") }} Azimuth={{ state_attr(\"sun.sun\", \"azimuth\") }} deg Elevation={{ state_attr(\"sun.sun\", \"elevation\") }} deg\n                Window facings: dining={{ states(\"input_number.window_dining_room_facing\") }} deg living={{ states(\"input_number.window_living_room_facing\") }} deg family={{ states(\"input_number.window_family_room_facing\") }} deg mina={{ states(\"input_number.window_minas_room_facing\") }} deg master={{ states(\"input_number.window_master_bedroom_facing\") }} deg izaan={{ states(\"input_number.window_izaans_room_facing\") }} deg\n                Layout: main floor (elev {{ states(\"input_number.house_elevation\") }}m): kitchen, family, living, dining. Second floor (elev {{ states(\"input_number.house_elevation_second_floor\") }}m): master, mina, izaan, guest. Family is directly below Mina, Living is directly below Izaan, and Kitchen is directly below Master (heat rises between stacked rooms). Kitchen and Family face the same direction as Mina and Master; Izaan is on the exactly opposite side of the house from Mina; Guest is next to Izaan and faces the same direction as Izaan. Ceiling height {{ states(\"input_number.ceiling_height\") }}m.\n                LastDecision: current hvac={{ states(\"climate.ecobee\") }} target={{ state_attr(\"climate.ecobee\",\"temperature\") }}C, mode last changed {{ ((now() - (states.climate.ecobee.last_changed if states.climate.ecobee else now())).total_seconds() / 60) | round(0) }} min ago.\n                HVAC stability rules: Prefer no change — return null for hvac_mode and setpoint unless a change is clearly warranted. Respect +/-0.5C hysteresis: never move the setpoint by less than 0.5C, and if perceived temps are within 0.5C of the current target, return setpoint null. Do NOT change hvac_mode if the mode changed less than 120 min ago (see LastDecision) — never reverse a recent mode change. For small corrections adjust the setpoint (23.0-25.5C only), do not toggle the mode off/on. Frequent compressor starts damage the AC.\n                Rules: Only recommend blind changes when sun ABOVE horizon (elevation > 0). If cloudy >40% or UV<2 or elevation<15°, keep blinds open. If UV>5, close blinds on sunny side (azimuth within 45 deg).\n                All HVAC, fan, and temperature decisions are now handled by this AI. Do not wait for other automations.\n                Summer: close blinds on sunny side (azimuth within 45 deg), OPEN blinds on rooms NOT facing sun.\n                Winter: keep all blinds open for passive solar. If hvac_action=heating: keep all blinds open.\n                Output JSON: {\"setpoint\":N, \"hvac_mode\":\"...\", \"fans\":{\"kitchen\":\"off|1|2|3\",\"master\":\"...\",\"mina\":\"...\",\"guest\":\"...\",\"izaan\":\"...\"}, \"blinds\":{\"dining\":N,\"family\":N,\"living\":N,\"mina\":N}, \"vent_boosters\":{\"izaan\":N,\"mina\":N}, \"reason\":\"...\"}\n                blinds values: 0-100 or \"no_change\". Use partial values (25,50,75) to block some sun. Blinds covered: dining, family, living, mina. Prefer PARTIAL positions to balance sun/glare/heat. Only move blinds when sun is up; at night a separate automation closes them.\nFront door: FrontOpenDuration={{ (as_timestamp(now()) | int(0) - as_timestamp(states.binary_sensor.front_door_door.last_changed | default(now(), true)) | int(as_timestamp(now()))) // 60 if is_state('binary_sensor.front_door_door','on') else 0 }}min. If FrontOpenDuration > 10 (front door left open >10 min): factor this in — HVAC is being wasted, so ease off cooling/heating (do not run aggressively), recommend closing the door, and note reduced efficiency.\nVent booster fans: izaan_s_room_20a970 and mina_s_room_f851f4. Boost a vent whenever an occupied room is drifting off target — the ceiling fan does NOT need to be on first, and the vent is the cheaper tool, so prefer boosting the vent before changing the setpoint. Values: 0-100 (percentage), or null to leave as-is. Use the FULL range during the day (7AM-9PM), sized by how far the room is off target IN THE DIRECTION THE HVAC IS WORKING (in cool mode only when the room is ABOVE target; in heat mode only when it is BELOW target): roughly 40% for 0.5-1.0C, 60-70% for 1.0-2.0C, 100% for more than 2.0C or when the room is at/above 26C. A room on the comfortable side of target needs no boost — return null for it. Do not default to null during the day when an occupied room is off target in the working direction; null is for rooms already at or past target. HARD LIMIT: Between 9PM-7AM, max 30%. Only boost vents for rooms shown occupied in RoomPresence; never boost a vent in an empty room, and deprioritize comfort adjustments for unoccupied rooms.\nELECTRICITY RATES (Alectra ULO - Ultra-Low Overnight Time-of-Use):\n WEEKDAYS:\n  11PM-7AM: Ultra-Low Overnight (3.9¢/kWh) - CHEAPEST - PREFER to run HVAC\n  7AM-4PM: Mid-Peak (15.7¢/kWh) - Moderate\n  4PM-9PM: On-Peak (39.1¢/kWh) - VERY EXPENSIVE - AVOID running HVAC\n  9PM-11PM: Mid-Peak (15.7¢/kWh) - Moderate\n WEEKENDS & HOLIDAYS:\n  11PM-7AM: Ultra-Low Overnight (3.9¢/kWh) - CHEAPEST\n  7AM-11PM: Weekend Off-Peak (9.8¢/kWh) - Moderate (all day)\nRULES:\n  Weekdays: Pre-cool during Ultra-Low Overnight (11PM-7AM) to shift load from expensive 4PM-9PM peak.\n  Weekdays 4PM-9PM: Avoid AC if possible. Use fans instead if outdoor < indoor.\n  Weekends: Full day off-peak at 9.8¢. Standard HVAC operation.\n  Summer: overcool by 1-2C during Ultra-Low Overnight so house drifts through 4-9PM peak.\nCurrent Ontario Time: {{ now().strftime('%A %H:%M') }}"
  # Authoritatively widen every embedded setpoint-range instruction in the
  # large prompt from 23.0C down to 22.0C without duplicating that prompt.
  - variables:
      outdoor_temp_c: '{{ state_attr(''weather.forecast_home'', ''temperature'') | float(20) }}'
      outdoor_humidity_pct: '{{ state_attr(''weather.forecast_home'', ''humidity'') | float(50) }}'
      outdoor_dew_point_c: '{{ state_attr(''weather.forecast_home'', ''dew_point'') | float(10) }}'
      prompt: >-
        {{ (prompt | replace('23.0-25.5C', '22.0-25.5C'))
           ~ '\nCOMFORT SETPOINT GUIDE (authoritative baseline; ASHRAE 55 PMV -0.5 slightly-cool bias, cool edge of EN 16798-1 Category II): PMV-neutral for summer conditions (0.5 clo, sedentary, ~50% RH) is ~24.5C; targeting PMV -0.5 runs ~1.0C cooler than neutral, and each 10 RH points above ~45% adds ~0.3-0.5C of perceived warmth, so the humidity-compensated baseline ladder by indoor Ecobee RH is: RH <=45% -> 23.5C; RH 46-55% -> 23.0C; RH >55% -> 22.5C. Current indoor RH is ' ~ states('sensor.climate_ai_ecobee_humidity') ~ '%, so the guide baseline right now is ' ~ (22.5 if states('sensor.climate_ai_ecobee_humidity') | float(45) > 55 else (23.0 if states('sensor.climate_ai_ecobee_humidity') | float(45) > 45 else 23.5)) ~ 'C. Treat that baseline as the default cooling setpoint; deviate only for a stated reason: ULO overnight pre-cooling (down to 22.0C), weekday 4-9PM on-peak coasting (up to 25.5C with occupied-room fans, only when indoor RH <=55%), the cheap-rate warm-room correction below, or the +/-0.5C outdoor adaptation. This is the same ladder the evening_comfort_setpoint automation applies at the 19:00 Evening transition, and it sets a flat 22.0C at the ~23:00 Sleep transition — keep hourly decisions anchored to it, maintaining (not raising) the 22.0C sleep target until morning.'
           ~ '\nCHEAP-RATE WARM-ROOM PREFERENCE: Use the authoritative LiveTariff period above. If its period label contains Ultra-Low or Off-Peak and Mina, Izaan, or the upstairs reference is at least 26.0C, prefer a 23.0C cooling setpoint. This is a preference, not a hard override: your returned setpoint is authoritative, and if you return 24.5C the automation will apply 24.5C unchanged. During Mid-Peak or On-Peak, do not select 23.0C solely for this preference.'
           ~ '\nAUTHORITATIVE ECOBEE DATA: Ignore the earlier Ecobee, Indoor, humidity, target, and HVAC values in this prompt. Use these Native-Ecobee-primary normalized values instead: source=' ~ climate_read_entity ~ ', mode=' ~ states(climate_read_entity) ~ ', hvac_action=' ~ (state_attr(climate_read_entity, 'hvac_action') | default('unknown', true)) ~ ', target=' ~ (state_attr(climate_read_entity, 'temperature') | default('unknown', true)) ~ 'C, thermostat=' ~ states('sensor.climate_ai_ecobee_temperature') ~ 'C, humidity=' ~ states('sensor.climate_ai_ecobee_humidity') ~ '%, basement=' ~ states('sensor.climate_ai_basement_temperature') ~ 'C, guest=' ~ states('sensor.climate_ai_guest_room_temperature') ~ 'C, izaan=' ~ states('sensor.climate_ai_izaans_room_temperature') ~ 'C, master=' ~ states('sensor.climate_ai_master_bedroom_temperature') ~ 'C, mina=' ~ states('sensor.climate_ai_minas_room_temperature') ~ 'C, mode_age=' ~ climate_mode_age_minutes ~ ' minutes.'
           ~ '\nNATIVE EQUIPMENT CONTEXT: equipment_running=' ~ ecobee_equipment_running ~ ', compressor_running=' ~ ecobee_compressor_running ~ ', thermostat_fan=' ~ ecobee_hvac_fan_running ~ ', fan_min_on_time=' ~ ecobee_fan_min_on_time ~ ' min/hour, comfort_profile=' ~ ecobee_comfort_profile ~ ', preset=' ~ ecobee_preset_mode ~ ', humidifier_mode=' ~ ecobee_humidifier_mode ~ ', humidifier_action=' ~ ecobee_humidifier_action ~ ', humidity_target=' ~ ecobee_humidity_target ~ '%. If compressor_running is true, return hvac_mode null: never reverse or stop the operating mode from this hourly AI run. Setpoint adjustments remain allowed when justified. Respect Sleep/Evening profiles by prioritizing occupied bedrooms; for Away/away_indefinitely return no HVAC change except urgent freeze/overheat protection. The humidifier adds moisture and does not dehumidify.'
           ~ '\nEXTERNAL SETPOINT OVERRIDE: requested_target=' ~ (state_attr('climate.ecobee_3', 'temperature') | default('unknown', true)) ~ 'C, effective_target=' ~ (state_attr('climate.ecobee', 'temperature') | default('unknown', true)) ~ 'C, override=' ~ current_setpoint_override_c ~ 'C. The effective target is what the equipment actually runs. A positive override means an external hold (typically a utility touSetback demand-response event) is silently adding that many degrees to every cooling setpoint, so the house runs WARMER than requested and the compressor may never start. When override is 0.5C or more, treat effective_target as the real target: the room must exceed effective_target, not requested_target, before cooling begins. Account for this when judging whether the house is on target and when sizing vent boosters and ceiling fans, and state the override in your reason.'
           ~ '\nOVERRIDE STRATEGY (the enrollment is deliberate and is being KEPT for the utility incentive): do not try to defeat an active override by stacking large setpoint drops, and never treat it as a fault. It is a paid arrangement. Instead: (a) while an override is active, lean on ceiling fans and vent boosters for occupied rooms, since air movement restores comfort without fighting the hold; (b) subtract the override from your setpoint request so the EFFECTIVE target lands where you intend, but only down to the 22.0C floor, and only when an occupied room is genuinely above the effective target; (c) most importantly, PRE-COOL BEFORE the event rather than fighting during it. These events have historically run about two hours in the evening, most often starting near 19:00 local, and are dispatched by the utility rather than fixed, so treat 17:00-19:00 local as the window to build thermal buffer whenever the tariff is Ultra-Low or Off-Peak and rooms are occupied. A house pre-cooled to the low end of the ladder coasts through a +1.1C hold comfortably; a house sitting exactly at target does not.'
           ~ '\nSETPOINT RESOLUTION: Return only null or one of 22.0, 22.5, 23.0, 23.5, 24.0, 24.5, 25.0, 25.5 C. The automation normalizes any other numeric value to the nearest 0.5C before applying hysteresis.'
           ~ '\nHUMIDITY COMFORT: Use a perceived-temperature adjustment of ' ~ indoor_humidity_adjustment_c ~ 'C for current indoor RH. This same adjustment is already included in the pre-calculated perceived temps above; do not add it again. RH 35-55% is the neutral band with no temperature penalty; only sustained RH above 55% or below 35% materially shifts perceived comfort. For setpoint selection, follow the COMFORT SETPOINT GUIDE ladder above — do not invent a separate humidity offset.'
           ~ '\nOUTDOOR CROSS-CHECK: Ecobee weather reports ' ~ (state_attr('weather.ecobee', 'temperature') | default('unknown', true)) ~ 'C and ' ~ (state_attr('weather.ecobee', 'humidity') | default('unknown', true)) ~ '% RH; Forecast Home reports ' ~ outdoor_temp_c ~ 'C and ' ~ outdoor_humidity_pct ~ '% RH with dew point ' ~ outdoor_dew_point_c ~ 'C. Use agreement as confidence. If temperature differs by more than 2C or humidity by more than 15 percentage points, treat outdoor conditions as uncertain and do not change HVAC solely because of weather.'
           ~ '\nOUTDOOR ADAPTATION: Current outdoor conditions are ' ~ outdoor_temp_c ~ 'C, ' ~ outdoor_humidity_pct ~ '% RH, dew point ' ~ outdoor_dew_point_c ~ 'C. Use dew point, not outdoor relative humidity alone, to judge outdoor moisture. Weather may shift the normal perceived-temperature target by at most 0.5C; do not change the HVAC merely because a single hourly weather reading changed, and keep the existing two-hour hold. If outdoors is at least 1.5C cooler than the warmest occupied indoor perceived temperature and dew point is below 16C, favor fans, reduced AC, and a null setpoint change; outside air is favorable for optional natural ventilation. If outdoor temperature is 30C or higher while dew point is below 18C and indoor RH is at most 55%, an adaptive 24.5-25.5C cooling target with occupied-room fans is acceptable. If outdoor dew point is 18C or higher, treat the air as moisture-laden: keep the house closed, do not rely on outdoor air for comfort, and when indoor RH exceeds 55% aim near the 22.5-23.0C steps of the guide ladder for cooling/dehumidification rather than 25.5C. When outdoors is below 18C and indoor perceived temperature is already comfortable, avoid mechanical cooling and return a null setpoint. Exceptions to the 0.5C weather adaptation are deliberate ULO pre-cooling and sustained urgent indoor heat/humidity correction.' }}
  - action: rest_command.climate_ai_gemini
    data:
      prompt: '{{ prompt }}'
    response_variable: ai_response
  - variables:
      ai_raw: '{{ ai_response.content.choices[0].message.content if ai_response.content.choices is defined and ai_response.content.choices and ai_response.content.choices[0].message is defined and ai_response.content.choices[0].message.content is defined else '''' }}'
      ai_json: '{{ ai_raw if ai_raw is mapping else (ai_raw | regex_replace(''(?i)```json\s*'', '''') | regex_replace(''(?i)```\s*'', '''') | trim | from_json({}) if ai_raw is string and ai_raw | trim != '''' and (ai_raw | trim | regex_search(''[\{\[]'')) else {}) }}'
      hvac_mode: '{{ ai_json.hvac_mode | default(none, true) }}'
      ai_setpoint: '{{ ai_json.setpoint | default(none) }}'
      ai_reason: '{{ ai_json.reason | default(''Gemini response unavailable; deterministic safeguards only'', true) }}'
      humidity_pct: '{{ states(''sensor.climate_ai_ecobee_humidity'') | float(45) }}'
      outdoor_dew_point_c: '{{ state_attr(''weather.forecast_home'', ''dew_point'') | float(10) }}'
      warmest_upstairs_room_c: >-
        {{ [states('sensor.climate_ai_minas_room_temperature') | float(0),
            states('sensor.mina_s_echo_dot_temperature') | float(0),
            states('sensor.climate_ai_izaans_room_temperature') | float(0),
            states('sensor.izaan_s_echo_dot_temperature') | float(0),
            states('sensor.climate_ai_guest_room_temperature') | float(0),
            states('sensor.climate_ai_master_bedroom_temperature') | float(0),
            states('sensor.upstairs_echo_dot_temperature') | float(0)] | max }}
      setpoint: >-
        {% if ai_setpoint is not none and ai_setpoint | string | lower not in ['null', 'none', 'unknown', 'unavailable', ''] %}
          {{ (((((ai_setpoint | float) * 2) | round(0, 'common')) / 2)) | round(1) }}
        {% else %}
          {{ none }}
        {% endif %}
      reason: '{{ ai_reason }}'
      perceived_high_c: >-
        {% set humidity_adjustment = indoor_humidity_adjustment_c | float(0) %}
        {% set downstairs = states('sensor.downstairs_echo_dot_temperature') | float(states('sensor.climate_ai_ecobee_temperature') | float(24)) %}
        {% set upstairs = states('sensor.upstairs_echo_dot_temperature') | float(states('sensor.climate_ai_ecobee_temperature') | float(24)) %}
        {% set high = [downstairs, upstairs, warmest_upstairs_room_c | float(0)] | max %}
        {{ (high + humidity_adjustment) | round(1) }}
      current_target: >-
        {{ state_attr(native_climate_entity, 'temperature') | float(
             state_attr(smartthings_climate_entity, 'temperature') | float(
               state_attr(homekit_climate_entity, 'temperature') | float(24))) }}
      last_setpoint_change_ts: '{{ as_timestamp(states(''input_datetime.climate_ai_last_setpoint_change''), 0) | float(0) }}'
      setpoint_cooldown_ok: >-
        {{ last_setpoint_change_ts | float(0) == 0
           or as_timestamp(now()) - last_setpoint_change_ts | float(0) >= 7200 }}
      comfort_correction: >-
        {{ setpoint is not none and setpoint | float(99) < current_target | float(24)
           and (humidity_pct | float(45) > 60 or perceived_high_c | float(24) > 26) }}
      hvac_mode_n: '{{ none if hvac_mode is none else (''heat_cool'' if hvac_mode | string | lower == ''auto'' else hvac_mode | string | lower) }}'
      mode_apply: >-
        {{ hvac_mode_n is not none and hvac_mode_n in ['off', 'heat', 'cool', 'heat_cool']
           and climate_control_entity | length > 0
           and hvac_mode_n != states(climate_read_entity)
           and not (ecobee_compressor_running | bool)
           and climate_mode_age_minutes | float(0) > 120 }}
      setp_apply: >-
        {{ setpoint is not none and setpoint | float(-99) >= 22.0 and setpoint | float(-99) <= 25.5
           and not (setpoint | float(-99) >= 25.5 and humidity_pct | float(45) > 60)
           and not (setpoint | float(-99) >= 25.5 and outdoor_dew_point_c | float(10) >= 18
                    and humidity_pct | float(45) > 55)
           and (setpoint_cooldown_ok or comfort_correction)
           and (setpoint | float(0) - current_target | float(0)) | abs >= 0.5 }}
      effective_target: '{{ setpoint | float(current_target) if setp_apply else current_target | float(24) }}'
      fan_support_25_5: >-
        {{ is_state('input_boolean.climate_summer_mode', 'on')
           and effective_target | float(0) >= 25.5
           and (states(climate_read_entity) == 'cool' or hvac_mode_n == 'cool') }}
  - action: input_text.set_value
    target:
      entity_id: input_text.climate_ai_recommendation
    data:
      value: '{{ (now().strftime(''%H:%M'') ~ '' mode='' ~ (hvac_mode_n if hvac_mode_n is not none else ''keep'') ~ (''*'' if mode_apply else '''') ~ (''[compressor-blocked]'' if hvac_mode_n is not none and hvac_mode_n != states(climate_read_entity) and ecobee_compressor_running | bool else '''') ~ '' set='' ~ (setpoint if setpoint is not none else ''keep'') ~ (''*'' if setp_apply else '''') ~ '' | '' ~ reason)[:250] }}'
  - if:
    - condition: template
      value_template: '{{ mode_apply }}'
    then:
    - action: input_text.set_value
      target:
        entity_id: input_text.climate_ai_last_mode
      data:
        value: '{{ states(climate_read_entity) }}'
    - action: climate.set_hvac_mode
      continue_on_error: true
      data:
        hvac_mode: '{{ hvac_mode_n }}'
      target:
        entity_id: '{{ climate_control_entity }}'
    - wait_template: '{{ states(climate_control_entity) == hvac_mode_n }}'
      timeout: '00:00:30'
      continue_on_timeout: true
    - if:
      - condition: template
        value_template: >-
          {{ climate_control_entity == native_climate_entity
             and states(climate_control_entity) != hvac_mode_n
             and states(smartthings_climate_entity) not in ['unknown', 'unavailable'] }}
      then:
      - action: climate.set_hvac_mode
        continue_on_error: true
        data:
          hvac_mode: '{{ hvac_mode_n }}'
        target:
          entity_id: '{{ smartthings_climate_entity }}'
  - if:
    - condition: template
      value_template: '{{ is_state(''binary_sensor.front_door_door'', ''on'') }}'
    then:
    - action: notify.mobile_app_cph2655
      continue_on_error: true
      data:
        message: Front door is open while HVAC is running. Close it to save energy.
        title: Front Door Open
  - repeat:
      for_each:
        - { room: kitchen, fan: fan.kitchen_ceiling_fan, sw: switch.kitchen_fan_switch_1, occ: binary_sensor.kitchen_presence }
        - { room: master, fan: fan.master_bedroom_ceiling_fan, sw: switch.master_bedroom_fan_light_switch_1, occ: binary_sensor.master_bedroom_occupancy_combined }
        - { room: mina, fan: fan.mina_s_ceiling_fan, sw: switch.mina_s_light_switch_1, occ: binary_sensor.minas_room_occupancy }
        - { room: guest, fan: fan.guest_room_ceiling_fan, sw: switch.guest_room_light_switch_1, occ: binary_sensor.bbwg_occupancy }
        - { room: izaan, fan: fan.izaan_s_ceiling_fan, sw: switch.izaan_s_bedroom_light_switch_1, occ: binary_sensor.izaans_room_occupancy }
      sequence:
        - variables:
            ai_spd: "{{ ai_json.get('fans', {}).get(repeat.item.room, 'no_change') if ai_json is mapping else 'no_change' }}"
            spd: >-
              {% if fan_support_25_5 and is_state(repeat.item.occ, 'on') %}
                {% if humidity_pct | float(45) > 55 or perceived_high_c | float(24) >= 26 or ai_spd | string == '3' %}3{% else %}2{% endif %}
              {% else %}
                {{ ai_spd }}
              {% endif %}
            pct: "{{ {'1':33,'2':66,'3':100}.get(spd | string, 0) }}"
        - choose:
            - conditions: "{{ spd not in [none, 'no_change'] and (spd | string) != 'off' }}"
              sequence:
                - action: switch.turn_on
                  target:
                    entity_id: "{{ repeat.item.sw }}"
                - delay:
                    seconds: 2
                - action: fan.set_percentage
                  target:
                    entity_id: "{{ repeat.item.fan }}"
                  data:
                    percentage: "{{ pct }}"
            - conditions: "{{ (spd | string) == 'off' }}"
              sequence:
                - action: fan.turn_off
                  target:
                    entity_id: "{{ repeat.item.fan }}"
                - if:
                    - condition: template
                      value_template: "{{ states(repeat.item.occ) == 'off' }}"
                  then:
                    - action: switch.turn_off
                      target:
                        entity_id: "{{ repeat.item.sw }}"
  - if:
    - condition: template
      value_template: '{{ ai_json.blinds is mapping and ai_json.blinds.dining is defined and ai_json.blinds.dining | string | lower != ''no_change'' }}'
    - condition: template
      value_template: '{{ state_attr("sun.sun", "elevation") | float(-1) > -5 }}'
    then:
    - action: cover.set_cover_position
      data:
        position: '{{ ai_json.blinds.dining | int(100) | clamp(0, 100) }}'
      target:
        entity_id: cover.dining_room_blinds_curtain
  - if:
    - condition: template
      value_template: '{{ ai_json.blinds is mapping and ai_json.blinds.family is defined and ai_json.blinds.family | string | lower != ''no_change'' }}'
    - condition: template
      value_template: '{{ state_attr("sun.sun", "elevation") | float(-1) > -5 }}'
    then:
    - action: cover.set_cover_position
      data:
        position: '{{ ai_json.blinds.family | int(100) | clamp(0, 100) }}'
      target:
        entity_id: cover.family_room_blinds_curtain
  - if:
    - condition: template
      value_template: '{{ ai_json.blinds is mapping and ai_json.blinds.mina is defined and ai_json.blinds.mina | string | lower != ''no_change'' }}'
    - condition: template
      value_template: '{{ state_attr("sun.sun", "elevation") | float(-1) > -5 }}'
    then:
    - action: cover.set_cover_position
      data:
        position: '{{ ai_json.blinds.mina | int(100) | clamp(0, 100) }}'
      target:
        entity_id: cover.mina_s_blinds_curtain
  - if:
    - condition: template
      value_template: '{{ ai_json.blinds is mapping and ai_json.blinds.living is defined and ai_json.blinds.living | string | lower != ''no_change'' }}'
    - condition: template
      value_template: '{{ state_attr("sun.sun", "elevation") | float(-1) > -5 }}'
    then:
    - action: cover.set_cover_position
      data:
        position: '{{ ai_json.blinds.living | int(100) | clamp(0, 100) }}'
      target:
        entity_id: cover.living_room_blinds_curtain
  - if:
    - condition: template
      value_template: '{{ ai_json.vent_boosters is mapping and ai_json.vent_boosters.izaan is defined and ai_json.vent_boosters.izaan != None and ai_json.vent_boosters.izaan | int >= 0 and ai_json.vent_boosters.izaan | int <= 100 }}'
    then:
    - action: fan.set_percentage
      data:
        percentage: '{{ [[(ai_json.vent_boosters.izaan | default(0, true)) | int(0), 0] | max, 30] | min if now().hour >= 21 or now().hour < 7 else [(ai_json.vent_boosters.izaan | default(0, true)) | int(0), 0] | max }}'
      target:
        entity_id: fan.izaan_s_room_20a970
  - if:
    - condition: template
      value_template: '{{ ai_json.vent_boosters is mapping and ai_json.vent_boosters.mina is defined and ai_json.vent_boosters.mina != None and ai_json.vent_boosters.mina | int >= 0 and ai_json.vent_boosters.mina | int <= 100 }}'
    then:
    - action: fan.set_percentage
      data:
        percentage: '{{ [[(ai_json.vent_boosters.mina | default(0, true)) | int(0), 0] | max, 30] | min if now().hour >= 21 or now().hour < 7 else [(ai_json.vent_boosters.mina | default(0, true)) | int(0), 0] | max }}'
      target:
        entity_id: fan.mina_s_room_f851f4
  - if:
    - condition: template
      value_template: '{{ setp_apply }}'
    then:
    - if:
      - condition: template
        value_template: '{{ states(native_climate_entity) not in [''unknown'', ''unavailable''] }}'
      then:
      - action: climate.set_temperature
        continue_on_error: true
        data:
          temperature: '{{ setpoint }}'
        target:
          entity_id: '{{ native_climate_entity }}'
      - wait_template: >-
          {{ state_attr(native_climate_entity, 'temperature') is not none
             and (state_attr(native_climate_entity, 'temperature') | float(99)
                  - setpoint | float(0)) | abs <= 0.5 }}
        timeout: '00:00:30'
        continue_on_timeout: true
    - variables:
        native_setpoint_persisted: >-
          {{ states(native_climate_entity) not in ['unknown', 'unavailable']
             and state_attr(native_climate_entity, 'temperature') is not none
             and (state_attr(native_climate_entity, 'temperature') | float(99)
                  - setpoint | float(0)) | abs <= 0.5 }}
    - if:
      - condition: template
        value_template: >-
          {{ not (native_setpoint_persisted | bool)
             and states(smartthings_climate_entity) not in ['unknown', 'unavailable'] }}
      then:
      - action: climate.set_temperature
        continue_on_error: true
        data:
          temperature: '{{ setpoint }}'
        target:
          entity_id: '{{ smartthings_climate_entity }}'
      - wait_template: >-
          {{ state_attr(smartthings_climate_entity, 'temperature') is not none
             and (state_attr(smartthings_climate_entity, 'temperature') | float(99)
                  - setpoint | float(0)) | abs <= 0.5 }}
        timeout: '00:00:30'
        continue_on_timeout: true
    - variables:
        smartthings_setpoint_persisted: >-
          {{ states(smartthings_climate_entity) not in ['unknown', 'unavailable']
             and state_attr(smartthings_climate_entity, 'temperature') is not none
             and (state_attr(smartthings_climate_entity, 'temperature') | float(99)
                  - setpoint | float(0)) | abs <= 0.5 }}
        setpoint_persisted: >-
          {{ (native_setpoint_persisted | bool) or (smartthings_setpoint_persisted | bool) }}
        # A write can "persist" and still not be what the thermostat RUNS.
        # Both checks above read back the same cloud attribute we just wrote, so
        # 23.0 == 23.0 passes even while the equipment is really holding 24.1C.
        # HomeKit reports the effective setpoint, so comparing the two is the
        # only way this automation can see an externally applied offset (utility
        # touSetback demand-response events being the one that bit us).
        effective_setpoint_c: >-
          {{ state_attr(homekit_climate_entity, 'temperature') | float(setpoint | float(0)) }}
        setpoint_override_c: >-
          {{ ((state_attr(homekit_climate_entity, 'temperature') | float(setpoint | float(0)))
              - (setpoint | float(0))) | round(2) }}
    - if:
      - condition: template
        value_template: '{{ setpoint_persisted }}'
      then:
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.climate_ai_last_setpoint_change
        data:
          datetime: '{{ now().strftime(''%Y-%m-%d %H:%M:%S'') }}'
      else:
      - action: notify.persistent_notification
        data:
          title: Climate AI setpoint did not persist
          message: >-
            Requested {{ setpoint }}C, but Native Ecobee reports
            {{ state_attr(native_climate_entity, 'temperature') }}C, SmartThings
            reports {{ state_attr(smartthings_climate_entity, 'temperature') }}C,
            and HomeKit reports {{ state_attr(homekit_climate_entity, 'temperature') }}C.
    # Accepted-but-overridden is the silent failure mode: the write succeeded,
    # so nothing above complains, yet the house never reaches the target.
    # The enrollment is deliberate (utility incentive), so this is INFORMATIONAL
    # rather than a fault: it explains why cooling looks lazy during an event.
    # Only surfaced when a room is actually uncomfortable, so an ordinary
    # well-buffered event stays silent instead of training you to ignore it.
    - if:
      - condition: template
        value_template: >-
          {{ setpoint_override_c | float(0) >= 0.5
             and (states('sensor.climate_ai_ecobee_temperature') | float(0))
                 > (effective_setpoint_c | float(99)) + 0.5 }}
      then:
      - action: notify.persistent_notification
        data:
          title: 'Utility event active: running {{ effective_setpoint_c }}C, not {{ setpoint }}C'
          message: >-
            The utility demand-response hold is adding {{ setpoint_override_c }}C
            to the cooling setpoint, so the thermostat is holding
            {{ effective_setpoint_c }}C while indoor is
            {{ states('sensor.climate_ai_ecobee_temperature') }}C. This is the
            paid Community Energy Savings enrollment working as designed, not a
            fault. Fans and vent boosters are the lever during an event; the
            durable fix is deeper pre-cooling in the 17:00-19:00 window. To end
            just this event, set a Hold on the thermostat or tap the arrow beside
            "eco+ is on" and end eco+ for the day.
  - if:
    - condition: template
      value_template: '{{ mode_apply or setp_apply }}'
    then:
