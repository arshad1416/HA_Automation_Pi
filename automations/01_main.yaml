- id: stairs_pir_motion_light
  alias: Stairs Light — PIR Motion (before bedtime)
  description: >-
    Motion on the Upstairs Stair Sensor (binary_sensor.pir_motion_sensor_2_motion) lights
    light.stair_light: full brightness when it is dark out before bedtime (capped at
    input_number.nightly_dim_brightness after the seasonal Nightly Dimming hour — 9 PM
    winter, 10 PM shoulder, 11 PM summer — mirroring automation 1778114000000), same
    nightly_dim_brightness from the dim hour through to sunrise on any night the bedtime
    latch never sets. After bedtime this automation stands down entirely (the hallway
    panels take over) unless a panel is unavailable. Off 5 minutes after the last motion
    pulse — a timer, not a no-motion signal; see the shared timer tail below for why.

    Replaces stairs_light_auto / stairs_echo_ecobee_motion / stairs_presence_timeout /
    stairs_safety_off (deleted 2026-07-29), which all keyed on switch.stairs_occupancy —
    a SmartThings virtual switch only an external Alexa routine could set. This drives
    off the physical PIR instead, so no Alexa or emulated_hue round-trip is involved.

    "Dark out" prefers sensor.illuminance (ha-illuminance custom integration: US Naval
    Observatory solar position blended with weather.forecast_home), compared against
    input_number.stairs_dark_lux. The previous weather-state test was inaccurate — it
    counted 'partlycloudy' as dark, which fired on mornings at 14% cloud cover. If
    sensor.illuminance is missing or unavailable the conditions fall back to numeric
    cloud_coverage plus sun elevation, so this automation still works before that
    integration is installed.

    "Bedtime" is input_boolean.bedtime_shutdown_done, set by bedtime_routine_auto on real
    sleep detection. That latch is only reset at 20:00, so it reads stale-ON through the
    evening; the extra time condition pins it to the current night.

    input_boolean.stair_light_pir_owned tracks whether this automation is the one holding
    the light on. It is claimed only when the light was found OFF and released whenever
    the light goes off by any path, so a manually lit staircase is never auto-killed.
  mode: restart
  triggers:
  - trigger: state
    entity_id: binary_sensor.pir_motion_sensor_2_motion
    to: 'on'
    id: motion
  - trigger: state
    entity_id: light.stair_light
    to: 'off'
    id: light_went_off
  # Backstop: the claim should never be held this long — the timer tail releases it after
  # ~5 minutes. Only reachable if a run was cancelled before its tail finished.
  - trigger: state
    entity_id: input_boolean.stair_light_pir_owned
    to: 'on'
    for:
      minutes: 20
    id: stuck_guard
  conditions: []
  actions:
  - choose:
    # Light went off by any path (us, manual, scene, bedtime routine) — drop our claim.
    - conditions:
      - condition: trigger
        id: light_went_off
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.stair_light_pir_owned
    # Backstop, not the normal path: the timer tail below is what normally turns the
    # light off. Claim released first so light.turn_off cannot race light_went_off.
    - conditions:
      - condition: trigger
        id: stuck_guard
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.stair_light_pir_owned
      - action: light.turn_off
        target:
          entity_id: light.stair_light
    # The after-bedtime window now belongs to hallway_panels_stairs_pir, which lights the
    # Nanoleaf panels at 10% on the Adaptive Lighting warm curve instead. The dedicated
    # bedtime branch that used to live here was removed with that handover — the guard on
    # binary_sensor.after_bedtime below is what keeps this automation out of that window.
    # Motion, light currently off, dark out (night before bedtime, or a genuinely dim day)
    # -> 100% before the seasonal dim hour, nightly_dim_brightness after it.
    - conditions:
      - condition: trigger
        id: motion
      - condition: state
        entity_id: light.stair_light
        state: 'off'
      # Before bedtime only. After bedtime the hallway panels take over — see
      # binary_sensor.after_bedtime in configuration.yaml for why the boundary lives in
      # one place rather than being duplicated into both automations.
      #
      # "not on" rather than "== off" deliberately: a state condition on 'off' would also
      # fail while that sensor is unknown/unavailable (briefly true at startup before the
      # template renders), and the panels' condition on 'on' would fail too — leaving a
      # dark staircase with neither light responding. Written this way the stair light is
      # the safe default in every state the sensor can hold.
      - condition: template
        value_template: >-
          {{ not is_state('binary_sensor.after_bedtime', 'on')
             or states('light.hallway_nanoleaf_light_panels_left') in ['unavailable', 'unknown']
             or states('light.hallway_nanoleaf_hallway_lights_right') in ['unavailable', 'unknown'] }}
      - condition: or
        conditions:
        - condition: state
          entity_id: sun.sun
          state: below_horizon
        # Preferred: measured-ish estimated outdoor lux below the tunable threshold.
        - condition: template
          value_template: >-
            {{ states('sensor.illuminance') | float(-1) >= 0
               and states('sensor.illuminance') | float(-1)
                   < states('input_number.stairs_dark_lux') | float(1000) }}
        # Fallback only while sensor.illuminance is absent/unavailable: numeric cloud
        # cover with a sun-elevation gate, instead of the old 'partlycloudy' string.
        - condition: template
          value_template: >-
            {{ states('sensor.illuminance') | float(-1) < 0
               and ( state_attr('sun.sun', 'elevation') | float(90) < 5
                     or ( state_attr('weather.forecast_home', 'cloud_coverage') | float(0) > 70
                          and state_attr('sun.sun', 'elevation') | float(90) < 25 ) ) }}
      sequence:
      - action: light.turn_on
        target:
          entity_id: light.stair_light
        data:
          # Cap brightness at nightly_dim_brightness after the seasonal Nightly Dimming
          # hour (9 PM winter, 10 PM shoulder, 11 PM summer), matching the outdoor lights,
          # AND onward until sunrise. The second half matters: `hour >= dim_hr` alone is
          # false for every hour from midnight to dim_hr, so before this the dim leg was
          # unreachable overnight and a 02:00 trip took the full 100% in the face. Not
          # theoretical — the latch sat OFF continuously from 2026-08-02 20:00 to
          # 2026-08-04 00:41, a whole night with HA up and recording.
          # `sun below AND hour < 12` is midnight-to-sunrise specifically; sun.sun alone
          # would also match the evening, and a bare hour cutoff would still be lit at
          # 100% during a dark 07:00 in December. A dark overcast DAY keeps 100%, because
          # the sun is above the horizon then.
          brightness_pct: >-
            {% set dim_hr = 21 if now().month in [11,12,1,2]
                        else 22 if now().month in [3,4,9,10]
                        else 23 %}
            {% if now().hour >= dim_hr
                  or (is_state('sun.sun', 'below_horizon') and now().hour < 12) %}
              {{ states('input_number.nightly_dim_brightness') | int(10) }}
            {% else %}
              100
            {% endif %}
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.stair_light_pir_owned
  # --- shared timer tail (runs after whichever branch above matched) ------------------
  # This replaces the old no_motion trigger, which could never fire: binary_sensor.
  # pir_motion_sensor_2_motion is a battery Tuya PIR that only ever pulses 'on' and sleeps
  # to 'unavailable' — over 8h on 2026-08-08 it produced 17 state changes and not one was
  # 'off'. So "5 minutes of no motion" never arrived and the stair light was only ever
  # switched off by the bedtime routine tripping light_went_off.
  #
  # Being outside the choose is deliberate. On a re-trigger while the light is already on,
  # neither motion branch matches (both require light.stair_light to be 'off'), but this
  # tail still runs and mode: restart re-arms the delay — so continued motion extends the
  # window without re-sending brightness.
  - condition: trigger
    id: motion
  # Only ever turn off a light this automation actually lit. A staircase lit by hand, a
  # scene, or another automation has the claim off, so the sequence stops here.
  - condition: state
    entity_id: input_boolean.stair_light_pir_owned
    state: 'on'
  - delay:
      minutes: 5
  # Re-check after waking: something may have released the claim while we slept.
  - condition: state
    entity_id: input_boolean.stair_light_pir_owned
    state: 'on'
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.stair_light_pir_owned
  - action: light.turn_off
    target:
      entity_id: light.stair_light
- id: stair_pir_stuck_watchdog
  alias: Stair PIR — Stuck-Sensor Watchdog
  description: >-
    binary_sensor.pir_motion_sensor_2_motion is a battery Tuya PIR that reports motion and
    then NEVER reports the clear. It latches 'on' and HA's cached copy goes stale, so the
    to:'on' triggers that drive stairs_pir_motion_light and hallway_panels_stairs_pir can
    only fire once per latch. Measured 2026-08-08/09: the sensor sat 'on' for 46 minutes
    while someone walked past it and nothing happened, and it re-latched within ~4 minutes
    of being cleared. Both stair automations are dead in the water until something resets it.

    Reloading the Tuya config entry re-fetches the true state from the cloud, which clears
    the latch and re-arms both automations. Verified by hand on 2026-08-09: a reload took
    the entity from a stuck 'on' to 'off' with a fresh timestamp.

    HEAVY BY DESIGN, and the trade-off is deliberate: a reload cycles all ~98 Tuya entities
    for a few seconds. The lighter fix — writing the entity's state straight back to 'off' —
    needs the python_script integration enabled, and adding that requires a full HA restart.
    The reload needs neither, and only runs a few times a day (once per real stair trip that
    leaves the sensor latched). If Tuya churn ever becomes a problem, switch to python_script.

    entry_id is hardcoded because homeassistant.reload_config_entry rejects entity targeting
    — target: entity_id returns HTTP 400 despite the service schema advertising target
    support (tested 2026-08-09). To find the id again if the Tuya integration is re-added:
      grep -o '"entry_id": "[^"]*"' .storage/core.config_entries near the tuya domain entry.

    Only alerts if the reload FAILED to clear it. A watchdog that pings on every successful
    self-heal trains you to ignore it.
  mode: single
  max_exceeded: silent
  triggers:
  # Nobody stands on a staircase for 20 minutes — continuous 'on' this long means latched.
  - trigger: state
    entity_id: binary_sensor.pir_motion_sensor_2_motion
    to: 'on'
    for:
      minutes: 20
    id: stuck_on
  # The sibling PIR has sat 'unavailable' for hours at a time; catch that here too.
  - trigger: state
    entity_id: binary_sensor.pir_motion_sensor_2_motion
    to: 'unavailable'
    for:
      hours: 3
    id: offline
  conditions: []
  actions:
  - action: homeassistant.reload_config_entry
    data:
      entry_id: 01KSC806BJV15G6FY4MQ3PCBM2
  # The entry drops its entities and re-adds them; give the cloud fetch time to land.
  - delay:
      seconds: 90
  - if:
    - condition: not
      conditions:
      - condition: state
        entity_id: binary_sensor.pir_motion_sensor_2_motion
        state: 'off'
    then:
    - action: notify.mobile_app_cph2655
      data:
        title: Stair PIR not recovering
        message: >-
          {{ 'Stuck reporting motion for 20 min' if trigger.id == 'stuck_on'
             else 'Offline for 3 hours' }}, and a Tuya reload did not clear it — still
          '{{ states('binary_sensor.pir_motion_sensor_2_motion') }}'. The stair light and
          hallway panels will not respond to motion until this is fixed. Check the sensor
          in the Smart Life app; it may need a battery or re-pair.
- id: hallway_panels_bedtime_scene
  alias: Hallway Panels — Night-Light Scene at Bedtime
  description: >-
    At the bedtime boundary (binary_sensor.after_bedtime turning on) the hallway Nanoleaf
    panels switch to their device-side "night light" scene at 5 percent, and stay there
    until morning. Adaptive Lighting owns brightness and colour for these panels the rest
    of the time, ramping down to its 5 percent floor through the evening; this is the
    handover point where a fixed scene takes over from the curve.

    AL MUST BE PARKED FIRST. It writes brightness and colour on every adaptation tick, and
    any Nanoleaf effect is wiped by such a write - the scene would survive under a minute.
    set_manual_control with manual_control: true is AL's documented way to stand off a
    light without disabling the whole instance, so the other AL-managed lights are
    unaffected. The morning branch clears it again and calls apply so AL resumes its curve
    immediately rather than waiting for its next tick.

    The scene is stored ON the devices, not in HA, and originally existed only on the left
    panel - the right returned HTTP 500 until it was shared across from the Nanoleaf app on
    2026-08-09. If a panel is ever reset or replaced the scene goes with it and this will
    start failing on that panel; re-share it, then reload the Nanoleaf config entry (HA
    caches effect_list per entry, so a newly shared scene is invisible until it reloads).

    Deliberately unconditional on the panels' current state: after bedtime "on at 10 percent
    night light" is the defined resting state, so this turns them on if they were off.
  mode: single
  triggers:
  - trigger: state
    entity_id: binary_sensor.after_bedtime
    to: 'on'
    id: bedtime
  - trigger: state
    entity_id: binary_sensor.after_bedtime
    to: 'off'
    id: morning
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: bedtime
      sequence:
      - action: adaptive_lighting.set_manual_control
        data:
          entity_id: switch.hallway_panels_adaptive_lighting_hallway_panels
          lights:
          - light.hallway_nanoleaf_light_panels_left
          - light.hallway_nanoleaf_hallway_lights_right
          manual_control: true
      - action: light.turn_on
        target:
          entity_id:
          - light.hallway_nanoleaf_light_panels_left
          - light.hallway_nanoleaf_hallway_lights_right
        data:
          brightness_pct: 5
          effect: night light
    - conditions:
      - condition: trigger
        id: morning
      sequence:
      - action: adaptive_lighting.set_manual_control
        data:
          entity_id: switch.hallway_panels_adaptive_lighting_hallway_panels
          lights:
          - light.hallway_nanoleaf_light_panels_left
          - light.hallway_nanoleaf_hallway_lights_right
          manual_control: false
      - action: adaptive_lighting.apply
        data:
          entity_id: switch.hallway_panels_adaptive_lighting_hallway_panels
          lights:
          - light.hallway_nanoleaf_light_panels_left
          - light.hallway_nanoleaf_hallway_lights_right
          adapt_brightness: true
          adapt_color: true
          turn_on_lights: false
- id: hallway_panels_stairs_pir
  alias: Hallway Panels — Stairs PIR (100/50/10% by period, Adaptive Lighting colour)
  description: >-
    Motion on binary_sensor.pir_motion_sensor_2_motion (the Upstairs Stair Sensor) lights
    the two hallway Nanoleaf panels at the top of the stairs, with the Hallway Panels
    Adaptive Lighting instance (1800-6500 K; the NL22 floor is actually 1200 K — 1800 is a
    deliberate choice, see the adaptive_lighting: block in configuration.yaml)
    choosing the colour temperature. Five minutes after the LAST motion pulse they return
    to that period's resting state.

    Three periods, brightest when the house is most awake. The levels were calibrated on
    2026-08-09 with a phone lux sensor placed on the stairs: ambient there is ~21 lux, the
    panels add roughly 0.8 lux per percent through the low range (10% ~ +8 lux, 50% ~ +41),
    and 100% measured ~178 lux above ambient — far more than a straight line predicts, so
    the top of the range is where the useful light actually is. Hence dark-day sits at 100%:
    that is the period competing with daylight.

      dark day (sun up, overcast) -> motion: on (AL at 100%) -> rest: OFF
      after sunset (sun down)     -> motion: on (AL ramps 50->10%) -> rest: 10% "night light"
      after bedtime               -> motion: on (AL at 10%)  -> rest: 10% "night light"

    "Dark day" reuses the same inputs as stairs_pir_motion_light: sensor.illuminance
    against input_number.stairs_dark_lux, falling back to cloud cover plus sun elevation
    when that sensor is missing. The threshold helper is shared rather than duplicated —
    it is the same staircase, and two thresholds would drift apart.

    "After bedtime" is binary_sensor.after_bedtime (configuration.yaml), which is the
    bedtime latch AND the overnight hour window AND sun below horizon.

    BRIGHTNESS AND COLOUR ARE OWNED BY ADAPTIVE LIGHTING (owner instruction
    2026-08-10). The panels are listed in the "Hallway Panels" AL instance in
    configuration.yaml with brightness_mode: linear, so AL gradually dims them through
    the evening down to the Nightly Dim Brightness floor (10%) by bedtime, and warms
    them towards 1800 K. This automation ONLY turns them on and off: a bare turn_on
    leaves AL free to apply its current brightness and colour. Any call here that
    carried brightness_pct or color_temp would override AL, so do not add one.

    The resting state after sunset is whatever Adaptive Lighting is holding - AL owns
    brightness (linear ramp to the 5 percent floor by bedtime) and colour, and motion
    only boosts on top of it. The Nanoleaf night-light scene is NO LONGER the resting
    look, because an effect cannot survive AL writing brightness and colour every tick.
    The older note below is kept for the device-side scene history: the panels
    are on, but the resting preset is reapplied so a motion-triggered cycle always
    settles back to the same known look.

    That scene is stored ON each device, not in HA, and it originally existed only on the
    left panel — asking the right one for it returned HTTP 500 mid-call, changing the left
    and erroring on the right. The owner shared the scene to the right panel from the
    Nanoleaf app on 2026-08-09 and it now applies to both. Note HA caches effect_list per
    config entry, so a scene added in the app is invisible until that entry is reloaded.

    If a panel is ever factory reset or replaced, that scene goes with it and this revert
    will start failing on the panel that lost it. The symptom is an HTTP 500 from
    light.turn_on and a mismatched pair; the fix is to re-share the scene, then reload the
    Nanoleaf config entry.

    During a dark day the resting state is OFF instead, because the panels are not meant to
    sit lit in daylight.

    TIMER, NOT A CLEAR SIGNAL: the PIR is a battery Tuya device that only ever pulses 'on'
    and sleeps to 'unavailable' — over 8h on 2026-08-08 it produced 17 state changes and
    not one was 'off'. So mode: restart plus an inline delay, giving "5 minutes after the
    last pulse" rather than "5 minutes of continuous off", which could never have fired.

    Runs alongside stairs_pir_motion_light, which drives light.stair_light before bedtime.
    They deliberately overlap outside the after-bedtime window; after bedtime the stair
    light stands down and only these panels respond.

    input_boolean.hallway_panels_pir_owned marks that this automation is holding the
    panels: claimed only when not already held, and released the moment either panel goes
    off by ANY path, so a deliberate turn-off is never resurrected 5 minutes later. The
    stuck_guard trigger covers a run cancelled mid-delay (a reload), which would otherwise
    leave the claim set with no pending revert.
  mode: restart
  triggers:
  - trigger: state
    entity_id: binary_sensor.pir_motion_sensor_2_motion
    to: 'on'
    id: motion
  # Added 2026-08-18 (council enhancement E3): the foyer PIR (same battery Tuya
  # pulse-only family as the stair sensor) also feeds the after-bedtime night
  # path — someone crossing the entry hall at night lights the panels the same
  # way stair motion does. No new writer: this automation already owns the
  # panels' on/off in this window, and AL still owns brightness/colour.
  - trigger: state
    entity_id: binary_sensor.pir_motion_sensor_3_motion
    to: 'on'
    id: motion
  - trigger: state
    entity_id:
    - light.hallway_nanoleaf_light_panels_left
    - light.hallway_nanoleaf_hallway_lights_right
    to: 'off'
    id: panels_went_off
  - trigger: state
    entity_id: input_boolean.hallway_panels_pir_owned
    to: 'on'
    for:
      minutes: 20
    id: stuck_guard
  conditions: []
  actions:
  - choose:
    # Either panel went off by any path — drop the claim. mode: restart has already
    # cancelled any pending revert, which is exactly right for a deliberate turn-off.
    - conditions:
      - condition: trigger
        id: panels_went_off
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.hallway_panels_pir_owned
    # Backstop for a run cancelled before its revert ran. Claim released first so the
    # revert cannot race panels_went_off back into an inconsistent claim.
    - conditions:
      - condition: trigger
        id: stuck_guard
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.hallway_panels_pir_owned
      - if:
        - condition: state
          entity_id: sun.sun
          state: above_horizon
        then:
        - action: light.turn_off
          target:
            entity_id:
            - light.hallway_nanoleaf_light_panels_left
            - light.hallway_nanoleaf_hallway_lights_right
        else:
        # Hand the panels back to Adaptive Lighting. Clearing manual_control undoes the
        # take-over caused by the boost above; apply() then snaps them to AL's current
        # curve instead of waiting for its next tick. Deliberately NO brightness/effect
        # here - setting either would re-take control and defeat "AL owns brightness".
        # This is why the night-light scene is no longer the resting look: an effect
        # cannot survive AL writing brightness and colour on every tick.
        - if:
          - condition: state
            entity_id: binary_sensor.after_bedtime
            state: 'on'
          then:
          # After bedtime the night-light scene IS the resting look, not AL's curve.
          # AL has to be parked first: it writes brightness and colour every tick and
          # would wipe the effect within a minute otherwise. hallway_panels_bedtime_scene
          # parks it at the bedtime transition; this re-parks it after a motion boost.
          - action: adaptive_lighting.set_manual_control
            data:
              entity_id: switch.hallway_panels_adaptive_lighting_hallway_panels
              lights:
              - light.hallway_nanoleaf_light_panels_left
              - light.hallway_nanoleaf_hallway_lights_right
              manual_control: true
          - action: light.turn_on
            target:
              entity_id:
              - light.hallway_nanoleaf_light_panels_left
              - light.hallway_nanoleaf_hallway_lights_right
            data:
              brightness_pct: 5
              effect: night light
          else:
          # Before bedtime AL owns the resting level, so hand control back to it.
          - action: adaptive_lighting.set_manual_control
            data:
              entity_id: switch.hallway_panels_adaptive_lighting_hallway_panels
              lights:
              - light.hallway_nanoleaf_light_panels_left
              - light.hallway_nanoleaf_hallway_lights_right
              manual_control: false
          - action: adaptive_lighting.apply
            data:
              entity_id: switch.hallway_panels_adaptive_lighting_hallway_panels
              lights:
              - light.hallway_nanoleaf_light_panels_left
              - light.hallway_nanoleaf_hallway_lights_right
              adapt_brightness: true
              adapt_color: true
              turn_on_lights: false
    # Motion, in any of the three periods. Daylight that is NOT dark enough falls through
    # here and does nothing, which is the point — no branch matches, no lights.
    - conditions:
      - condition: trigger
        id: motion
      - condition: or
        conditions:
        # after bedtime (already implies sun below horizon)
        - condition: state
          entity_id: binary_sensor.after_bedtime
          state: 'on'
        # after sunset
        - condition: state
          entity_id: sun.sun
          state: below_horizon
        # dark day: preferred estimated-lux reading below the shared threshold
        - condition: template
          value_template: >-
            {{ states('sensor.illuminance') | float(-1) >= 0
               and states('sensor.illuminance') | float(-1)
                   < states('input_number.stairs_dark_lux') | float(1000) }}
        # dark day fallback, only while sensor.illuminance is absent/unavailable
        - condition: template
          value_template: >-
            {{ states('sensor.illuminance') | float(-1) < 0
               and ( state_attr('sun.sun', 'elevation') | float(90) < 5
                     or ( state_attr('weather.forecast_home', 'cloud_coverage') | float(0) > 70
                          and state_attr('sun.sun', 'elevation') | float(90) < 25 ) ) }}
      sequence:
      - if:
        - condition: state
          entity_id: input_boolean.hallway_panels_pir_owned
          state: 'off'
        then:
        - action: input_boolean.turn_on
          target:
            entity_id: input_boolean.hallway_panels_pir_owned
      # BOOST above whatever level AL is currently holding. AL owns the resting level;
      # this is a deliberate temporary lift for someone actually on the stairs. A bare
      # turn-on would come up at AL's ambient level, which by bedtime is the 5 percent
      # floor - not a boost at all.
      #
      # Passing brightness here DOES put the panels into AL's manual_control list, and
      # that is wanted for the duration: AL stands off so the boost holds steady instead
      # of being dragged back down mid-window. The revert hands control back explicitly
      # via set_manual_control.
      #
      # +30 percentage points is the one tunable number. The float(5) fallback matches
      # AL's min_brightness in configuration.yaml, so a missing AL switch degrades to
      # the same floor rather than a stale higher one. Calibrated 2026-08-09 with a
      # phone lux meter on the stairs: the panels give about 0.8 lux per percent in the
      # low range, so +30pp is roughly +24 lux - a clear lift without being a shock at
      # 2am. Capped at 100.
      - action: light.turn_on
        target:
          entity_id:
          - light.hallway_nanoleaf_light_panels_left
          - light.hallway_nanoleaf_hallway_lights_right
        data:
          brightness_pct: >-
            {{ [ ((state_attr('switch.hallway_panels_adaptive_lighting_hallway_panels', 'brightness_pct') | float(5)) + 30)
                 | round(0) | int, 100 ] | min }}
      # A new motion pulse restarts this automation and cancels the delay, so the panels
      # stay up until 5 minutes after the last pulse.
      - delay:
          minutes: 5
      - condition: state
        entity_id: input_boolean.hallway_panels_pir_owned
        state: 'on'
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.hallway_panels_pir_owned
      # Resting state. Sun up means this was the dark-day case, where the panels should
      # not stay lit; otherwise back to the 10% night look. Evaluated now rather than at
      # motion time so a cycle spanning sunset settles into the correct end state.
      - if:
        - condition: state
          entity_id: sun.sun
          state: above_horizon
        then:
        - action: light.turn_off
          target:
            entity_id:
            - light.hallway_nanoleaf_light_panels_left
            - light.hallway_nanoleaf_hallway_lights_right
        else:
        # Resting preset, not AL values: this is the deliberate "settled for the night"
        # look. AL re-syncs colour/brightness while the panels stay on.
        # Hand the panels back to Adaptive Lighting. Clearing manual_control undoes the
        # take-over caused by the boost above; apply() then snaps them to AL's current
        # curve instead of waiting for its next tick. Deliberately NO brightness/effect
        # here - setting either would re-take control and defeat "AL owns brightness".
        # This is why the night-light scene is no longer the resting look: an effect
        # cannot survive AL writing brightness and colour on every tick.
        - if:
          - condition: state
            entity_id: binary_sensor.after_bedtime
            state: 'on'
          then:
          # After bedtime the night-light scene IS the resting look, not AL's curve.
          # AL has to be parked first: it writes brightness and colour every tick and
          # would wipe the effect within a minute otherwise. hallway_panels_bedtime_scene
          # parks it at the bedtime transition; this re-parks it after a motion boost.
          - action: adaptive_lighting.set_manual_control
            data:
              entity_id: switch.hallway_panels_adaptive_lighting_hallway_panels
              lights:
              - light.hallway_nanoleaf_light_panels_left
              - light.hallway_nanoleaf_hallway_lights_right
              manual_control: true
          - action: light.turn_on
            target:
              entity_id:
              - light.hallway_nanoleaf_light_panels_left
              - light.hallway_nanoleaf_hallway_lights_right
            data:
              brightness_pct: 5
              effect: night light
          else:
          # Before bedtime AL owns the resting level, so hand control back to it.
          - action: adaptive_lighting.set_manual_control
            data:
              entity_id: switch.hallway_panels_adaptive_lighting_hallway_panels
              lights:
              - light.hallway_nanoleaf_light_panels_left
              - light.hallway_nanoleaf_hallway_lights_right
              manual_control: false
          - action: adaptive_lighting.apply
            data:
              entity_id: switch.hallway_panels_adaptive_lighting_hallway_panels
              lights:
              - light.hallway_nanoleaf_light_panels_left
              - light.hallway_nanoleaf_hallway_lights_right
              adapt_brightness: true
              adapt_color: true
              turn_on_lights: false
- id: blinds_night_close
  alias: Blinds — Night Close (consolidated)
  description: Close all 4 motorized blinds at sunset for privacy. AI controls blinds only in daylight.
  mode: single
  triggers:
  - trigger: sun
    event: sunset
  conditions: []
  actions:
  - action: cover.close_cover
    target:
      entity_id:
      - cover.dining_room_blinds_curtain
      - cover.family_room_blinds_curtain
      - cover.living_room_blinds_curtain
      - cover.mina_s_blinds_curtain
- id: climate_safety_backstop
  alias: Climate Safety Backstop (overheat/freeze)
  description: >
    Hardcoded backstop if the AI is unreachable or stale. Forces cool above 27C,
    heat below 16C.
    Reads sensor.climate_ai_ecobee_temperature, NOT the raw HomeKit
    sensor.ecobee_current_temperature this used to watch. That raw sensor stuck
    at 0 on 2026-08-20T18:54 and was still 0 three days later, which silently
    disarmed this entire automation: the `above: 4` dropout guard below is what
    makes a stuck 0 unable to ever fire the freeze branch, and 0 is likewise
    never above 27, so the overheat branch died too. The canonical sensor falls
    back native_ecobee -> homekit -> smartthings, so one dead source cannot
    disarm the last line of defense again.
  mode: single
  triggers:
  # for: reading must persist 5 min, so a transient blip is ignored.
  - trigger: numeric_state
    entity_id: sensor.climate_ai_ecobee_temperature
    above: 27
    for: "00:05:00"
  # above: 4 floors out spurious 0/dropout values (e.g. ecobee power-loss reconnect,
  # which has no UPS). A real freeze crosses 15->14, not 22->0.
  - trigger: numeric_state
    entity_id: sensor.climate_ai_ecobee_temperature
    above: 4
    below: 16
    for: "00:05:00"
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: numeric_state
        entity_id: sensor.climate_ai_ecobee_temperature
        above: 27
      sequence:
      - action: climate.set_hvac_mode
        target:
          entity_id: climate.ecobee
        data:
          hvac_mode: cool
    - conditions:
      # above: 4 defense-in-depth floor mirrors the trigger guard.
      - condition: numeric_state
        entity_id: sensor.climate_ai_ecobee_temperature
        above: 4
        below: 16
      sequence:
      - action: climate.set_hvac_mode
        target:
          entity_id: climate.ecobee
        data:
          hvac_mode: heat

# --- Lawn watering START (Smart Irrigation -> valve) ---
# Smart Irrigation only computes a duration; it does not switch the valve.
# This automation bridges the duration sensor to the physical valve.
- alias: "Lawn watering: start cycle"
  description: >
    Waters the front lawn at 05:00 for the Smart Irrigation computed duration,
    then turns off and calls smart_irrigation.reset_bucket so the deficit resets.
    SI calculates at 04:00; this runs the valve at 05:00 when there is a positive
    duration AND the last watering was >=2 days ago (deep-and-infrequent watering,
    user 2026-07-13 — deficit accumulates across skipped days). Calibrated
    2026-07-13: zone throughput 13.4 L/min (METER-MEASURED: 67 L in 5 min; was 25)
    and zone maximum_duration raised to 5400 s, so expect ~40-80 min runs
    every other day (~25 mm/week incl. rain credit). run_seconds capped at 5400 s;
    the valve_2 Max Runtime Failsafe (100 min) is the independent hard backstop.
    2026-07-14 (FINAL): valve runs on TUYA CLOUD.
    switch.dual_outlet_irrigation_timer_switch_2 (outlet 1 unused, user-confirmed).
    WHY NOT ZHA: the valve is a sleepy battery end device (receiver off when idle) and
    the ZHA network has ZERO routers — just the coordinator and this valve. Downlink to a
    sleepy device needs a parent to buffer until it polls; the bare CC2652 ages the entry
    out in ~15-35 min, after which every command dies with NWK_NO_ROUTE. Re-pairing fixes
    it for about half an hour, then it silently rots. This caused a 2-day dry lawn that
    LOOKED healthy in every log, because the ZHA switch entity is written from a
    LocalDataCluster BEFORE the radio send: it reads "on" even when delivery fails
    outright. LQI/last_seen looked perfect throughout — they only measure UPLINK.
    DO NOT move back to ZHA without first adding a mains-powered Zigbee router near the tap.
    WHY THE SWITCH STATE IS TRUSTED HERE: unlike ZHA, the Tuya switch state is a real
    round trip (HA -> cloud -> gateway -> device -> back). Measured 2026-07-14: 25 s to
    confirm ON, 10 s to confirm OFF, with live water verified at the sprinkler. An
    optimistic cache flips instantly; a multi-second confirm is a genuine device report.
    Hence the 90 s wait timeouts below (45 s was sized for local ZHA and is too tight).
    TRADE-OFF: this path needs the internet. No internet => no watering AND no failure
    push (notify goes out via FCM). It fails closed and silent — check the lawn if the
    connection has been down.
    NOTE: Tuya exposes only switch_1/switch_2/battery — there is no status or countdown
    sensor on this path, so the switch state is the only run signal available.
    STILL UNEXPLAINED: on 2026-07-13 05:00 (before the route broke) a delivered command
    made the device report a real 1070 s run and NO water reached the lawn (camera).
    No theory fits. If a confirmed run ever produces no water again, start there.
  id: "lawn_watering_start"
  mode: single
  triggers:
    - trigger: time
      at: "05:00:00"
  conditions:
    # Only water if Smart Irrigation computed a positive run time (calc runs 04:00; read here at 05:00).
    - condition: numeric_state
      entity_id: sensor.smart_irrigation_front_lawn_valve_2
      above: 0
    # Master watering switch on. Odd/even-day bylaw check removed 2026-07-11 (not enforced locally).
    - condition: state
      entity_id: input_boolean.lawn_watering_master_enable
      state: 'on'
    # Deep-and-infrequent watering (user 2026-07-13): only water if the last completed watering was
    # >=2 days ago (47h allows for trigger jitter). The bucket keeps accumulating deficit on skipped
    # days (it is only reset after an actual watering), so each run delivers the accumulated need.
    # NOTE: SI's own days_between_irrigation setting only gates its start EVENT, which this
    # time-triggered automation does not use — hence the gate lives here.
    # 2026-07-14: gate moved OFF this automation's own last_triggered onto input_datetime.
    # lawn_last_watered (set at the end of a successful run). last_triggered is bumped by manual/
    # test triggers too, survives automation.reload, and has no API to reset — so a single 25 s
    # test silently cancelled the next real watering. This helper is settable, so tests are undoable.
    - condition: template
      value_template: >-
        {{ state_attr('input_datetime.lawn_last_watered', 'timestamp') is none
           or (now().timestamp() - state_attr('input_datetime.lawn_last_watered', 'timestamp')) >= 169200 }}
  actions:
    - variables:
        run_seconds: >-
          {{ [ states('sensor.smart_irrigation_front_lawn_valve_2') | float(0) | round(0) | int, 5400 ] | min }}
    # ---- OPEN, verified against the DEVICE via the Tuya cloud round trip.
    #      The Tuya switch state is NOT optimistic: it only turns 'on' once the device has
    #      reported back through the gateway. Measured 2026-07-14 with water at the sprinkler:
    #      25 s to confirm on. (Contrast ZHA, where the same-named check was worthless because
    #      the quirk wrote a LocalDataCluster before the radio send and flipped instantly.)
    #      Rule of thumb: an INSTANT state flip is a cache; a multi-second one is a real report.
    #      90 s timeout because a cloud round trip is ~10-25 s and can be slower under load.
    #      Fails closed: no confirmation => abort, alert, and preserve the deficit.
    - repeat:
        sequence:
          - action: switch.turn_on
            target:
              entity_id: switch.dual_outlet_irrigation_timer_switch_2
            continue_on_error: true
          - delay: "00:00:15"
          - action: homeassistant.update_entity
            target:
              entity_id: switch.dual_outlet_irrigation_timer_switch_2
          - wait_template: "{{ is_state('switch.dual_outlet_irrigation_timer_switch_2', 'on') }}"
            timeout: "00:01:30"
            continue_on_timeout: true
        until: "{{ is_state('switch.dual_outlet_irrigation_timer_switch_2', 'on') or repeat.index >= 3 }}"
    # ---- Never opened: alert and ABORT before reset_bucket, so the moisture
    #      deficit carries to the next run instead of being falsely cleared.
    - if:
        - condition: template
          value_template: "{{ not is_state('switch.dual_outlet_irrigation_timer_switch_2', 'on') }}"
      then:
        - action: notify.mobile_app_cph2655
          data:
            title: "🚨 Lawn watering FAILED to start"
            message: >-
              Front lawn valve never confirmed ON after 3 attempts (it reports
              '{{ states('switch.dual_outlet_irrigation_timer_switch_2') }}'). The command did not
              reach the valve. Check, in order: (1) is the internet up — this path is Tuya CLOUD;
              (2) does the valve respond in the Tuya app — if not, remove + re-add it there;
              (3) battery is {{ states('sensor.dual_outlet_irrigation_timer_battery') }}%.
              Bucket NOT reset — the {{ (run_seconds / 60) | round(1) }} min deficit carries to the
              next run. Lawn was NOT watered.
        - stop: "valve never confirmed on - deficit preserved for next run"
    - delay:
        seconds: "{{ run_seconds }}"
    # ---- CLOSE, verified by the same cloud round trip (measured 10 s to confirm off).
    #      Retry up to 4x (closing matters more than opening — a stuck-open valve floods).
    - repeat:
        sequence:
          - action: switch.turn_off
            target:
              entity_id: switch.dual_outlet_irrigation_timer_switch_2
            continue_on_error: true
          - wait_template: "{{ is_state('switch.dual_outlet_irrigation_timer_switch_2', 'off') }}"
            timeout: "00:01:30"
            continue_on_timeout: true
        until: "{{ is_state('switch.dual_outlet_irrigation_timer_switch_2', 'off') or repeat.index >= 4 }}"
    - if:
        - condition: template
          value_template: "{{ not is_state('switch.dual_outlet_irrigation_timer_switch_2', 'off') }}"
      then:
        - action: notify.mobile_app_cph2655
          data:
            title: "🚨 Lawn valve did NOT close"
            message: >-
              valve_2 has not reported 'Idle' after 4 close attempts (device reports
              '{{ states('switch.dual_outlet_irrigation_timer_switch_2') }}'). The valve may still be
              running. The 100-min failsafe is the backstop — go check the tap.
    # ---- Water WAS delivered (the device confirmed a run), so reset the bucket even if the
    #      close needed retries — the close alert above is a separate concern.
    - action: smart_irrigation.reset_bucket
      target:
        entity_id: sensor.smart_irrigation_front_lawn_valve_2
    # ---- Stamp the 2-day gate. Only reached on a verified watering: a failed open
    #      stops above, so a missed run does NOT push the next one out by 2 days.
    - action: input_datetime.set_datetime
      target:
        entity_id: input_datetime.lawn_last_watered
      data:
        datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
    - action: notify.mobile_app_cph2655
      data:
        title: "✅ Front lawn watered"
        message: "Ran {{ run_seconds }} s ({{ (run_seconds / 60) | round(1) }} min), Smart Irrigation calc. Bucket reset."
# --- Lawn watering veto (Hamilton bylaw odd-day + master kill) ---
- alias: "Lawn watering: veto cycle"
  description: >
    Vetoes Smart Irrigation if watering is banned today.
    Checks odd-day parity (house 31) and master-kill input_boolean.
    Triggered by valve switch turning on; either kills it within seconds or
    sends a confirmation notification.
  id: "lawn_watering_veto"
  initial_state: false  # DISABLED 2026-07-11 per user — odd/even watering bylaw not enforced locally.
  mode: single
  triggers:
    - trigger: state
      entity_id: switch.dual_outlet_irrigation_timer_switch_2
      from: "off"
      to: "on"
  variables:
    is_odd_day: "{{ now().day % 2 == 1 }}"
    master_enabled: "{{ states('input_boolean.lawn_watering_master_enable') == 'on' }}"
    duration_sensor_entity: "sensor.smart_irrigation_front_lawn_valve_2"
    duration_value: >
      {% set d = states(duration_sensor_entity) %}
      {% if d | is_number %}
        {{ d }} min
      {% else %}
        (duration not available)
      {% endif %}
  actions:
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ is_odd_day and master_enabled }}"
          sequence:
            - action: notify.mobile_app_cph2655
              data:
                title: "🚿 Front lawn watering started"
                message: "Watering cycle running for {{ duration_value }}."
      default:
        - action: switch.turn_off
          target:
            entity_id: switch.dual_outlet_irrigation_timer_switch_2
        - action: notify.mobile_app_cph2655
          data:
            title: "🚫 Watering vetoed"
            message: >
              {% set reasons = [] %}
              {% if not is_odd_day %}
                {% set reasons = reasons + ['Today is an even day — odd-address watering not allowed'] %}
              {% endif %}
              {% if not master_enabled %}
                {% set reasons = reasons + ['Master watering switch is OFF (toggle input_boolean.lawn_watering_master_enable to re-enable)'] %}
              {% endif %}
              Watering was blocked.
              {% for r in reasons %}
              - {{ r }}
              {% endfor %}

# --- Lawn watering morning report ---
# Daily 07:00 check on last night's Smart Irrigation calc + whether the
# front-lawn valve actually ran. Confirms the auto-watering chain is healthy.
- alias: "Lawn watering: morning report"
  description: >-
    Daily 07:00 report on the Smart Irrigation calculation and whether the
    front-lawn valve ran since 23:00. Catches a silent calc/mapping failure.
  id: "lawn_watering_morning_report"
  mode: single
  triggers:
    - trigger: time
      at: "07:00:00"
  actions:
    - variables:
        dur_min: >-
          {{ states('sensor.smart_irrigation_front_lawn_valve_2') | float(0) | round(0) | int }}
        valve_last: >-
          {{ state_attr('switch.dual_outlet_irrigation_timer_switch_2', 'last_changed') }}
        master: >-
          {{ is_state('input_boolean.lawn_watering_master_enable', 'on') }}
        odd_day: >-
          {{ now().day % 2 == 1 }}
        last_watered: >-
          {{ state_attr('input_datetime.lawn_last_watered', 'timestamp') }}
        ran_since_2300: >-
          {% set cutoff = as_timestamp(now().replace(hour=0, minute=0, second=0, microsecond=0)) - 3600 %}
          {% set v_ts = as_timestamp(valve_last) if valve_last else 0 %}
          {% set lw_ts = last_watered if last_watered else 0 %}
          {{ v_ts > cutoff or lw_ts > cutoff }}
    - action: notify.mobile_app_cph2655
      data:
        title: "🌱 Lawn watering status"
        message: >-
          Calc need: {{ dur_min }} min.
          {% if dur_min > 0 %}Valve ran since 23:00: {{ 'YES' if ran_since_2300 else 'NO — check!' }}.
          {% else %}No water needed (or calc/mapping issue — verify).
          {% endif %}
          Master: {{ 'ON' if master else 'OFF' }} | Odd-day allowed: {{ 'yes' if odd_day else 'no' }}.
- alias: "Lawn watering: veto-failure watchdog"
  description: >-
    Belt-and-suspenders alert for a veto FAILURE. When the front-lawn valve
    turns on in violation of the watering rules (even day, or master switch
    off), the veto automation normally kills it within seconds. This watchdog
    waits a short grace period, then pages ONLY if the valve is STILL on in
    violation — meaning the veto did not do its job (logic bug, manual flip,
    or another automation). Catches a veto failure.
  id: "lawn_watering_veto_watchdog"
  initial_state: false  # DISABLED 2026-07-11 per user — odd/even watering bylaw not enforced locally.
  mode: single
  triggers:
    - trigger: state
      entity_id: switch.dual_outlet_irrigation_timer_switch_2
      from: "off"
      to: "on"
  actions:
    # Give the veto automation a few seconds to do its job first.
    - delay: "00:00:10"
    # Re-check: still ON and a rule is violated => the veto failed.
    - condition: template
      value_template: >-
        {{ is_state('switch.dual_outlet_irrigation_timer_switch_2', 'on') and
           (now().day % 2 != 1 or
            not is_state('input_boolean.lawn_watering_master_enable', 'on')) }}
    - variables:
        odd_day: >-
          {{ now().day % 2 == 1 }}
        master_on: >-
          {{ is_state('input_boolean.lawn_watering_master_enable', 'on') }}
    - action: notify.mobile_app_cph2655
      data:
        title: "🚨 Watering veto FAILED"
        message: >-
          {% set why = [] %}
          {% if not odd_day %}{% set why = why + ['Today is an EVEN day — odd-address watering not allowed'] %}{% endif %}
          {% if not master_on %}{% set why = why + ['Master watering switch is OFF'] %}{% endif %}
          Front-lawn valve (switch.dual_outlet_irrigation_timer_switch_2) is ON in
          violation of the watering rules — the veto did NOT block it!
          {% for r in why %}- {{ r }}
          {% endfor %}
- id: house_away_mode
  alias: 'House: Away Mode'
  description: 'Both phones away for 10 min (Arshad person + Larissa S22 SmartThings presence) -> pause Climate AI, set back the ecobee, turn off the office heater. Guards: skipped if the Family Room TV (toshiba_firetv) is on or the kitchen Nest camera saw a PERSON in the last 30 min — indoor motion sensors are cat-trippable, so only person-grade signals are used. NEVER touches the Airbnb heater (guest automations own it).'
  mode: single
  triggers:
  - trigger: state
    entity_id: person.arshad14
    to: not_home
    for: '00:10:00'
  - trigger: state
    entity_id: binary_sensor.larissa_s_s22_presence
    to: 'off'
    for: '00:10:00'
  conditions:
  - condition: state
    entity_id: person.arshad14
    state: not_home
  - condition: state
    entity_id: binary_sensor.larissa_s_s22_presence
    state: 'off'
  - condition: state
    entity_id: input_boolean.house_away
    state: 'off'
  - condition: template
    value_template: "{{ states('media_player.toshiba_firetv') in ('off', 'idle', 'standby', 'unavailable', 'unknown') }}"
  - condition: template
    value_template: >-
      {{ states('event.kitchen_kitchen_display_motion') in ('unknown', 'unavailable')
         or state_attr('event.kitchen_kitchen_display_motion', 'event_type') != 'camera_person'
         or (now() - states.event.kitchen_kitchen_display_motion.last_changed).total_seconds() > 1800 }}
  actions:
  - action: input_boolean.turn_on
    target:
      entity_id: input_boolean.house_away
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.climate_ai_enabled
  - choose:
    - conditions:
      - condition: state
        entity_id: climate.ecobee
        state: cool
      sequence:
      - action: climate.set_temperature
        target:
          entity_id: climate.ecobee
        data:
          temperature: 26
    - conditions:
      - condition: state
        entity_id: climate.ecobee
        state: heat
      sequence:
      - action: climate.set_temperature
        target:
          entity_id: climate.ecobee
        data:
          temperature: 18
    - conditions:
      - condition: state
        entity_id: climate.ecobee
        state: heat_cool
      sequence:
      - action: climate.set_temperature
        target:
          entity_id: climate.ecobee
        data:
          target_temp_high: 26
          target_temp_low: 18
  - action: climate.set_hvac_mode
    target:
      entity_id: climate.office_heater_2
    data:
      hvac_mode: 'off'
  - action: notify.mobile_app_cph2655
    data:
      message: 'Away mode ON: Climate AI paused, ecobee set back, office heater off. Airbnb untouched.'
- id: house_away_mode_return
  alias: 'House: Away Mode - Return'
  description: 'Either phone returns -> clear away mode, resume Climate AI and run it immediately so the LLM restores normal comfort.'
  mode: single
  triggers:
  - trigger: state
    entity_id: person.arshad14
    to: home
  - trigger: state
    entity_id: binary_sensor.larissa_s_s22_presence
    to: 'on'
  conditions:
  - condition: state
    entity_id: input_boolean.house_away
    state: 'on'
  actions:
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.house_away
  - action: input_boolean.turn_on
    target:
      entity_id: input_boolean.climate_ai_enabled
  - action: automation.trigger
    target:
      entity_id: automation.climate_ai_advisor
  - action: notify.mobile_app_cph2655
    data:
      message: 'Welcome back: away mode cleared, Climate AI resumed.'
- id: camp_day_reminder
  alias: 'Calendar: Camp Day Reminder'
  description: 'Notifies at 07:45 on days with an Izaan camp event on the shared activities calendar (drop-off is 8:00-9:00 AM).'
  mode: single
  triggers:
  - trigger: calendar
    entity_id: calendar.summer_camp_shared
    event: start
    offset: '07:45:00'
  conditions:
  - condition: template
    value_template: "{{ 'camp' in (trigger.calendar_event.summary | lower) }}"
  actions:
  - action: notify.mobile_app_cph2655
    data:
      message: "Camp day: {{ trigger.calendar_event.summary }} — drop-off 8:00-9:00 AM."
- id: bedtime_shutdown_reset
  alias: 'Bed Time - Reset Nightly Latch'
  description: 'Clears input_boolean.bedtime_shutdown_done at 20:00 daily so the bedtime verification poll is armed fresh for the coming night. 20:00 is before the 21:00 poll window, so it never clears the latch mid-shutdown.'
  mode: single
  triggers:
  - trigger: time
    at: '20:00:00'
  conditions: []
  actions:
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.bedtime_shutdown_done
- id: foyer_light_off_after_door_closed
  alias: 'Foyer Light Daytime Auto-Off (door closed 30 min, or sun came out)'
  description: 'During the day, turn the foyer light off when ANY of these happen: the front door has stayed closed for 30 min; the UV index rises above 2; or it turns sunny out. The foyer is only turned ON on gloomy days, so it should switch off once it brightens or the door has been shut a while. Reliable replacement for the hallway-motion auto-off (foyer_light_daytime_auto_off), whose presence_3 mmWave is unavailable. The door-close timer resets if the door reopens; the UV/sunny triggers fire on the transition, so a foyer light manually switched on during an already-sunny day is left alone.'
  mode: single
  triggers:
  - trigger: state
    entity_id: binary_sensor.front_door_door
    to: 'off'
    for:
      minutes: 30
  - trigger: numeric_state
    entity_id: weather.forecast_home
    attribute: uv_index
    above: 2
  - trigger: state
    entity_id: weather.forecast_home
    to: 'sunny'
  conditions:
  - condition: state
    entity_id: switch.foyer_light_switch_1
    state: 'on'
  - condition: template
    value_template: '{{ state_attr(''sun.sun'', ''elevation'') | float(-1) > 0 }}'
  actions:
  - action: switch.turn_off
    target:
      entity_id: switch.foyer_light_switch_1
- id: valve_2_max_runtime_guard
  alias: 'Front Lawn Valve 2 - Max Runtime Failsafe'
  description: 'Independent hard safety cap for the front-lawn valve. If the valve runs for 100 minutes for ANY reason (watering automation bug, HA restart mid-run, manual, device glitch), force it off and notify. Raised from 60 min on 2026-07-13: legitimate deep-watering runs can now reach 90 min (SI maximum_duration 5400 s at the calibrated 13.4 L/min flow). 2026-07-14 (late): re-pointed from the ZHA valve to the Tuya Cloud valve (switch.dual_outlet_irrigation_timer_switch_2) after ZHA proved unable to hold a route to this sleepy battery device — see the notes on lawn_watering_start. Unlike the ZHA switch (which was written from a LocalDataCluster BEFORE the radio send and therefore read "on" even when delivery failed), the Tuya switch state is a real cloud round trip from the device: measured 25 s to confirm on, 10 s to confirm off. An instant flip would have meant a cache; a multi-second one means a genuine device report. So a single trigger on this entity is trustworthy. Belt-and-suspenders backstop to lawn_watering_start_cycle; always enabled.'
  mode: single
  triggers:
  # Tuya switch state is device-reported (cloud round trip), so this is a real run signal.
  - trigger: state
    entity_id: switch.dual_outlet_irrigation_timer_switch_2
    to: 'on'
    for:
      minutes: 100
  conditions: []
  actions:
  # This is the LAST line of defence, so its close is verified + retried (up to 5x)
  # rather than fire-and-forget — a dropped command here would leave water running.
  - repeat:
      sequence:
      - action: switch.turn_off
        target:
          entity_id: switch.dual_outlet_irrigation_timer_switch_2
        continue_on_error: true
      - wait_template: "{{ is_state('switch.dual_outlet_irrigation_timer_switch_2', 'off') }}"
        timeout: "00:01:30"
        continue_on_timeout: true
      until: "{{ is_state('switch.dual_outlet_irrigation_timer_switch_2', 'off') or repeat.index >= 5 }}"
  - action: notify.mobile_app_cph2655
    data:
      title: >-
        {{ "🚨 Front lawn valve force-closed (100-min cap)" if is_state('switch.dual_outlet_irrigation_timer_switch_2', 'off')
           else "🚨🚨 LAWN VALVE STUCK OPEN - GO SHUT THE TAP" }}
      message: >-
        valve_2 ran for 100 minutes and hit the hard safety cap.
        {{ "Force-closed successfully (device reports Idle) — check why the watering automation did not close it."
           if is_state('switch.dual_outlet_irrigation_timer_switch_2', 'off')
           else "IT DID NOT CONFIRM CLOSED after 5 attempts (device reports '"
                ~ states('switch.dual_outlet_irrigation_timer_switch_2')
                ~ "') and may STILL BE RUNNING — shut the tap manually." }}
