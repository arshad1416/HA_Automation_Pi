# =============================================================================
# 07_presence_sensors.yaml — mmWave presence-sensor automations
# -----------------------------------------------------------------------------
# Family Room LD2420   -> binary_sensor.family_room_mmwave_presence
#                         (node family-room-mmwave @ 192.168.0.121, timeout 120s)
# Master Bedroom combined-> binary_sensor.master_bedroom_occupancy_combined
#   OR of LD2420 mmWave (node @ 192.168.0.108, timeout 120s) + Ecobee 332D.
#
# Ceiling fan speeds are NOT controlled here — the Climate AI owns all fan/HVAC
# decisions and receives the combined master-bedroom signal in its prompt.
# =============================================================================

- id: family_room_auto_off_empty
  alias: Family Room — Lights off after 10 min no presence
  description: Turn off the family room ceiling light after 10 minutes with no mmWave
    presence AND the TV plug is off. The TV is plugged into a switched smart plug
    (switch.family_room_speaker_plug_socket_1) - plug off means the TV is definitely
    off; plug on means it may be in use (movie mode), so the lights are never turned
    off while the plug is on. This replaces the flaky LG WebOS state, which reports
    "unavailable" both when the TV is off and during transient hiccups while it is on.
    A plug-off trigger and a 10-min periodic backstop catch every shutdown path.
  mode: restart
  triggers:
  - entity_id: binary_sensor.family_room_mmwave_presence
    to: 'off'
    for: 00:10:00
    trigger: state
  - entity_id: switch.family_room_speaker_plug_socket_1
    to: 'off'
    trigger: state
  - trigger: time_pattern
    minutes: '/10'
  conditions:
  - condition: state
    entity_id: light.family_room_light
    state: 'on'
  # Room must have been empty for at least 10 minutes.
  - condition: template
    value_template: "{{ is_state('binary_sensor.family_room_mmwave_presence','off') and (now() - states.binary_sensor.family_room_mmwave_presence.last_changed).total_seconds() >= 600 }}"
  # TV plug must be off (TV definitely not in use). While the plug is on the
  # lights are protected, even if the presence sensor briefly misses someone.
  - condition: state
    entity_id: switch.family_room_speaker_plug_socket_1
    state: 'off'
  actions:
  - action: light.turn_off
    target:
      entity_id: light.family_room_light
- id: family_room_tv_idle_alert
  alias: Family Room — TV on but nobody watching for 30 min
  description: Notify the primary phone if the LG TV is playing but no mmWave presence has been detected for 30 minutes (likely
    left on by accident).
  mode: single
  max_exceeded: silent
  triggers:
  - entity_id: binary_sensor.family_room_mmwave_presence
    to: 'off'
    for: 00:30:00
    trigger: state
  conditions:
  - condition: state
    entity_id: media_player.lg_webos_tv_un8500auj
    state: playing
  actions:
  - action: notify.mobile_app_cph2655
    data:
      title: 📺 TV still on
      message: Family room TV is playing but no one detected for 30 min. Turn off?
      data:
        actions:
        - action: TURN_OFF_TV
          title: Turn Off TV
- id: master_bedroom_bedtime_detection
  alias: Master Bedroom — Bedtime detected, trigger early lock check
  description: If there is sustained presence in the master bedroom after 22:00 and both Nanoleaf bedside lights are off,
    assume bedtime and trigger the nightly lock check automation early.
  mode: single
  max_exceeded: silent
  triggers:
  - entity_id: binary_sensor.master_bedroom_occupancy_combined
    to: 'on'
    for: 00:05:00
    trigger: state
  conditions:
  - condition: time
    after: '22:00:00'
    before: '23:30:00'
  - condition: state
    entity_id: light.nanoleaf_multicolor_ls
    state: 'off'
  - condition: state
    entity_id: light.nanoleaf_multicolor_ls_2
    state: 'off'
  actions:
  # skip_condition: false is REQUIRED, not decorative. automation.trigger
  # defaults to skip_condition: TRUE, i.e. it runs the target's actions while
  # SKIPPING the target's own conditions. proactive_nightly_lock_check is
  # guarded by `{{ unlocked != '' }}` -- its whole purpose is to stay silent on
  # a night when both doors are already locked. Under the default, this bedtime
  # detection bypassed that guard, so the Echo announced "These locks were
  # unlocked and have been automatically locked: ." with an empty list on every
  # night the house was already secure. Verified 2026-09-02: that empty-list
  # template is the automation's only condition.
  - action: automation.trigger
    data:
      skip_condition: false
    target:
      entity_id: automation.proactive_nightly_lock_check
- id: master_bedroom_supernova_auto_off
  alias: Master Bedroom — Fan light off after 30 min no presence
  description: Turn off the master bedroom fan light after 30 minutes with no combined mmWave/Ecobee presence.
  mode: restart
  triggers:
  - entity_id: binary_sensor.master_bedroom_occupancy_combined
    to: 'off'
    for: 00:30:00
    trigger: state
  conditions:
  - condition: state
    entity_id: switch.master_bedroom_fan_light_switch_1
    state: 'on'
  actions:
  - action: switch.turn_off
    target:
      entity_id: switch.master_bedroom_fan_light_switch_1
  - action: switch.turn_off
    target:
      entity_id: switch.sonoff_10001d2a24
  - action: light.turn_on
    data:
      brightness_pct: 10
    target:
      entity_id: light.elements_b3cd

- id: family_room_presence_auto_on
  alias: Family Room — Lights on when someone enters after sunset
  description: Turn on the family room ceiling light at 80% when mmWave detects presence and the sun is below horizon. Skipped
    if the TV is already playing (movie mode owns the lighting in that case).
  mode: restart
  triggers:
  - entity_id: binary_sensor.family_room_mmwave_presence
    to: 'on'
    trigger: state
  conditions:
  - condition: state
    entity_id: sun.sun
    state: below_horizon
  - condition: state
    entity_id: light.family_room_light
    state: 'off'
  - condition: not
    conditions:
    - condition: state
      entity_id: media_player.lg_webos_tv_un8500auj
      state: playing
  actions:
  - action: light.turn_on
    data:
      brightness_pct: 80
    target:
      entity_id: light.family_room_light
- id: family_room_tv_auto_pause_empty
  alias: Family Room — Pause TV when room empty 10 min
  description: Pause the LG TV if it is playing but no mmWave presence has been detected for 10 minutes. Prevents wasted streaming
    / screen burn-in.
  mode: single
  max_exceeded: silent
  triggers:
  - entity_id: binary_sensor.family_room_mmwave_presence
    to: 'off'
    for: 00:10:00
    trigger: state
  conditions:
  - condition: state
    entity_id: media_player.lg_webos_tv_un8500auj
    state: playing
  actions:
  - action: media_player.media_pause
    target:
      entity_id: media_player.lg_webos_tv_un8500auj
- id: master_bedroom_presence_light_auto_on
  alias: Master Bedroom — Fan light on when someone enters (evening)
  description: Turn on the master bedroom fan light when combined mmWave/Ecobee occupancy detects presence between sunset and 23:00, and the light is
    currently off.
  mode: restart
  triggers:
  - entity_id: binary_sensor.master_bedroom_occupancy_combined
    to: 'on'
    trigger: state
  conditions:
  - condition: state
    entity_id: sun.sun
    state: below_horizon
  - condition: time
    before: '23:00:00'
  - condition: state
    entity_id: switch.master_bedroom_fan_light_switch_1
    state: 'off'
  actions:
  - action: switch.turn_on
    target:
      entity_id: switch.master_bedroom_fan_light_switch_1
  - action: light.turn_on
    data:
      brightness_pct: 100
    target:
      entity_id: light.elements_b3cd

# -----------------------------------------------------------------------------
# Kitchen ambient lighting — graduated dimming on no presence (Enhancement Q)
#
# Single owner for all seven kitchen lights: the Tuya presence sensor
# (binary_sensor.kitchen_presence <- input_boolean.kitchen_tuya_presence,
# pushed by tuya_kitchen_bridge.py). The kitchen mmWave radar no longer drives
# these lights — that sensor was physically moved to the master bedroom.
#
#   no presence for 3 min  -> lights that are ON dim to 15% (stepped fade)
#   no presence for 5 min  -> those lights off      (3 min trigger + 2 min delay)
#   presence returns       -> back up, level depends on time of night
#
# Only lights that are currently ON are dimmed — the old version turned on
# ALL seven at 15%, which switched on the main light if it was off and
# re-triggered kitchen_light_sync (flicker feedback loop). Five of the seven
# lights ignore `transition`, so script.kitchen_lights_step_dim simulates the
# fade in brightness steps. Adaptive lighting is paused for the cabinet strips
# during the fade so it doesn't re-apply its own brightness mid-dim.
# -----------------------------------------------------------------------------
- id: kitchen_ambient_graduated_dimming
  alias: "Kitchen — Ambient graduated dimming on no presence"
  description: >-
    Dim the kitchen lights that are on to 15% after 3 min without Tuya
    presence, then turn them off at the 5 min mark.
  mode: restart
  triggers:
  - entity_id: binary_sensor.kitchen_presence
    to: "off"
    for: "00:03:00"
    trigger: state
  conditions:
  # Ambient mode is active if either the cabinet strips or the main light is on.
  - condition: or
    conditions:
    - condition: state
      entity_id: light.cabinet_light_strip_left_nanoleaf_light_strip
      state: "on"
    - condition: state
      entity_id: light.kitchen_light_light_1
      state: "on"
  actions:
  # Only touch lights that are actually on — the stepped fade uses
  # light.turn_on and would relight anything that is off.
  - variables:
      kitchen_on: >
        {{ ['light.cabinet_light_strip_left_nanoleaf_light_strip',
            'light.cabinet_light_strip_center_nanoleaf_light_strip',
            'light.cabinet_light_strip_right_nanoleaf_light_strip',
            'light.nanoleaf_multicolor_ls',
            'light.nanoleaf_multicolor_ls_2',
            'light.island_light_light',
            'light.kitchen_light_light_1']
           | select('is_state', 'on') | list }}
  # Pause adaptive lighting so it doesn't fight the fade.
  - action: adaptive_lighting.set_manual_control
    data:
      entity_id: switch.cabinet_strips_adaptive_lighting_cabinet_strips
      manual_control: true
    continue_on_error: true
  - action: script.kitchen_lights_step_dim
    data:
      lights: "{{ kitchen_on }}"
      levels: [60, 35, 15]
  # 3 min trigger + 2 min delay = off at the 5 min mark.
  - delay: "00:02:00"
  # Fixed 2026-08-18 (council fix FX12 / audit F11): this used to be a bare
  # `condition: kitchen_presence off` followed by the fade tail, so presence
  # returning mid-delay aborted BEFORE the adaptive-lighting manual-control
  # release — leaving the strips parked at 15% in AL manual control. Now the
  # interrupt path also hands the strips back.
  # Updated 2026-08-31: kitchen_ambient_restore_on_presence brings the levels
  # back up, and it now runs in daylight too (not only after sunset), so the
  # daytime gap this comment used to describe is closed.
  # `for` added 2026-08-31: a bare state check was satisfied by a presence
  # BOUNCE during the delay — sensor drops for a few seconds while someone is
  # standing there, and the lights go off moments after they walked back in.
  # Requiring a continuous 2 min of absence means only a real departure
  # reaches the off tail.
  - if:
    - condition: state
      entity_id: binary_sensor.kitchen_presence
      state: "off"
      for: "00:02:00"
    then:
    - action: script.kitchen_lights_step_dim
      data:
        lights: "{{ kitchen_on }}"
        levels: [10, 5]
    - action: light.turn_off
      target:
        entity_id: "{{ kitchen_on }}"
      continue_on_error: true
    # Fade finished — hand the strips back to adaptive lighting.
    - action: adaptive_lighting.set_manual_control
      data:
        entity_id: switch.cabinet_strips_adaptive_lighting_cabinet_strips
        manual_control: false
      continue_on_error: true
    else:
    - action: adaptive_lighting.set_manual_control
      data:
        entity_id: switch.cabinet_strips_adaptive_lighting_cabinet_strips
        manual_control: false
      continue_on_error: true

- id: kitchen_ambient_restore_on_presence
  alias: "Kitchen — Ambient lights up on presence"
  description: >-
    Bring the kitchen lights up when Tuya presence returns. Daylight: the five
    strips always come up, and the main + island lights join them only on a
    dark day (binary_sensor.kitchen_dark_day). Between 21:00 and sunrise: only
    the strips, at 50% -- this is now purely time-based, so you get the dim
    kitchen after 21:00 whether or not the bedtime routine has run (the
    bedtime_shutdown_done coupling was removed 2026-09-03, see the branch
    comment). Rest of the evening: every kitchen light at 100%. Does nothing if
    sun.sun is unknown, or while the kitchen auto lights disable toggle is on.
  mode: single
  triggers:
  - entity_id: binary_sensor.kitchen_presence
    to: "on"
    trigger: state
  conditions:
  # Kill switch. Previously declared in configuration.yaml and referenced by
  # nothing at all; wired up here because a daytime path makes this automation
  # far more visible. Deliberately gates turn-ON only — graduated dimming and
  # kitchen_light_sync are outside it, since a kill switch should not also stop
  # lights turning off.
  - condition: state
    entity_id: input_boolean.kitchen_auto_lights_disable
    state: "off"
  # Require a real sun.sun reading. Without this the choose below still matches
  # no branch when sun.sun is unknown/unavailable — but the two actions BEFORE
  # the choose would already have run, cancelling an in-flight dim and handing
  # the strips back to adaptive lighting without ever bringing them up. That
  # leaves the lights stranded mid-fade. The old top-level `below_horizon`
  # condition made the whole automation a no-op in that case; this preserves
  # that property while still allowing the daylight branch.
  - condition: state
    entity_id: sun.sun
    state:
    - above_horizon
    - below_horizon
  actions:
  # Cancel any in-flight fade before restoring. script.kitchen_lights_step_dim
  # is mode: parallel, so without this a dim ladder already walking 60/35/15
  # keeps stepping DOWN over the levels we are about to set — lights come up,
  # then sink again, which reads as "the automation didn't fire".
  - action: script.turn_off
    target:
      entity_id: script.kitchen_lights_step_dim
  # Presence may have interrupted a dim sequence — hand the strips back to
  # adaptive lighting before bringing the lights up.
  - action: adaptive_lighting.set_manual_control
    data:
      entity_id: switch.cabinet_strips_adaptive_lighting_cabinet_strips
      manual_control: false
    continue_on_error: true
  # Every branch below is gated on an explicit sun.sun state and there is NO
  # bare `default:`. That is load-bearing: this automation used to carry a
  # top-level `sun.sun below_horizon` condition, which quietly made an unknown
  # or unavailable sun a no-op. Removing it to add daylight support would have
  # left a bare default that turns all seven lights to 100% during any sun
  # integration hiccup.
  - choose:
    # ── Daylight ─────────────────────────────────────────────────────────
    # MUST be first. The overnight branch's 21:00-09:00 window overlaps summer
    # daylight, and it was the (now removed) sun condition — not the 09:00
    # bound — that actually ended that window at sunrise.
    - conditions:
      - condition: state
        entity_id: sun.sun
        state: above_horizon
      sequence:
      # Strips always, dark day or not.
      - action: light.turn_on
        data:
          brightness_pct: 100
          transition: 3
        target:
          entity_id:
          - light.cabinet_light_strip_left_nanoleaf_light_strip
          - light.cabinet_light_strip_center_nanoleaf_light_strip
          - light.cabinet_light_strip_right_nanoleaf_light_strip
          - light.nanoleaf_multicolor_ls
          - light.nanoleaf_multicolor_ls_2
        continue_on_error: true
      # Main + island only on a dark day, and in their OWN call so that an
      # unavailable main light cannot abort the strips above. This is not
      # hypothetical: light.kitchen_light_light_1 was unavailable for a
      # continuous 17.9 h on 2026-08-30.
      - if:
        - condition: state
          entity_id: binary_sensor.kitchen_dark_day
          state: "on"
        then:
        - action: light.turn_on
          data:
            brightness_pct: 100
            transition: 3
          target:
            entity_id:
            - light.island_light_light
            - light.kitchen_light_light_1
          continue_on_error: true
        else:
        # Bright day: still do NOT turn these on from off -- that is exactly
        # what the kitchen_dark_day gate is for, and it stays. But DO undo a dim
        # that WE just applied, which is what this else-branch is for.
        #
        # The bug this fixes was a one-way ratchet. The two graduated-dim paths
        # (kitchen_ambient_graduated_dimming above, and the main-light-off path
        # in 02_kitchen_light_sync.yaml) carry NO kitchen_dark_day condition --
        # they dim whatever is on, bright day or not. Only the restore was
        # gated. So on a bright day the island could be walked down to 15/10/5%
        # and then simply left there, because the branch that brings it back
        # refused to run.
        #
        # Traced end to end in the recorder for 2026-09-02:
        #   17:30:14  presence had been off 3 min -> step_dim [60,35,15]
        #   17:32:38  step_dim [10,5] begins, island driven to 10%
        #   17:32:39  presence returns -> this automation fires, cancels the
        #             script, restores the strips to 100%, and skips the island
        #             because binary_sensor.kitchen_dark_day was off (it was off
        #             from 12:33:13 to 17:35:40 that day)
        #   17:47:33  next dim ramp -- the first thing to touch the island again
        # The island sat at 10% for ~15 minutes in the middle of the afternoon
        # with someone standing in the kitchen. That is the reported symptom.
        #
        # Guarded on `is_state('on')` so this can only ever RAISE a light the
        # fade left on; a light that is off stays off. Note this does mean a
        # deliberate manual dim on a bright day is pushed back to 100% when you
        # re-enter -- but the dim ramp does not preserve a manual level either,
        # and the dark-day branch above has always behaved this way, so this
        # makes the bright-day path consistent rather than introducing a new
        # behaviour.
        - variables:
            dimmed_but_still_on: >
              {{ ['light.island_light_light', 'light.kitchen_light_light_1']
                 | select('is_state', 'on') | list }}
        - if:
          - condition: template
            value_template: "{{ dimmed_but_still_on | count > 0 }}"
          then:
          - action: light.turn_on
            data:
              brightness_pct: 100
              transition: 3
            target:
              entity_id: "{{ dimmed_but_still_on }}"
            continue_on_error: true
    # ── 21:00 to sunrise: dim, cabinet + Nanoleaf strips only ──
    # Bounded by sun.sun below_horizon (the daylight branch above owns the day)
    # plus an explicit 21:00-09:00 window. A winter sunset ~16:45 is therefore
    # still "evening", not "overnight", which is what the time bound is for.
    #
    # This branch used to ALSO require input_boolean.bedtime_shutdown_done to be
    # on. Removed 2026-09-03: that coupling deadlocks. The latch is only set by
    # bedtime_routine_auto (01_main.yaml), whose settled-house fallback requires
    # light.island_light_light to be OFF for 30 min. When the latch is off this
    # branch cannot match, the choose falls through to the "rest of the evening"
    # branch below, and THAT branch turns the island light on at 100% on every
    # presence blip -- which then blocks the fallback that would have set the
    # latch. Traced on the night of 2026-09-02/03: the latch had been off since
    # 09-01 20:00, the Tuya presence sensor flapped 36 times between 18:00 and
    # 03:00, and the island light was re-lit at 100% nine times between 00:23
    # and 01:49 before someone switched it off by hand at 02:05.
    #
    # Time-only is also the honest expression of the intent: "after 21:00 the
    # kitchen comes up dim". Whether the bedtime routine has run yet is a fact
    # about the door locks, not about how bright the kitchen should be.
    - conditions:
      - condition: state
        entity_id: sun.sun
        state: below_horizon
      - condition: time
        after: "21:00:00"
        before: "09:00:00"
      sequence:
      - action: light.turn_on
        data:
          brightness_pct: 50
          transition: 3
        target:
          entity_id:
          - light.cabinet_light_strip_left_nanoleaf_light_strip
          - light.cabinet_light_strip_center_nanoleaf_light_strip
          - light.cabinet_light_strip_right_nanoleaf_light_strip
          - light.nanoleaf_multicolor_ls
          - light.nanoleaf_multicolor_ls_2
        continue_on_error: true
    # ── Rest of the evening: everything to 100% ──────────────────────────
    - conditions:
      - condition: state
        entity_id: sun.sun
        state: below_horizon
      sequence:
      - action: light.turn_on
        data:
          brightness_pct: 100
          transition: 3
        target:
          entity_id:
          - light.cabinet_light_strip_left_nanoleaf_light_strip
          - light.cabinet_light_strip_center_nanoleaf_light_strip
          - light.cabinet_light_strip_right_nanoleaf_light_strip
          - light.nanoleaf_multicolor_ls
          - light.nanoleaf_multicolor_ls_2
        continue_on_error: true
      - action: light.turn_on
        data:
          brightness_pct: 100
          transition: 3
        target:
          entity_id:
          - light.island_light_light
          - light.kitchen_light_light_1
        continue_on_error: true
