# ⚠️  SECURITY WARNING: This binds Ollama to ALL network interfaces (0.0.0.0).
# Anyone on the LAN (192.168.0.0/24) can query models, pull new models, or
# delete existing ones.  Consider one of these alternatives:
#
#   (a) Bind to a specific LAN IP only:
#       Environment="OLLAMA_HOST=192.168.0.102:11434"
#   (b) Keep localhost-only and use an SSH tunnel for remote access:
#       # No override needed — default is 127.0.0.1:11434
#       ssh -L 11434:localhost:11434 pi-lan
#   (c) Add an iptables rule to restrict LAN access to trusted hosts:
#       iptables -A INPUT -p tcp --dport 11434 -s 192.168.0.0/24 -j ACCEPT
#       iptables -A INPUT -p tcp --dport 11434 -j DROP
#
# Current setting (open to entire LAN):
[Service]
Environment="OLLAMA_HOST=0.0.0.0:11434"
