- id: outdoor_decoration_smartplug_daily_schedule
  alias: Outdoor Decoration SmartPlug Daily Schedule
  description: >-
    Daily America/Toronto schedule: off at 02:00, on at 16:00.
    Wait at most five minutes from the time trigger for availability,
    attempt once, and allow 30 seconds for HA-reported state confirmation.
    No startup/reload catch-up or command retries.
  triggers:
    - trigger: time
      at: '02:00:00'
      id: scheduled_off
    - trigger: time
      at: '16:00:00'
      id: scheduled_on
  conditions:
    - condition: template
      value_template: >-
        {{ trigger is defined and trigger.platform == 'time'
           and trigger.id in ['scheduled_off', 'scheduled_on'] }}
  actions:
    - variables:
        desired_state: "{{ 'off' if trigger.id == 'scheduled_off' else 'on' }}"
        deadline_ts: "{{ as_timestamp(trigger.now) + 300 }}"
    - wait_template: >-
        {{ states('switch.outdoor_decoration_smartplug_socket_1') in ['on', 'off'] }}
      timeout:
        seconds: "{{ [deadline_ts | float - as_timestamp(now()), 0] | max }}"
      continue_on_timeout: true
    - choose:
        - conditions:
            - condition: template
              value_template: >-
                {{ wait.completed
                   and as_timestamp(now()) < deadline_ts | float
                   and states('switch.outdoor_decoration_smartplug_socket_1') in ['on', 'off'] }}
          sequence:
            - action: "{{ 'switch.turn_off' if desired_state == 'off' else 'switch.turn_on' }}"
              target:
                entity_id: switch.outdoor_decoration_smartplug_socket_1
              continue_on_error: true
            - wait_template: >-
                {{ states('switch.outdoor_decoration_smartplug_socket_1') == desired_state }}
              timeout: '00:00:30'
              continue_on_timeout: true
            - if:
                - condition: template
                  value_template: "{{ not wait.completed }}"
              then:
                - action: system_log.write
                  data:
                    level: warning
                    logger: outdoor_decoration_schedule
                    message: >-
                      Outdoor decoration scheduled {{ desired_state }} was attempted once;
                      HA did not confirm the requested state within 30 seconds.
      default:
        - action: system_log.write
          data:
            level: warning
            logger: outdoor_decoration_schedule
            message: >-
              Outdoor decoration scheduled {{ desired_state }} was not sent:
              the plug was not ready within the five-minute recovery window.
  mode: single
  trace:
    stored_traces: 10
