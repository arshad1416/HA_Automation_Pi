# Adaptive Lighting — colour curve for the hallway Nanoleaf Light Panels (NL22).
#
# The other three AL instances (Whole House, Cabinet Strips, Cabinet Kick Plate) were
# created in the UI, so they live only in .storage/core.config_entries — which is
# gitignored and therefore NOT in the disaster-recovery backup. This one is YAML so a
# rebuild reproduces it. AL imports YAML at startup only, so changes here need a full
# HA restart, not a reload.
#
# Why a dedicated instance: hallway_panels_stairs_pir was borrowing the Whole House
# curve, whose warmest setting is 2500 K because it is tuned for outdoor downlights and
# lampposts. These NL22 panels report a 1200-6500 K range, so on the Whole House curve
# they could never go warmer than 2500 K on a 2 a.m. landing. 1800 K here is roughly
# candlelight — well inside what the hardware supports, without the deep amber cast of
# its 1200 K floor.
#
# AL is the direct owner of brightness and colour for the panels (owner instruction
# 2026-08-10: "Have AL manage the colour temperature and the brightness level based
# on time of day ... at night, as it gets close to bed time, gradually reduce the
# brightness to 10% by bed time").
#
# brightness_mode: LINEAR ramps around sunset/sunrise (verified against AL 1.30.1's
# _brightness_pct_linear): brightness is max at sunset - brightness_mode_time_light,
# then falls linearly to min_brightness at sunset + brightness_mode_time_dark.
#   time_light 3600 (1h)   -> panels hold 100% until 1h before sunset
#   time_dark  9000 (2.5h) -> the ramp completes 2.5h after sunset
# In August (sunset ~20:30) that lands the 10% floor at ~23:00, the seasonal dim hour
# this house uses as its bedtime anchor. Winter sunsets are earlier, so the floor
# lands earlier there (the ramp duration is fixed — AL int-validates these options,
# no templates). The automation's resting preset and the after-bedtime window keep
# anything after the floor at 10%.
#
# min_brightness must stay a plain integer: AL validates it with int_between(1, 100),
# so a Jinja template here fails config validation and would break the whole platform.
# Keep it in sync with input_number.nightly_dim_brightness (both 10).
#
# The historical bug that drove the old colour-only design was AL 1.30.1's
# adaptive_lighting.apply overriding brightness despite adapt_brightness: false. AL's
# *periodic* adaptation of directly-listed lights honours adapt_brightness, so that bug
# does not apply here; the panels are listed and both adapt switches stay on. The
# automation no longer sets colour or brightness at all — it only turns the panels on
# and off (motion → on, 5 minutes after the last pulse → resting state), so there is no
# HA call left that could race AL's adaptation.
#
# If the panels are ever seen fighting AL (jumping to full brightness), the panel is in
# AL's manual_control list: clear it with adaptive_lighting.set_manual_control
# manual_control: false, exactly like the cabinet strips do at sunrise.
adaptive_lighting:
  - name: Hallway Panels
    lights:
      - light.hallway_nanoleaf_light_panels_left
      - light.hallway_nanoleaf_hallway_lights_right
    min_color_temp: 1800
    max_color_temp: 6500
    # NOTE: adapt_brightness is NOT a YAML option — it exists only as a parameter to the
    # adaptive_lighting.apply service and as the runtime switch
    # switch.adaptive_lighting_hallway_panels_adaptive_lighting_adapt_brightness_hallway_panels
    # (which defaults ON, so brightness IS adapted without declaring anything here).
    # Putting it here fails schema validation, and because one bad key aborts setup for the
    # WHOLE integration it took Whole House, Cabinet Strips and Cabinet Kick Plate down with
    # it — every AL switch read 'unavailable' and nothing was adapted. Verified against
    # VALIDATION_TUPLES in custom_components/adaptive_lighting/const.py:323 (v1.30.1).
    brightness_mode: linear
    brightness_mode_time_light: 3600
    brightness_mode_time_dark: 9000
    min_brightness: 5

# Limit history to 7 days to keep DB manageable
recorder:
  purge_keep_days: 7
  auto_purge: true

logger:
  default: warning
  logs:
    homeassistant.components.emulated_hue: error
    # VinFast integration — reduced logging (debug → warning)
    custom_components.vinfast: warning
    custom_components.vinfast.api_auth: warning
    custom_components.vinfast.config_flow: warning
# Rest API commands for Climate AI - Direct API calls bypassing conversation agent
rest_command:
  climate_ai_gemini:
    url: "http://127.0.0.1:20128/v1/chat/completions"
    method: POST
    headers:
      Authorization: "Bearer omniroute-local"
      Content-Type: "application/json"
    payload: >-
      {
        "model": "ag/gemini-3.7-flash-medium",
        "messages": [{"role": "user", "content": {{ prompt | tojson }}}],
        "max_tokens": 4000,
        "reasoning_effort": "medium",
        "temperature": 0,
        "stream": false
      }
    content_type: "application/json"
    timeout: 60

# ── Wyze Garage Cam (Garage Cam v3) ──────────────────────────────────
camera:
  - platform: ffmpeg
    name: Garage Cam
    input: rtsp://127.0.0.1:8554/garage

command_line:
  - sensor:
      name: Solar Power Now
      unique_id: solar_power_now
      command: >-
        /usr/local/bin/python3 -c 'import json;
        d=json.load(open("/config/apsystems.json"));
        print(int(d.get("power_approx_w",0)))'
      unit_of_measurement: W
      scan_interval: 300
  - sensor:
      name: Solar Energy Today
      unique_id: solar_energy_today
      command: >-
        /usr/local/bin/python3 -c 'import json;
        d=json.load(open("/config/apsystems.json"));
        print(d.get("today_kwh",0))'
      unit_of_measurement: kWh
      scan_interval: 300
  - sensor:
      name: Solar Energy Month
      unique_id: solar_energy_month
      command: >-
        /usr/local/bin/python3 -c 'import json;
        d=json.load(open("/config/apsystems.json"));
        print(d.get("month_kwh",0))'
      unit_of_measurement: kWh
      scan_interval: 300


  # ── Grizzl-E Smart EV charger (reads daemon JSON; single /logs client) ──
  - sensor:
      name: "Grizzl-E Power"
      unique_id: grizzl_e_power
      command: "cat /config/grizzl_e_state.json"
      unit_of_measurement: "W"
      device_class: power
      state_class: measurement
      scan_interval: 15
      value_template: "{{ value_json.power_w | round(1) }}"
      json_attributes:
        - charging
        - rssi_dbm
        - updated
  - binary_sensor:
      name: "Grizzl-E Charging"
      unique_id: grizzl_e_charging
      command: "cat /config/grizzl_e_state.json"
      device_class: battery_charging
      scan_interval: 15
      payload_on: "on"
      payload_off: "off"
      value_template: "{{ value_json.charging }}"
  - sensor:
      name: "Grizzl-E Diagnostics"
      unique_id: grizzl_e_diagnostics
      command: "cat /config/grizzl_e_state.json"
      scan_interval: 60
      unit_of_measurement: "bytes"
      value_template: "{{ value_json.free_heap }}"
      json_attributes:
        - disk_free_kb
        - rssi_dbm
        - power_w
        - updated

  - sensor:
      name: "Grizzl-E Total Energy"
      unique_id: grizzl_e_total_energy
      command: "cat /config/grizzl_e_state.json"
      unit_of_measurement: "kWh"
      device_class: energy
      state_class: total_increasing
      scan_interval: 15
      value_template: "{{ value_json.total_energy_kwh | round(4) }}"
  - sensor:
      name: "Grizzl-E Total Cost"
      unique_id: grizzl_e_total_cost
      command: "cat /config/grizzl_e_state.json"
      unit_of_measurement: "$"
      device_class: monetary
      # `total`, not `total_increasing`: HA rejects total_increasing on a monetary
      # device class and logged a warning on every start (audit A18). `total` is
      # correct here anyway — the daemon can revise cumulative cost downward when
      # grizzl_e_history.json is re-rolled, which total_increasing would read as a
      # meter reset.
      state_class: total
      scan_interval: 15
      value_template: "{{ (value_json.total_cost_cents / 100) | round(4) }}"
      json_attributes:
        - total_cost_cents
        - session_energy_kwh
        - session_cost_cents
        - period_label
        - rate_cents_kwh
        - fixed_monthly_cad

template:
  - binary_sensor:
      - name: Kitchen Presence
        unique_id: kitchen_presence_combined
        device_class: occupancy
        state: >
          {{ is_state('input_boolean.kitchen_tuya_presence', 'on') }}
      # One authoritative master-bedroom occupancy signal. ON when either the
      # LD2420 mmWave sensor or the Ecobee SmartSensor (serial 332D) detects
      # occupancy; unavailable only when both source entities are unavailable.
      - name: Master Bedroom Occupancy Combined
        unique_id: master_bedroom_occupancy_combined
        device_class: occupancy
        availability: >
          {{ states('binary_sensor.master_bedroom_mmwave_presence') not in ['unknown', 'unavailable']
             or states('binary_sensor.332d_occupancy') not in ['unknown', 'unavailable'] }}
        state: >
          {{ is_state('binary_sensor.master_bedroom_mmwave_presence', 'on')
             or is_state('binary_sensor.332d_occupancy', 'on') }}
        attributes:
          mmwave: "{{ states('binary_sensor.master_bedroom_mmwave_presence') }}"
          ecobee_332d: "{{ states('binary_sensor.332d_occupancy') }}"
      # Single stand-down point for the stair light: motion on the Upstairs Stair Sensor
      # lights light.stair_light only while this is OFF. After bedtime the stair light
      # stands down and the hallway Nanoleaf panels take that window — but the panels ALSO
      # run before bedtime (after sunset, and on a dark day), so the two deliberately
      # overlap outside the after-bedtime window. See hallway_panels_stairs_pir.
      #
      # It exists as one sensor rather than duplicated conditions so the stand-down point
      # is defined in exactly one place: drift would leave a dark staircase at night.
      #
      # Three clauses, each load-bearing:
      #   bedtime_shutdown_done : the actual "we have gone to bed" latch, set by
      #                           bedtime_routine_auto on real sleep detection.
      #   hour >= 20 or < 12    : that latch is only RESET at 20:00, so between sunset and
      #                           20:00 it still reads last night's ON. This pins it to the
      #                           current night.
      #   sun below_horizon     : keeps ON implying dark, so a stale-ON latch on a dark
      #                           stormy 09:00 cannot put the stair light into stand-down
      #                           while daylight is still poor. It is also what lets the
      #                           panels test after_bedtime BEFORE the plain sunset case —
      #                           do not remove this clause.
      - name: After Bedtime
        unique_id: after_bedtime
        icon: mdi:sleep
        state: >-
          {{ is_state('input_boolean.bedtime_shutdown_done', 'on')
             and (now().hour >= 20 or now().hour < 12)
             and is_state('sun.sun', 'below_horizon') }}
        attributes:
          latch: "{{ states('input_boolean.bedtime_shutdown_done') }}"
          in_night_window: "{{ now().hour >= 20 or now().hour < 12 }}"
          sun: "{{ states('sun.sun') }}"
