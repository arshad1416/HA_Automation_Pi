# 2026-07-10: these were top-level keys, which HA silently ignores ("Integration
# 'external_url' not found") — nested under homeassistant: so they actually apply.
homeassistant:
  external_url: "https://ha.arshadkazi.ca"
  internal_url: "http://192.168.0.102:8123"

default_config:

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

automation: !include_dir_merge_list automations/
script: !include scripts.yaml
scene: !include scenes.yaml

# Manual override toggle for kitchen auto lights
# Set by manual-off trigger in downstairs_cabinet_occupancy_auto
# Cleared by unoccupied event immediately, or by 15-minute cooldown
input_number:
  nightly_dim_brightness:
    name: Nightly Dim Brightness
    icon: mdi:brightness-6
    min: 1
    max: 100
    step: 5
    unit_of_measurement: '%'
    initial: 10
  airbnb_heater_temperature:
    name: Airbnb Heater Temperature
    icon: mdi:thermometer
    min: 10
    max: 30
    step: 1
    unit_of_measurement: °C
    initial: 20
  vent_fan_heat_threshold:
    name: Vent Fan Heat Threshold
    icon: mdi:thermometer-low
    min: 15
    max: 25
    step: 1
    unit_of_measurement: °C
    initial: 21
  vent_fan_cool_threshold:
    name: Vent Fan Cool Threshold
    icon: mdi:thermometer-high
    min: 20
    max: 30
    step: 1
    unit_of_measurement: °C
    initial: 23
  stairs_late_night_brightness:
    name: Stairs Late Night Brightness
    icon: mdi:stairs
    min: 1
    max: 100
    step: 5
    unit_of_measurement: '%'
    initial: 10
  stairs_day_brightness:
    name: Stairs Day Brightness
    icon: mdi:stairs
    min: 1
    max: 100
    step: 5
    unit_of_measurement: '%'
    initial: 100
  # "Dark out" threshold for stairs_pir_motion_light, in estimated outdoor lux from
  # the ha-illuminance custom integration (sensor.illuminance). Below this the stair
  # light comes on when the PIR sees motion. ~1000 lx ≈ heavy overcast; full summer
  # daylight reads ~74000 lx. Tune here rather than editing the automation.
  stairs_dark_lux:
    name: Stairs Dark Threshold (lux)
    icon: mdi:brightness-6
    min: 100
    max: 20000
    step: 100
    unit_of_measurement: lx
    initial: 1000

