# ESPHome Kitchen mmWave Bridge — workaround for HA 2026.6.3 + Python 3.14 ESPHome integration bug
  - sensor:
      - name: "Grizzl-E Est. Monthly Bill"
        unique_id: grizzl_e_est_monthly_bill
        unit_of_measurement: "$"
        device_class: monetary
        state: >
          {{ (state_attr('sensor.grizzl_e_total_cost', 'fixed_monthly_cad') | default(33.57, true)
              + (states('sensor.grizzl_e_cost_monthly') | float(0))) | round(2) }}
  # ── Priority 5: Energy dashboard sensors (Enhancement spec) ────────────
  # Unified daily energy cost estimate (EV + house @ blended 15¢/kWh).
  - sensor:
      - name: "Home Daily Energy Cost Estimate"
        unique_id: home_daily_energy_cost
        unit_of_measurement: "$"
        device_class: monetary
        state: >
          {{ (states('sensor.grizzl_e_cost_daily') | float(0) +
              (states('sensor.grizzl_e_energy_daily') | float(0) * 0.15)) | round(2) }}
        attributes:
          ev_cost: "{{ states('sensor.grizzl_e_cost_daily') | default('unavailable', true) }}"
          pool_pump_state: "{{ states('switch.pool_pump_heater_socket_1') | default('unavailable', true) }}"
  # Monthly EV charging cost rollup.
  - sensor:
      - name: "Monthly EV Charging Cost"
        unique_id: monthly_ev_charging_cost
        unit_of_measurement: "$"
        device_class: monetary
        state: "{{ states('sensor.grizzl_e_cost_monthly') | float(0) | round(2) }}"
  # Last/current charging session cost (from daemon session_cost_cents attribute).
  - sensor:
      - name: "Grizzl-E Session Cost"
        unique_id: grizzl_e_session_cost
        unit_of_measurement: "$"
        device_class: monetary
        state: >
          {{ (state_attr('sensor.grizzl_e_total_cost', 'session_cost_cents') | default(0, true) | float(0) / 100) | round(2) }}
  # Charging efficiency: kWh delivered at the wall per 1 percentage point of SoC GAIN.
  #
  # The previous version divided session kWh by ABSOLUTE SoC (soc * 0.01 * 77.4), i.e.
  # by the energy already sitting in the pack, so the same 20 kWh session read 1.292 at
  # 20% SoC, 0.517 at 50% and 0.323 at 80% — never the 0.74-0.80 band it claimed. It was
  # also hardcoded to the Ioniq, so it reported Ioniq figures during VF9 sessions.
  #
  # Now keyed on SoC gain for whichever vehicle sensor.ev_charging_vehicle_detected
  # identifies. Expected healthy values: Ioniq 6 ≈0.774 kWh/% (77.4 kWh pack),
  # VF9 ≈1.23 kWh/% (123 kWh pack); real readings run slightly higher because the
  # meter measures at the wall and charging is ~90% efficient.
  - sensor:
      - name: "EV Charging Efficiency"
        unique_id: ev_charging_efficiency
        unit_of_measurement: "kWh/%"
        availability: >
          {% set v = states('sensor.ev_charging_vehicle_detected') %}
          {% set gain = state_attr('sensor.ev_charging_vehicle_detected',
                                   'ioniq_soc_gain' if v == 'ioniq_6' else 'vf9_soc_gain')
                        | default(0, true) | float(0) %}
          {{ (state_attr('sensor.grizzl_e_total_cost', 'session_energy_kwh') | default(0, true) | float(0)) > 1
             and v in ['ioniq_6', 'vf9'] and gain > 0.5 }}
        state: >
          {% set v = states('sensor.ev_charging_vehicle_detected') %}
          {% set session_kwh = state_attr('sensor.grizzl_e_total_cost', 'session_energy_kwh') | default(0, true) | float(0) %}
          {% set gain = state_attr('sensor.ev_charging_vehicle_detected',
                                   'ioniq_soc_gain' if v == 'ioniq_6' else 'vf9_soc_gain')
                        | default(0, true) | float(0) %}
          {{ (session_kwh / gain) | round(3) }}
        attributes:
          vehicle: "{{ states('sensor.ev_charging_vehicle_detected') }}"
          nominal_pack_kwh: >
            {{ 77.4 if states('sensor.ev_charging_vehicle_detected') == 'ioniq_6' else 123.0 }}
          expected_range: >
            {{ "0.77-0.90 kWh/% when healthy (Ioniq 6, 77.4 kWh pack, wall-side)"
               if states('sensor.ev_charging_vehicle_detected') == 'ioniq_6'
               else "1.23-1.40 kWh/% when healthy (VF9, 123 kWh pack, wall-side)" }}

      # === Per-Vehicle EV Charging Cost Tracking ===
      - name: "EV Charging Vehicle Detected"
        unique_id: ev_charging_vehicle_detected
        state: >
          {% set ioniq_soc = states('sensor.ioniq_6_ev_battery_level') | default(0, true) | float(0) %}
          {% set vf9_soc = states('sensor.vf9_rllv2cja5rh000847_phan_tram_pin') | default(0, true) | float(0) %}
          {% set ioniq_start = states('input_number.ev_session_soc_start_ioniq') | default(0, true) | float(0) %}
          {% set vf9_start = states('input_number.ev_session_soc_start_vf9') | default(0, true) | float(0) %}
          {% set ioniq_gain = ioniq_soc - ioniq_start %}
          {% set vf9_gain = vf9_soc - vf9_start %}
          {% set session_kwh = state_attr('sensor.grizzl_e_total_cost', 'session_energy_kwh') | default(0, true) | float(0) %}
          {% if ioniq_gain > 1 and vf9_gain <= 1 %}
            ioniq_6
          {% elif vf9_gain > 1 and ioniq_gain <= 1 %}
            vf9
          {% elif ioniq_gain > 1 and vf9_gain > 1 %}
            {% set ioniq_eff = (session_kwh / ioniq_gain) if ioniq_gain > 0 else 999 %}
            {% set vf9_eff = (session_kwh / vf9_gain) if vf9_gain > 0 else 999 %}
            {% if (ioniq_eff - 0.774) | abs < (vf9_eff - 1.23) | abs %}
              ioniq_6
            {% else %}
              vf9
            {% endif %}
          {% else %}
            unknown
          {% endif %}
        attributes:
          ioniq_soc_gain: "{{ (states('sensor.ioniq_6_ev_battery_level') | default(0, true) | float(0)) - (states('input_number.ev_session_soc_start_ioniq') | default(0, true) | float(0)) }}"
          vf9_soc_gain: "{{ (states('sensor.vf9_rllv2cja5rh000847_phan_tram_pin') | default(0, true) | float(0)) - (states('input_number.ev_session_soc_start_vf9') | default(0, true) | float(0)) }}"
          session_kwh: "{{ state_attr('sensor.grizzl_e_total_cost', 'session_energy_kwh') | default(0, true) | float(0) }}"
          ioniq_efficiency: >
            {% set gain = (states('sensor.ioniq_6_ev_battery_level') | default(0, true) | float(0)) - (states('input_number.ev_session_soc_start_ioniq') | default(0, true) | float(0)) %}
            {% set kwh = state_attr('sensor.grizzl_e_total_cost', 'session_energy_kwh') | default(0, true) | float(0) %}
            {{ (kwh / gain) | round(3) if gain > 0.1 else 'unavailable' }}
          vf9_efficiency: >
            {% set gain = (states('sensor.vf9_rllv2cja5rh000847_phan_tram_pin') | default(0, true) | float(0)) - (states('input_number.ev_session_soc_start_vf9') | default(0, true) | float(0)) %}
            {% set kwh = state_attr('sensor.grizzl_e_total_cost', 'session_energy_kwh') | default(0, true) | float(0) %}
            {{ (kwh / gain) | round(3) if gain > 0.1 else 'unavailable' }}

      - name: "EV Ioniq 6 Total Cost"
        unique_id: ev_ioniq_6_total_cost
        unit_of_measurement: "CAD"
        state_class: total_increasing
        state: "{{ (states('input_number.ioniq_6_total_cost_cents') | default(0, true) | float(0)) / 100 }}"

      - name: "EV VF9 Total Cost"
        unique_id: ev_vf9_total_cost
        unit_of_measurement: "CAD"
        state_class: total_increasing
        state: "{{ (states('input_number.vf9_total_cost_cents') | default(0, true) | float(0)) / 100 }}"

      - name: "EV Ioniq 6 Total Energy"
        unique_id: ev_ioniq_6_total_energy
        unit_of_measurement: "kWh"
        state_class: total_increasing
        state: "{{ states('input_number.ioniq_6_total_energy_kwh') | default(0, true) | float(0) }}"

      - name: "EV VF9 Total Energy"
        unique_id: ev_vf9_total_energy
        unit_of_measurement: "kWh"
        state_class: total_increasing
        state: "{{ states('input_number.vf9_total_energy_kwh') | default(0, true) | float(0) }}"

      - name: "EV Fixed Cost Total"
        unique_id: ev_fixed_cost_total
        unit_of_measurement: "CAD"
        state_class: total_increasing
        state: "{{ (states('input_number.ev_fixed_cost_accumulated_cents') | default(0, true) | float(0)) / 100 }}"

      - name: "EV Unknown Cost Total"
        unique_id: ev_unknown_cost_total
        unit_of_measurement: "CAD"
        state_class: total_increasing
        state: "{{ (states('input_number.ev_unknown_cost_cents') | default(0, true) | float(0)) / 100 }}"

shell_command:
  # [t] bracket trick: the pattern must not match this shell_command's own
  # process, or the kill loop terminates itself (return code -15) before
  # nohup ever runs — which left the bridge dead after every HA restart.
  start_tuya_kitchen_bridge: "for pid in $(pgrep -f '[t]uya_kitchen_bridge.py'); do kill $pid 2>/dev/null; done; nohup python3 /config/tuya_kitchen_bridge.py > /config/tuya_bridge.log 2>&1 &"


