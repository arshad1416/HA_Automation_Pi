    unique_id: grizzl_e_energy_daily
    cycle: daily
  grizzl_energy_weekly:
    source: sensor.grizzl_e_total_energy
    name: "Grizzl-E Energy Weekly"
    unique_id: grizzl_e_energy_weekly
    cycle: weekly
  grizzl_energy_monthly:
    source: sensor.grizzl_e_total_energy
    name: "Grizzl-E Energy Monthly"
    unique_id: grizzl_e_energy_monthly
    cycle: monthly
  grizzl_energy_yearly:
    source: sensor.grizzl_e_total_energy
    name: "Grizzl-E Energy Yearly"
    unique_id: grizzl_e_energy_yearly
    cycle: yearly
  grizzl_cost_daily:
    source: sensor.grizzl_e_total_cost
