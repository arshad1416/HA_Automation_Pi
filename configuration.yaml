  # === Per-Vehicle EV Charging Cost Tracking ===
  # NOTE: none of these declare `initial:` on purpose. A configured initial value
  # short-circuits input_number's async_added_to_hass before async_get_last_state(),
  # so RestoreState never runs and every accumulator below would reset to 0 on each
  # HA restart. (counter.season_switch_summer further down uses the other valid
  # pattern: `initial:` together with `restore: true`.)
  ioniq_6_total_cost_cents:
    name: "Ioniq 6 Total Charging Cost"
    min: 0
    max: 1000000
    step: 1
    unit_of_measurement: "¢"

  vf9_total_cost_cents:
    name: "VF9 Total Charging Cost"
    min: 0
    max: 1000000
    step: 1
    unit_of_measurement: "¢"

  ioniq_6_total_energy_kwh:
    name: "Ioniq 6 Total Charging Energy"
    min: 0
    max: 100000
    step: 0.01
    unit_of_measurement: "kWh"

  vf9_total_energy_kwh:
    name: "VF9 Total Charging Energy"
    min: 0
    max: 100000
    step: 0.01
    unit_of_measurement: "kWh"

  ev_session_soc_start_ioniq:
    name: "EV Session SoC Start (Ioniq 6)"
    min: 0
    max: 100
    step: 0.1
    unit_of_measurement: "%"

  ev_session_soc_start_vf9:
    name: "EV Session SoC Start (VF9)"
    min: 0
    max: 100
    step: 0.1
    unit_of_measurement: "%"

  ev_fixed_cost_accumulated_cents:
    # max was 100000 (¢1000). At 3357 ¢/month this clamped in month 30 and
    # input_number.set_value then fails, silently freezing the accumulator.
    # 5000000 ¢ = $50,000 ≈ 124 years of fixed delivery charges.
    name: "EV Fixed Delivery Cost Accumulated"
    min: 0
    max: 5000000
    step: 1
    unit_of_measurement: "¢"

  ev_unknown_cost_cents:
    name: "EV Unattributed Cost Accumulated"
    min: 0
    max: 1000000
    step: 1
    unit_of_measurement: "¢"
input_datetime:
  airbnb_check_in_time:
    name: Airbnb Check-In Time
    has_date: false
    has_time: true
    initial: "15:00"
    icon: mdi:door-open
  airbnb_check_out_time:
    name: Airbnb Check-Out Time
    has_date: false
    has_time: true
    initial: "14:00"
    icon: mdi:door-closed
  # Set by lawn_watering_start_cycle after a SUCCESSFUL watering; read by its
  # every-2-days gate. Added 2026-07-14 to replace a gate keyed on the automation's
  # own last_triggered — that attribute is also bumped by manual/test triggers, is
  # NOT clearable (survives automation.reload) and has no API to set, so one 25 s
  # test silently cancelled the next real watering. This helper is settable, so a
  # test can be undone by just restoring the correct timestamp.
  lawn_last_watered:
    name: Lawn Last Watered
    has_date: true
    has_time: true
    icon: mdi:sprinkler-variant
  # Set by garden_watering_start_cycle after a SUCCESSFUL run. Unlike the lawn's
  # 2-day gate this does NOT block the next run: the veggie bed is watered on a
  # daily-eligible schedule because tomatoes and peppers need EVEN moisture
  # (swings cause blossom-end rot and split skins). Smart Irrigation's bucket
  # decides whether there is anything to deliver; this stamp is for the morning
  # report and for spotting a silently stalled chain.
  garden_last_watered:
    name: Garden Last Watered
    has_date: true
    has_time: true
    icon: mdi:sprout
  # Written only when Climate AI actually changes the Ecobee setpoint. This
  # supports a two-hour hold between ordinary changes; urgent comfort and
  # dehumidification corrections may bypass the hold.
  climate_ai_last_setpoint_change:
    name: Climate AI Last Setpoint Change
    has_date: true
    has_time: true
    icon: mdi:thermostat-clock

input_boolean:
  kitchen_auto_lights_disable:
    name: Kitchen Auto Lights Disable
    icon: mdi:lightbulb-off
  kitchen_occupied_motion:
    name: Kitchen Occupied (Motion)
    icon: mdi:motion-sensor
    initial: false
  kitchen_tuya_presence:
    name: Kitchen Tuya Human Presence
    icon: mdi:motion-sensor
    initial: false
  climate_ai_enabled:
    name: Climate AI Enabled
    icon: mdi:thermostat-auto
    initial: true
  climate_summer_mode:
    name: Climate Summer Mode
    icon: mdi:white-balance-sunny
    initial: true
  climate_winter_mode:
    name: Climate Winter Mode
    icon: mdi:snowflake
    initial: false
  lawn_watering_master_enable:
    name: "Lawn Watering Master Enable"
    icon: mdi:water-off
    initial: true
  garden_watering_master_enable:
    name: "Garden Watering Master Enable"
    icon: mdi:water-off
    initial: true
  house_away:
    name: "House Away Mode"
    icon: mdi:home-export-outline
  # initial: false is deliberate, matching stair_light_pir_owned below. Without it HA
  # restores the last state across a restart, and bedtime_shutdown_reset has a single
  # at: '20:00:00' trigger with no startup catch-up — so HA being down across 20:00 with
  # this ON stranded the latch until 20:00 the FOLLOWING day. binary_sensor.after_bedtime
  # would then read ON every evening from 20:00, handing the staircase to the hallway
  # panels while the household was still up (in December, from 16:45 sunset onward).
  # Trade-off: after a restart the /30 bedtime poll can re-run the shutdown once. That
  # sequence re-locks already-locked doors, re-shuts an already-shut garage and re-turns-off
  # already-off lights, so it is near-idempotent; the failure direction is now safe.
  bedtime_shutdown_done:
    name: "Bedtime Shutdown Done (nightly latch)"
    icon: mdi:sleep
    initial: false
  # Ownership marker for stairs_pir_motion_light: ON only while that automation is the
  # one keeping light.stair_light lit. The automation claims it only when it finds the
  # light OFF, and releases it whenever the light goes off by ANY path — so a stair
  # light turned on manually, by a scene, or by another automation is never auto-killed
  # by the 5-minute no-motion timer.
  # initial: false is deliberate — without it HA restores the last state, and a restart
  # while the light was on would strand the claim ON (light_went_off never fires, since
  # the light never went off). A stale claim would let the 5-minute timer switch off a
  # staircase somebody else had lit, which is the exact case this flag exists to prevent.
  stair_light_pir_owned:
    name: "Stair Light Held by PIR Automation"
    icon: mdi:motion-sensor
    initial: false
  # Enhancement C — set ON by hvac_pause_door_open while HVAC is paused for an open
  # exterior door; climate_ai_advisor checks this so it does not fight the pause.
  hvac_paused_door_open:
    name: HVAC Paused (Door Open)
    icon: mdi:door-open
    initial: false
  # Ownership marker for hallway_panels_stairs_pir, mirroring stair_light_pir_owned above.
  # ON only while that automation is the one holding the hallway Nanoleaf panels lit.
  # initial: false for the same restart reason as stair_light_pir_owned — a stale claim
  # would let the no-motion timer push the panels back to their resting state (off in
  # daylight, else 10% night light) over panels somebody else had set.
  hallway_panels_pir_owned:
    name: "Hallway Panels Held by PIR Automation"
    icon: mdi:motion-sensor
    initial: false
input_text:
