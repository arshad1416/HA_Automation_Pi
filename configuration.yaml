    unique_id: grizzl_e_cost_weekly
    cycle: weekly
  grizzl_cost_monthly:
    source: sensor.grizzl_e_total_cost
    name: "Grizzl-E Cost Monthly"
    unique_id: grizzl_e_cost_monthly
    cycle: monthly
  grizzl_cost_yearly:
    source: sensor.grizzl_e_total_cost
    name: "Grizzl-E Cost Yearly"
    unique_id: grizzl_e_cost_yearly
    cycle: yearly

  # === Per-Vehicle EV Charging Cost Tracking ===
  ioniq_6_cost_daily:
    source: sensor.ev_ioniq_6_total_cost
    cycle: daily
  ioniq_6_cost_monthly:
    source: sensor.ev_ioniq_6_total_cost
    cycle: monthly
  vf9_cost_daily:
    source: sensor.ev_vf9_total_cost
    cycle: daily
  vf9_cost_monthly:
    source: sensor.ev_vf9_total_cost
    cycle: monthly
  ioniq_6_energy_daily:
    source: sensor.ev_ioniq_6_total_energy
    cycle: daily
  ioniq_6_energy_monthly:
    source: sensor.ev_ioniq_6_total_energy
    cycle: monthly
  vf9_energy_daily:
    source: sensor.ev_vf9_total_energy
    cycle: daily
  vf9_energy_monthly:
