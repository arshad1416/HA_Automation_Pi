# 2026-07-10: these were top-level keys, which HA silently ignores ("Integration
# 'external_url' not found") — nested under homeassistant: so they actually apply.
homeassistant:
  external_url: "https://ha.arshadkazi.ca"
  internal_url: "http://192.168.0.102:8123"

default_config:

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

automation: !include_dir_merge_list automations/
script: !include scripts.yaml
scene: !include scenes.yaml

