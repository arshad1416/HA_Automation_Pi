# Emulated Hue — exposes HA devices to Echo Dots as fake Philips Hue bridge
# 2026-07-10: switched from expose-everything (1348 entities, Alexa clutter + ghost-entity
# poll errors) to an explicit allowlist. After restart: Alexa app -> forget Hue devices ->
# "Alexa, discover devices" to purge stale entries (e.g. deleted light.elements_b3cd_2).
emulated_hue:
  host_ip: 192.168.0.102
  listen_port: 80
  expose_by_default: false
  entities:
    # Kitchen
    light.kitchen_light: {hidden: false}
    light.kitchen_ceiling_fan: {hidden: false}
    light.island_light_light: {hidden: false}
    switch.kitchen_fan: {hidden: false}
    light.cabinet_light_strip_left_nanoleaf_light_strip: {hidden: false}
    light.cabinet_light_strip_center_nanoleaf_light_strip: {hidden: false}
    light.cabinet_light_strip_right_nanoleaf_light_strip: {hidden: false}
    light.nanoleaf_multicolor_ls_2: {hidden: false}
    # Family / living
    light.family_room_light: {hidden: false}
    switch.living_room_floor_lamp: {hidden: false}
    light.curtain_lights_v2: {hidden: false}
    # Halls / stairs / foyer
    switch.foyer_light: {hidden: false}
    switch.back_hallway_light_main_switch: {hidden: false}
    light.stair_light: {hidden: false}
    light.stair_light_2:
      name: Upper Stair Light
      hidden: false
    switch.basement_stair_light: {hidden: false}
    # Basement
    switch.basement_lights: {hidden: false}
    light.basement_tv: {hidden: false}
    # Master bed / bath
    light.master_bedroom_ceiling_fan: {hidden: false}
    switch.master_bedroom_fan_light: {hidden: false}
    light.master_bathroom_light: {hidden: false}
    # Izaan's room
    light.izaan_s_ceiling_fan: {hidden: false}
    light.izaan_s_lamp: {hidden: false}
    switch.izaan_s_bedroom_light: {hidden: false}
    # Mina's room
    light.mina_s_ceiling_fan: {hidden: false}
    switch.mina_s_light: {hidden: false}
    switch.mina_s_lamp: {hidden: false}
    # Guest room
    light.guest_room_ceiling_fan: {hidden: false}
    switch.guest_room_light: {hidden: false}
    # Baths / laundry
    switch.bathroom_light: {hidden: false}
    switch.powder_room_light: {hidden: false}
    switch.powder_room_mirror: {hidden: false}
    switch.laundry_room_light: {hidden: false}
    # Garage
    switch.garage_light_switch: {hidden: false}
    light.garage_left_downlight: {hidden: false}
    light.garage_right_downlight: {hidden: false}
    # Outdoor
    light.front_porch_downlight: {hidden: false}
    light.lamppost_bulb_1: {hidden: false}
    light.lamppost_bulb_2: {hidden: false}
    light.lamppost_bulb_3: {hidden: false}
    light.back_yard_lamp_socket: {hidden: false}
    light.wasserstein_smart_floodlight_2: {hidden: false}
    switch.patio_door_light: {hidden: false}
    switch.pool_light_2: {hidden: false}
    switch.halloween_lights: {hidden: false}
    switch.holiday_lights_switch: {hidden: false}
    switch.outdoor_decoration_smartplug_switch: {hidden: false}
    # Echo routine presence helpers (Alexa routines write to these)
    switch.kitchen_occupancy: {hidden: false}
    switch.stairs_occupancy: {hidden: false}
    # Scenes used by Echo routines
    scene.good_morning: {hidden: false}
    scene.good_night: {hidden: false}

# Limit history to 7 days to keep DB manageable
recorder:
  purge_keep_days: 7
  auto_purge: true

logger:
  default: warning
  logs:
    homeassistant.components.emulated_hue: error
    # VinFast integration — debug logging to diagnose device code flow
    custom_components.vinfast: debug
    custom_components.vinfast.api_auth: debug
    custom_components.vinfast.config_flow: debug
# Rest API commands for Climate AI - Direct API calls bypassing conversation agent
rest_command:
  climate_ai_gemini:
    url: "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash:generateContent"
    method: POST
    headers:
      x-goog-api-key: !secret gemini_api_key
      Content-Type: "application/json"
    payload: '{"contents":[{"parts":[{"text":{{ prompt | tojson }}}]}],"generationConfig":{"maxOutputTokens":4000}}'
    content_type: "application/json"
    timeout: 60

# ── Wyze Garage Cam (Garage Cam v3) ──────────────────────────────────
camera:
  - platform: ffmpeg
    name: Garage Cam
    input: rtsp://127.0.0.1:8554/garage

command_line:
  - sensor:
      name: Solar Power Now
      unique_id: solar_power_now
      command: >-
        /usr/local/bin/python3 -c 'import json;
        d=json.load(open("/config/apsystems.json"));
        print(int(d.get("power_approx_w",0)))'
      unit_of_measurement: W
      scan_interval: 300
  - sensor:
      name: Solar Energy Today
      unique_id: solar_energy_today
      command: >-
        /usr/local/bin/python3 -c 'import json;
        d=json.load(open("/config/apsystems.json"));
        print(d.get("today_kwh",0))'
      unit_of_measurement: kWh
      scan_interval: 300
  - sensor:
      name: Solar Energy Month
      unique_id: solar_energy_month
      command: >-
        /usr/local/bin/python3 -c 'import json;
        d=json.load(open("/config/apsystems.json"));
        print(d.get("month_kwh",0))'
      unit_of_measurement: kWh
      scan_interval: 300


  # ── Grizzl-E Smart EV charger (reads daemon JSON; single /logs client) ──
  - sensor:
      name: "Grizzl-E Power"
      unique_id: grizzl_e_power
      command: "cat /config/grizzl_e_state.json"
      unit_of_measurement: "W"
      device_class: power
      state_class: measurement
      scan_interval: 15
      value_template: "{{ value_json.power_w | round(1) }}"
      json_attributes:
        - charging
        - rssi_dbm
        - updated
  - binary_sensor:
      name: "Grizzl-E Charging"
      unique_id: grizzl_e_charging
      command: "cat /config/grizzl_e_state.json"
      device_class: battery_charging
      scan_interval: 15
      payload_on: "on"
      payload_off: "off"
      value_template: "{{ value_json.charging }}"
  - sensor:
      name: "Grizzl-E Diagnostics"
      unique_id: grizzl_e_diagnostics
      command: "cat /config/grizzl_e_state.json"
      scan_interval: 60
      unit_of_measurement: "bytes"
      value_template: "{{ value_json.free_heap }}"
      json_attributes:
        - disk_free_kb
        - rssi_dbm
        - power_w
        - updated

  - sensor:
      name: "Grizzl-E Total Energy"
      unique_id: grizzl_e_total_energy
      command: "cat /config/grizzl_e_state.json"
      unit_of_measurement: "kWh"
      device_class: energy
      state_class: total_increasing
      scan_interval: 15
      value_template: "{{ value_json.total_energy_kwh | round(4) }}"
  - sensor:
      name: "Grizzl-E Total Cost"
      unique_id: grizzl_e_total_cost
      command: "cat /config/grizzl_e_state.json"
      unit_of_measurement: "$"
      device_class: monetary
      state_class: total_increasing
      scan_interval: 15
      value_template: "{{ (value_json.total_cost_cents / 100) | round(4) }}"
      json_attributes:
        - total_cost_cents
        - session_energy_kwh
        - session_cost_cents
        - period_label
        - rate_cents_kwh
        - fixed_monthly_cad

template:
  - binary_sensor:
      - name: Kitchen Presence
        unique_id: kitchen_presence_combined
        device_class: occupancy
        state: >
          {{ is_state('input_boolean.kitchen_tuya_presence', 'on') }}
  # Aggregate of every indoor MOTION sensor (Ecobee + Echo presence switches included).
  # ON if anything is currently moving. Only device_class=motion sources + the two Echo
  # presence switches — occupancy/presence (mmWave) is deliberately EXCLUDED because it
  # stays ON while a person lies still, which would block the bedtime shutdown while asleep.
  # Used by bedtime_routine_auto: "off for 30 min" = house has been still = everyone settled.
  - binary_sensor:
      - name: Any Home Motion
        unique_id: any_home_motion
        device_class: motion
        state: >
          {{ [
               'binary_sensor.332d_motion',
               'binary_sensor.basement_motion',
               'binary_sensor.basement_motion_2',
               'binary_sensor.bbwg_motion',
               'binary_sensor.ecobee_motion',
               'binary_sensor.guest_room_motion',
               'binary_sensor.izaans_room_motion',
               'binary_sensor.izaans_room_motion_2',
               'binary_sensor.master_bedroom_motion',
               'binary_sensor.minas_room_motion',
               'binary_sensor.minas_room_motion_2',
               'binary_sensor.pir_motion_sensor_2_motion',
               'switch.kitchen_occupancy',
               'switch.stairs_occupancy'
             ] | select('is_state', 'on') | list | length > 0 }}




# ESPHome Kitchen mmWave Bridge — workaround for HA 2026.6.3 + Python 3.14 ESPHome integration bug
  - sensor:
      - name: "Grizzl-E Est. Monthly Bill"
        unique_id: grizzl_e_est_monthly_bill
        unit_of_measurement: "$"
        device_class: monetary
        state: >
          {{ (state_attr('sensor.grizzl_e_total_cost', 'fixed_monthly_cad') | default(33.57, true)
              + (states('sensor.grizzl_e_cost_monthly') | float(0))) | round(2) }}
  # ── Priority 5: Energy dashboard sensors (Enhancement spec) ────────────
  # Unified daily energy cost estimate (EV + house @ blended 15¢/kWh).
  - sensor:
      - name: "Home Daily Energy Cost Estimate"
        unique_id: home_daily_energy_cost
        unit_of_measurement: "$"
        device_class: monetary
        state: >
          {{ (states('sensor.grizzl_e_cost_daily') | float(0) +
              (states('sensor.grizzl_e_energy_daily') | float(0) * 0.15)) | round(2) }}
        attributes:
          ev_cost: "{{ states('sensor.grizzl_e_cost_daily') | default('unavailable', true) }}"
          pool_pump_state: "{{ states('switch.pool_pump_heater_socket_1') | default('unavailable', true) }}"
  # Monthly EV charging cost rollup.
  - sensor:
      - name: "Monthly EV Charging Cost"
        unique_id: monthly_ev_charging_cost
        unit_of_measurement: "$"
        device_class: monetary
        state: "{{ states('sensor.grizzl_e_cost_monthly') | float(0) | round(2) }}"
  # Last/current charging session cost (from daemon session_cost_cents attribute).
  - sensor:
      - name: "Grizzl-E Session Cost"
        unique_id: grizzl_e_session_cost
        unit_of_measurement: "$"
        device_class: monetary
        state: >
          {{ (state_attr('sensor.grizzl_e_total_cost', 'session_cost_cents') | default(0, true) | float(0) / 100) | round(2) }}
  # Charging efficiency (kWh delivered per 1% SoC). Ioniq 6 Long Range = 77.4 kWh pack
  # (≈0.774 kWh/%). Availability-gated so it is not computed when charger/session idle.
  - sensor:
      - name: "EV Charging Efficiency"
        unique_id: ev_charging_efficiency
        unit_of_measurement: "kWh/%"
        availability: >
          {{ (state_attr('sensor.grizzl_e_total_cost', 'session_energy_kwh') | default(0, true) | float(0)) > 1
             and (states('sensor.ioniq_6_ev_battery_level') | default(0, true) | float(0)) > 0 }}
        state: >
          {% set session_kwh = state_attr('sensor.grizzl_e_total_cost', 'session_energy_kwh') | default(0, true) | float(0) %}
          {% set soc = states('sensor.ioniq_6_ev_battery_level') | default(0, true) | float(0) %}
          {{ (session_kwh / (soc * 0.01 * 77.4)) | round(3) }}
        attributes:
          nominal_pack_kwh: 77.4
          expected_range: "0.74-0.80 kWh/% when healthy (Ioniq 6 77.4 kWh pack)"

shell_command:
  # [t] bracket trick: the pattern must not match this shell_command's own
  # process, or the kill loop terminates itself (return code -15) before
  # nohup ever runs — which left the bridge dead after every HA restart.
  start_tuya_kitchen_bridge: "for pid in $(pgrep -f '[t]uya_kitchen_bridge.py'); do kill $pid 2>/dev/null; done; nohup python3 /config/tuya_kitchen_bridge.py > /config/tuya_bridge.log 2>&1 &"


