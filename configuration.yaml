    name: Nightly Dim Brightness
    icon: mdi:brightness-6
    min: 1
    max: 100
    step: 5
    unit_of_measurement: '%'
    initial: 10
  airbnb_heater_temperature:
    name: Airbnb Heater Temperature
    icon: mdi:thermometer
    min: 10
